/* ---------- Review ---------- */
let R=null;
function startReview(cram){
  const ids=cram?shuffle(savedIds()):shuffle(dueIds()).sort((a,b)=>boxOf(a).b-boxOf(b).b);
  R={queue:ids.slice(0,cram?30:50),i:0,ok:0,again:0,rev:false,cram:!!cram,missed:new Set()};renderReview();
}
function renderReview(){
  const box=$('#reviewBox'),n=savedIds().length,due=dueIds().length;
  if(!R){
    const counts=[1,2,3,4,5].map(b=>savedIds().filter(id=>boxOf(id).b===b).length);
    const nd=nextDue();
    box.innerHTML=`<div class="row" style="padding:22px;text-align:center"><div style="font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--tx3)">Due for review</div>
    <div class="duebig" id="dueCount">${due}</div><div style="color:var(--tx2);font-size:14px;margin-top:4px">${due?`card${due===1?'':'s'} ready now`:n?`Next review: ${nd?fmtDay(nd):'—'}`:'Save ideas to start reviewing'}</div>
    <div class="boxes">${counts.map((c,i)=>`<div><b>${c}</b>Box ${i+1}<br>${INT[i]}d</div>`).join('')}</div>
    <p style="-webkit-line-clamp:unset;color:var(--tx3);font-size:13px;margin:10px 0 0">Spaced repetition: “Got it” moves a card up a box (review again in 1 → 3 → 7 → 14 → 30 days). “Again” sends it back to Box 1.</p>
    <div style="margin-top:16px;display:flex;flex-direction:column;gap:10px"><button class="btn primary wide" id="startRev" ${due?'':'disabled style="opacity:.5"'}>${due?`Start review · ${due} due`:'Nothing due — nice work'}</button>
    ${n?`<button class="btn wide" id="cramRev">Practise all ${n} saved (doesn’t change schedule)</button>`:''}</div>
    <p style="color:var(--tx3);font-size:12px;margin-top:12px">Last review: ${S.lastReview?fmtDay(S.lastReview):'never'}</p></div>`;
    return;
  }
  if(R.i>=R.queue.length){
    if(!R.cram){S.lastReview=dkey();save()}renderHeader();
    if(!R.fin){R.fin=true;if(!R.cram){S.stats.reviews=(S.stats.reviews||0)+1;save();addXP(10)}celebrate('🧠','Review complete!',`Recalled ${R.ok} of ${R.ok+R.again}${R.cram?'':' · +10 XP'}`,true)}
    box.innerHTML=`<div class="row" style="padding:22px;text-align:center"><div style="font-size:44px">✅</div><h3 style="margin:8px 0">Review complete</h3>
    <p style="-webkit-line-clamp:unset;color:var(--tx2)">Recalled ${R.ok} · Again ${R.again}${R.cram?' · practice mode':''}</p><div style="margin-top:18px"><button class="btn primary wide" id="endRev">Done</button></div></div>`;
    return;
  }

    const h=tl.length*80*s+40*s+bl.length*60*s+(al.length?60*s+40+al.length*48*s+50:0);return{tl,bl,al,h,s}};
  let L,s=1;do{L=layout(s);s-=.05}while(L.h>H-200-260&&s>.5);s=L.s;
  // tag
  x.font=`800 30px ${F}`;const tag=c.topic.toUpperCase(),tw=x.measureText(tag).width+48;x.fillStyle='rgba(245,185,66,.16)';rr(x,P,110,tw,58,29);x.fill();x.fillStyle='#f5b942';x.textBaseline='middle';x.fillText(tag,P+24,140);

    x.fillStyle='#4cc38a';x.font=`800 24px ${F}`;x.fillText('DO ONE THING TODAY',P+40,y+48);x.fillStyle='#cfe9dc';x.font=`600 ${Math.round(34*s)}px ${F}`;let ay=y+48+50*s;for(const l of L.al){x.fillText(l,P+40,ay);ay+=48*s}}

  x.fillStyle='#f5b942';rr(x,P,H-190,74,96,10);x.fill();x.fillStyle='#14161b';x.font=`800 40px ${F}`;x.textAlign='center';x.fillText((c.source||'?').replace(/^The /,'').charAt(0),P+37,H-128);x.textAlign='left';
  x.fillStyle='#eef0f4';x.font=`700 34px ${F}`;const src=wrap(x,c.source||'',MW-300)[0]||'';x.fillText(src,P+100,H-150);
  x.fillStyle='#a3a9b8';x.font=`400 30px ${F}`;x.fillText(wrap(x,c.author||'',MW-300)[0]||'',P+100,H-106);

}

/* ---------- Animated background ---------- */
const BG=(()=>{
  const cv=$('#bg'),x=cv.getContext('2d');let W=0,H=0,cur,tgt,parts=[],last=0,t0=performance.now(),looping=false;
  const h2r=h=>{h=h.replace('#','');return[0,2,4].map(i=>parseInt(h.slice(i,i+2),16))};
  cur=tmeta('').c.map(h2r);tgt=cur.map(a=>a.slice());
  function resize(){const d=Math.min(devicePixelRatio||1,1.5);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;x.setTransform(d,0,0,d,0,0);
    if(!parts.length)for(let i=0;i<34;i++)parts.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.7+.4,v:Math.random()*.22+.05,p:Math.random()*6.3});draw(performance.now())}
  function draw(now){const t=(now-t0)/1000,still=lowMotion();
    for(let i=0;i<2;i++)for(let k=0;k<3;k++)cur[i][k]+=(tgt[i][k]-cur[i][k])*(still?1:.035);
    const lt=isLight();x.globalCompositeOperation='source-over';x.fillStyle=lt?'#f6f3ee':'#0b0d12';x.fillRect(0,0,W,H);
    const mid=cur[0].map((v,i)=>(v+cur[1][i])/2),s=still?0:1;
    const blobs=[[cur[0],.55+.28*Math.sin(t*.13)*s,.22+.14*Math.cos(t*.11)*s,.78],[cur[1],.25+.28*Math.cos(t*.09)*s,.72+.14*Math.sin(t*.12)*s,.72],[mid,.85+.12*Math.sin(t*.07)*s,.55+.2*Math.cos(t*.08)*s,.5]];
    x.globalCompositeOperation=lt?'multiply':'lighter';
    for(const[c,bx,by,rs]of blobs){const r=Math.max(W,H)*rs,g=x.createRadialGradient(bx*W,by*H,0,bx*W,by*H,r),rgb=c.map(Math.round).join(',');g.addColorStop(0,`rgba(${rgb},.24)`);g.addColorStop(.5,`rgba(${rgb},.08)`);g.addColorStop(1,`rgba(${rgb},0)`);x.fillStyle=g;x.fillRect(0,0,W,H)}
    const pc=cur[0].map(v=>Math.round((v+255)/2)).join(',');
    for(const p of parts){if(!still){p.y-=p.v;p.x+=Math.sin(t*.5+p.p)*.12;if(p.y<-5){p.y=H+5;p.x=Math.random()*W}}x.fillStyle=`rgba(${pc},${(.18+.2*Math.sin(t*1.4+p.p)*s).toFixed(3)})`;x.beginPath();x.arc(p.x,p.y,p.r,0,6.283);x.fill()}

  function start(){if(!looping&&!lowMotion()){looping=true;requestAnimationFrame(loop)}else draw(performance.now())}
  function setPalette(topic){tgt=tmeta(topic).c.map(h2r);if(lowMotion())draw(performance.now())}
  addEventListener('resize',resize);RM.addEventListener&&RM.addEventListener('change',start);
  return{init(){resize();start()},setPalette,start};
})();

function voiceScore(v){const n=v.name||'',l=(v.lang||'').replace('_','-');let s=0;

function attachSwipe(el){
  let sx=0,sy=0,x=0,y=0,vx=0,vy=0,lt=0,lx=0,ly=0,pid=null,active=false,moved=false;
  const st={save:el.querySelector('.st-save'),skip:el.querySelector('.st-skip'),fav:el.querySelector('.st-fav')};
  const paint=()=>{el.style.transform=`translate(${x}px,${y}px) rotate(${x/16}deg)`;const uf=(-y>Math.abs(x))?Math.min(1,Math.max(0,-y/110)):0;
    st.save.style.opacity=Math.min(1,Math.max(0,x/110))*(1-uf);st.skip.style.opacity=Math.min(1,Math.max(0,-x/110))*(1-uf);st.fav.style.opacity=uf};
  el.addEventListener('pointerdown',e=>{if(e.target.closest('button')||animating)return;pid=e.pointerId;sx=lx=e.clientX;sy=ly=e.clientY;lt=performance.now();vx=vy=x=y=0;active=true;moved=false});
  el.addEventListener('pointermove',e=>{if(!active||e.pointerId!==pid)return;const dx=e.clientX-sx,dy=e.clientY-sy;
    if(!moved){if(Math.hypot(dx,dy)<8)return;if(dy>0&&Math.abs(dy)>Math.abs(dx)){active=false;return}moved=true;dragging=true;el.classList.add('drag');el.style.setProperty('--rx','0deg');el.style.setProperty('--ry','0deg');try{el.setPointerCapture(pid)}catch(_){}}
    const now=performance.now(),dt=Math.max(1,now-lt);vx=.75*((e.clientX-lx)/dt)+.25*vx;vy=.75*((e.clientY-ly)/dt)+.25*vy;lx=e.clientX;ly=e.clientY;lt=now;x=dx;y=dy<0?dy:dy*.3;paint()});
  const end=()=>{if(!active)return;active=false;if(!moved)return;dragging=false;
    const up=-y>Math.abs(x)*1.1&&(y<-100||vy<-.7),right=!up&&(x>100||vx>.7),left=!up&&(x<-100||vx<-.7);
    if(up||right||left)fling(up?'fav':right?'save':'skip');else spring()};
  function spring(){let svx=0,svy=0;(function f(){svx=(svx-x*.16)*.74;svy=(svy-y*.16)*.74;x+=svx;y+=svy;paint();
    if(Math.abs(x)+Math.abs(y)+Math.abs(svx)+Math.abs(svy)>.6)requestAnimationFrame(f);else{x=y=0;el.classList.remove('drag');el.style.transform='';Object.values(st).forEach(s=>s.style.opacity=0)}})()}
  function fling(kind){animating=true;let fx=kind==='fav'?vx*16:Math.sign(kind==='save'?1:-1)*Math.max(Math.abs(vx)*16,18),fy=kind==='fav'?Math.min(vy*16,-20):vy*16;
    (function f(){fx*=1.035;if(kind==='fav')fy*=1.04;else fy+=.7;x+=fx;y+=fy;paint();
      if(Math.abs(x)>innerWidth*1.3||y<-innerHeight||y>innerHeight*1.2)finishFling(kind,el);else requestAnimationFrame(f)})()}
  el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
}

function breatheHTML(){return `<div class="panel" style="text-align:center"><p style="color:var(--tx2);margin:0">Box breathing: in 4 · hold 4 · out 4 · hold 4. Follow the dot.</p>
  <div class="bbox"><div class="bcirc" id="bCirc"></div><div class="bdot" id="bDot"></div></div>
  <div class="blabel" id="bLabel">${B.on?'':'Ready when you are'}</div><div class="bcount" id="bCount">${B.on?'':'🌬️'}</div>
  <div class="chiprow">${[2,4,8].map(n=>`<button class="chip ${n===B.rounds?'on':''}" data-rounds="${n}" ${B.on?'disabled style="opacity:.5"':''}>${n} rounds</button>`).join('')}</div>
  <button class="btn ${B.on?'':'primary'} wide" id="${B.on?'bStop':'bGo'}">${B.on?'Stop':'▶ Start breathing'}</button></div>`}
function bStart(){B.on=true;B.start=performance.now();B.lastPh=-1;renderTools();requestAnimationFrame(bLoop)}
function bStop(done){B.on=false;if(done){S.stats.breathe=(S.stats.breathe||0)+1;save();addXP(5);celebrate('🌬️','Reset complete',`${B.rounds} rounds of box breathing. Notice how you feel.`,false)}if(view==='tools'&&tool==='breathe')renderTools()}
function bLoop(){if(!B.on)return;const el=performance.now()-B.start,total=B.rounds*4*PD;if(el>=total)return bStop(true);
  const ph=Math.floor(el/PD)%4,pt=(el%PD)/PD,dot=$('#bDot'),circ=$('#bCirc');
  if(ph!==B.lastPh){B.lastPh=ph;SND.sfx(['in','hold','out','hold'][ph]);buzz(25);const l=$('#bLabel');if(l)l.textContent=PH[ph]}
  const c=$('#bCount');if(c)c.textContent=(4-Math.floor(pt*4))+' · round '+(Math.floor(el/(4*PD))+1)+'/'+B.rounds;
  if(dot&&circ){const p=lowMotion()?0:pt,pos=[[p,0],[1,p],[1-p,1],[0,1-p]][ph];dot.style.transform=`translate(${pos[0]*200}px,${pos[1]*200}px)`;
    const sc=ph===0?.55+.45*p:ph===1?1:ph===2?1-.45*p:.55;circ.style.transform=`scale(${lowMotion()?(ph<2?1:.55):sc})`}
  requestAnimationFrame(bLoop)}

/* Procedural illustration: deterministic per card, coloured by topic */
function artSVG(c){const hs=hash((c.id||'')+c.title),r=rng(hs),m=tmeta(c.topic),a=m.c[0],b=m.c[1],u='ag'+hs.toString(36);
  const style={'Science':4,'History':5,'Maths':6,'Faith':2,'Faith & Wisdom':2,'Art':1}[c.topic]??Math.floor(r()*4);
  let s=`<svg viewBox="0 0 400 160" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration"><defs><linearGradient id="${u}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient><radialGradient id="${u}r" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs><rect width="400" height="160" fill="url(#${u})" opacity=".38"/>`;
  const f=n=>n.toFixed(1);
  if(style===0){for(let i=0;i<5;i++){const y=40+i*24+r()*10,amp=8+r()*18,o=r()*60;s+=`<path d="M0 ${f(y)} C ${f(100+o)} ${f(y-amp)}, ${f(220-o)} ${f(y+amp)}, 400 ${f(y-amp/2)} L400 160 L0 160Z" fill="${i%2?a:b}" opacity="${f(.12+i*.07)}"/>`}}
  else if(style===1){for(let i=0;i<10;i++){const x=r()*400,y=r()*160,rr=10+r()*46;s+=`<path d="M${f(x-rr)} ${f(y)} Q ${f(x-rr*.6)} ${f(y-rr*1.1)} ${f(x+rr*.2)} ${f(y-rr*.8)} T ${f(x+rr)} ${f(y+rr*.2)} Q ${f(x+rr*.3)} ${f(y+rr)} ${f(x-rr)} ${f(y)}Z" fill="${i%3?a:b}" opacity="${f(.18+r()*.35)}"/>`}}
  else if(style===2){const cx=80+r()*240,cy=150;for(let i=0;i<15;i++){const an=Math.PI+(i/14)*Math.PI,l=300;s+=`<path d="M${f(cx)} ${cy} L${f(cx+Math.cos(an-.045)*l)} ${f(cy+Math.sin(an-.045)*l)} L${f(cx+Math.cos(an+.045)*l)} ${f(cy+Math.sin(an+.045)*l)}Z" fill="${i%2?a:b}" opacity=".24"/>`}s+=`<circle cx="${f(cx)}" cy="${cy}" r="60" fill="url(#${u}r)" opacity=".7"/>`}
  else if(style===3){for(let j=0;j<3;j++){let d=`M0 160 L0 ${90+j*20}`;for(let x=0;x<=400;x+=40)d+=` L${x} ${f(60+j*25+r()*40)}`;s+=`<path d="${d} L400 160Z" fill="${j%2?a:b}" opacity="${f(.2+j*.15)}"/>`}s+=`<circle cx="${f(50+r()*300)}" cy="${f(30+r()*20)}" r="14" fill="#fff" opacity=".55"/>`}
  else if(style===4){const cx=300+r()*60,cy=70+r()*30;for(let i=0;i<3;i++)s+=`<ellipse cx="${f(cx)}" cy="${f(cy)}" rx="70" ry="22" fill="none" stroke="${i%2?a:b}" stroke-width="3" opacity=".75" transform="rotate(${i*60+r()*10} ${f(cx)} ${f(cy)})"/>`;s+=`<circle cx="${f(cx)}" cy="${f(cy)}" r="10" fill="${a}"/>`;for(let i=0;i<6;i++)s+=`<circle cx="${f(r()*220)}" cy="${f(r()*160)}" r="${f(8+r()*22)}" fill="none" stroke="${b}" stroke-width="2" opacity=".35"/>`}
  else if(style===5){const x0=200+r()*80;s+=`<path d="M${x0-30} 70 L${x0+90} 30 L${x0+210} 70Z" fill="${a}" opacity=".55"/>`;for(let i=0;i<5;i++)s+=`<rect x="${f(x0-20+i*48)}" y="74" width="18" height="76" rx="3" fill="${i%2?a:b}" opacity=".5"/>`;s+=`<rect x="${x0-30}" y="148" width="240" height="8" fill="${b}" opacity=".6"/>`;for(let i=0;i<4;i++)s+=`<path d="M0 ${f(110+i*12)} Q 100 ${f(95+i*12+r()*10)} 200 ${f(115+i*10)}" stroke="${a}" stroke-width="2" fill="none" opacity=".3"/>`}
  else{for(let x=0;x<=400;x+=20)s+=`<path d="M${x} 0V160" stroke="#fff" stroke-width=".6" opacity=".12"/>`;for(let y=0;y<=160;y+=20)s+=`<path d="M0 ${y}H400" stroke="#fff" stroke-width=".6" opacity=".12"/>`;const x0=230+r()*40;s+=`<path d="M${x0} 140 L${x0+120} 140 L${x0} 40Z" fill="${a}" opacity=".5"/><circle cx="${f(80+r()*60)}" cy="80" r="44" fill="none" stroke="${b}" stroke-width="4" opacity=".7"/><path d="M${f(40)} 130 Q 120 ${f(20+r()*20)} 200 130" stroke="${a}" stroke-width="3" fill="none" opacity=".6"/>`}
  for(let i=0;i<12;i++)s+=`<circle cx="${f(r()*400)}" cy="${f(r()*160)}" r="${f(r()*1.8+.4)}" fill="#fff" opacity="${f(.3+r()*.5)}"/>`;
  return s+'</svg>'}

/* ===================== v4: on-device personalisation engine ===================== */
function DEFM(){return{c:{},t:{},hr:Array(24).fill(0),fh:Array(24).fill(0),lv:{},days:{},qh:[],rh:[]}}
const BR=(()=>{
  // Signal weights for topic affinity. Affinity halves every 14 days (exponential decay).
  const W={save:3,fav:4,skip:-1.5,act:2,rok:.5,rag:.3,qok:.5,qmiss:.2},HALF=14;
  const M=()=>S.model||(S.model=DEFM());
  const dayN=k=>{const[y,m,d]=k.split('-').map(Number);return Date.UTC(y,m-1,d)/864e5};
  function aff(topic){const x=M().t[topic];if(!x)return 0;return x.v*Math.pow(.5,(dayN(dkey())-dayN(x.d))/HALF)}
  function bump(topic,w){const m=M(),v=aff(topic)+w;m.t[topic]={v:Math.max(-10,Math.min(60,v)),d:dkey()}}
  function cs(id){const m=M();return m.c[id]||(m.c[id]={n:0,s:0,k:0,f:0,d:0,ra:0,rw:0,qo:0,qm:0,a:0})}
  function day(){const m=M(),k=dkey();if(!m.days[k]){m.days[k]={n:0,d:0,s:0,k:0,f:0};const ks=Object.keys(m.days).sort();while(ks.length>90)delete m.days[ks.shift()]}return m.days[k]}
  function sig(id,type){const c=byId(id);if(!c)return;const st=cs(id),m=M(),dd=day();
    switch(type){case 'save':st.s++;dd.s++;break;case 'fav':st.f++;dd.f++;break;case 'skip':st.k++;dd.k++;break;case 'act':st.a++;break;
      case 'rok':st.ra++;m.rh.push(1);break;case 'rag':st.rw++;m.rh.push(0);break;case 'qok':st.qo++;m.qh.push(1);break;case 'qmiss':st.qm++;m.qh.push(0);break}
    m.rh=m.rh.slice(-60);m.qh=m.qh.slice(-30);const w=W[type]||0;bump(c.topic,w);m.hr[new Date().getHours()]+=Math.max(.3,Math.abs(w));save()}
  let cur=null,t0=0;
  function enter(id){if(cur===id)return;leave();cur=id;t0=performance.now();cs(id).n++;day().n++;const m=M();m.lv[lvl()]=(m.lv[lvl()]||0)+1;m.hr[new Date().getHours()]+=.2;save()}
  function leave(){if(!cur)return;const ms=Math.min(60000,performance.now()-t0),c=byId(cur);cs(cur).d+=ms;day().d+=ms;
    if(c){if(ms>6000)bump(c.topic,Math.min(1.5,ms/12000));else if(ms<1800)bump(c.topic,-.3)}cur=null;save()}
  function focus(){M().fh[new Date().getHours()]++;save()}
  const acc=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
  // Adaptive spacing: scale Leitner intervals by recent recall accuracy; shorten for cards you keep missing.
  function revMult(id){const m=M(),r=m.rh.slice(-30);let k=1;if(r.length>=8){const a=acc(r);k=a>=.9?1.3:a>=.8?1.15:a<.5?.6:a<.65?.8:1}
    const st=id&&m.c[id];if(st&&st.rw>=2&&st.rw>st.ra)k*=.75;return Math.max(.5,Math.min(1.6,k))}
  // Adaptive quiz: 1 easy (3 options, other topics) · 2 medium · 3 hard (4 options, same topic)
  function quizDiff(){const q=M().qh.slice(-12);if(q.length<4)return 2;const a=acc(q);return a>=.85?3:a<.5?1:2}
  function weak(id){const st=M().c[id];return st?(st.qm*2+st.rw*1.5)-(st.qo+st.ra)*.5:0}
  // Feed ranking: ~80% exploit (4 'For you' cards by affinity) + ~20% explore (1 card from your least-seen topic).
  function rank(pool,r,n){const pref=new Set(S.prefs.topics||[]),m=M();
    const unread=pool.filter(c=>!S.read[c.id]),readP=pool.filter(c=>S.read[c.id]).sort((a,b)=>(S.read[a.id]<S.read[b.id]?-1:1));
    const sc=c=>aff(c.topic)+(pref.has(c.topic)?2.5:0)+r()*1.6+(c.id[0]==='u'?.6:0);
    const ranked=unread.map(c=>[c,sc(c)]).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
    const pick=[],why={},cnt={};const nEx=Math.max(1,Math.round(n*.2)),nFy=n-nEx;
    for(const c of ranked){if(pick.length>=nFy)break;if((cnt[c.topic]||0)>=2)continue;pick.push(c);cnt[c.topic]=(cnt[c.topic]||0)+1;why[c.id]='fy'}
    const exposure=t=>pool.filter(c=>c.topic===t).reduce((s,c)=>s+((m.c[c.id]||{}).n||0)+(S.read[c.id]?1:0),0)+Math.max(0,aff(t))*.5;
    const tops=[...new Set(unread.map(c=>c.topic))].filter(t=>!cnt[t]).sort((a,b)=>exposure(a)-exposure(b)||r()-.5);
    for(const t of tops){if(pick.length>=n)break;const opts=unread.filter(c=>c.topic===t&&!pick.includes(c));if(opts.length){const c=opts[Math.floor(r()*opts.length)];pick.splice(Math.min(2,pick.length),0,c);why[c.id]='ex'}}
    for(const c of ranked.concat(readP)){if(pick.length>=n)break;if(!pick.includes(c)){pick.push(c);why[c.id]=why[c.id]||'fy'}}
    return{ids:pick.slice(0,n).map(c=>c.id),why}}
  function reset(){S.model=DEFM();save()}
  return{sig,enter,leave,focus,revMult,quizDiff,weak,rank,aff,M,acc,cs,reset}
})();

function insightData(){const m=BR.M(),cs=Object.entries(m.c),sum=k=>cs.reduce((s,[,x])=>s+(x[k]||0),0);
  const views=sum('n'),kept=cs.filter(([,x])=>x.s||x.f).length,seen=Math.max(kept,cs.filter(([,x])=>x.n).length),saves=sum('s'),favs=sum('f'),skips=sum('k'),dwell=sum('d');
  const tps=[...new Set([...TOPICS,...SUBJECTS,...Object.keys(m.t)])].map(t=>[t,BR.aff(t)]).filter(x=>x[1]>.05).sort((a,b)=>b[1]-a[1]);
  const per={};for(const[id,x]of cs){const c=byId(id);if(!c)continue;const p=per[c.topic]||(per[c.topic]={ok:0,n:0});p.ok+=x.ra+x.qo;p.n+=x.ra+x.rw+x.qo+x.qm}
  const accT=Object.entries(per).filter(([,p])=>p.n>=3).map(([t,p])=>[t,p.ok/p.n,p.n]).sort((a,b)=>b[1]-a[1]);
  const hrs=m.hr.map((v,h)=>v+m.fh[h]*3),tot=hrs.reduce((a,b)=>a+b,0),peak=hrs.indexOf(Math.max(...hrs));
  const B=[['Early morning',5,8],['Morning',9,11],['Afternoon',12,16],['Evening',17,20],['Night',21,28]];
  const bScore=B.map(([n,a,b])=>{let s=0;for(let h=a;h<=b;h++)s+=hrs[h%24];return[n,s]}).sort((a,b)=>b[1]-a[1]);
  const lvTop=Object.entries(m.lv).sort((a,b)=>b[1]-a[1])[0];
  const saved=savedIds(),avgBox=saved.length?saved.reduce((s,id)=>s+boxOf(id).b,0)/saved.length:0;
  const rAcc=BR.acc(m.rh.slice(-30)),qAcc=BR.acc(m.qh.slice(-12));
  const t=dkey(),days14=[];for(let i=13;i>=0;i--){const k=addDays(t,-i);days14.push([k,Object.values(S.read).filter(d=>d===k).length+((m.days[k]||{}).n||0)*0])}
  const wk=a=>a.reduce((s,x)=>s+x[1],0),thisW=wk(days14.slice(7)),lastW=wk(days14.slice(0,7));
  const acts=Object.keys(S.actions).length,reads=Object.keys(S.read).length,arts=LEARN.filter(c=>c.img&&S.read[c.id]).length;
  return{views,kept,seen,saves,favs,skips,dwell,tps,accT,hrs,tot,peak,bScore,lvTop,saved,avgBox,rAcc,qAcc,days14,thisW,lastW,acts,reads,arts}}
function insightsSummary(){const d=insightData();if(d.views<3)return 'Read a few ideas and your patterns will appear here.';

const cardSpeech=c=>`${c.title}. ${lvText(c)}${c.action?' Do one thing today: '+c.action:''}`;

function syncSpeak(){$$('[data-act=speak]').forEach(b=>{const on=TTS.speaking&&b.dataset.id===TTS.id;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on);b.setAttribute('aria-label',on?'Stop reading':'Read aloud')})}
const spkBtn=(c,cls='watch spk')=>TTS.ok?`<button class="${cls}" data-act="speak" data-id="${esc(c.id)}" aria-label="Read aloud" aria-pressed="false">🔊</button>`:'';
/* ---------- Story mode ---------- */
const ST={on:false,i:0,ids:[],dur:8000,el:0,last:0,paused:false,raf:0,hold:0,held:false,daily:false,waitTTS:false};
function storyOpen(ids,daily){ids=(ids||[]).filter(byId);if(!ids.length)return toast('No ideas to play yet');stopSpeak();if(SND.playing()){}
  Object.assign(ST,{on:true,ids,daily:!!daily,i:daily?Math.min(S.daily.idx,ids.length-1):0,paused:false});const o=$('#story');o.classList.add('on');o.setAttribute('aria-hidden','false');document.body.classList.add('noscroll');storyRender();buzz(15);
  cancelAnimationFrame(ST.raf);ST.last=performance.now();ST.raf=requestAnimationFrame(storyTick)}

    o.innerHTML=`${segs}<div class="sthead"><span></span><button class="stx" id="stClose" aria-label="Close stories">✕</button></div><div class="stbody end"><div style="font-size:64px">🎉</div><h2>Story complete</h2><p>You’ve seen all ${n} ideas. +10 XP</p><div class="btnrow"><button class="btn" id="bonusBtn">🎲 Bonus card</button><button class="btn primary" id="stClose2">Done</button></div></div>`;
    if(!ST.endFx){ST.endFx=1;FX.burst(90);SND.sfx('win');buzz([40,30,40])}return}
  ST.endFx=0;const c=byId(ST.ids[ST.i]);markRead(c.id);BR.enter(c.id);const words=cardSpeech(c).split(/\s+/).length;
  ST.dur=Math.max(6000,Math.min(22000,words*330/((S.settings.tts||{}).rate||1)));ST.el=0;
  o.style.cssText=gvars(c.topic);
  o.innerHTML=`${segs}<div class="sthead"><span class="stt">${tmeta(c.topic).e} ${esc(c.topic)} · <span aria-live="polite">${ST.i+1} of ${n}</span></span>${spkBtn(c,'stx spk')}<button class="stx" id="stPause" aria-label="${ST.paused?'Resume':'Pause'}">${ST.paused?'▶':'❚❚'}</button><button class="stx" id="stClose" aria-label="Close stories">✕</button></div>
  <div class="stbody" id="stBody"><div class="stArt" aria-hidden="true">${c.img?`<img src="${esc(c.img)}" alt="">`:artSVG(c)}</div><h2>${esc(c.title)}</h2><p class="${lvl()==='pre'?'big':''}">${esc(lvText(c))}</p>${actHTML(c)}<div class="stsrc">${esc(c.source||'')}${c.author?' · '+esc(c.author):''}</div></div>
  <div class="stfoot"><button class="btn fav ${isFav(c.id)?'on':''}" data-act="fav" data-id="${esc(c.id)}" aria-label="Favourite">${ICON.heart}</button><button class="btn saved ${isSaved(c.id)?'on':''}" id="stSave" aria-label="Save to stash">${ICON.bm}</button><button class="btn" data-act="share" data-id="${esc(c.id)}" aria-label="Share as image">${ICON.share}</button><span class="sthint">Tap ◀ ▶ · hold to pause</span></div>`;
  ST.waitTTS=false;if((S.settings.tts||{}).auto&&TTS.ok){ST.waitTTS=speak(cardSpeech(c),c.id,()=>{ST.waitTTS=false;if(ST.on&&!ST.paused&&ST.el>=ST.dur*.5)storyGo(1)})}}
function storyTick(now){if(!ST.on)return;const dt=now-ST.last;ST.last=now;if(!ST.paused&&ST.i<ST.ids.length&&!$('#sheet').classList.contains('on')){ST.el+=dt;
    const b=$$('#story .segs b')[ST.i];if(b)b.style.width=Math.min(100,ST.el/ST.dur*100)+'%';
    if(ST.el>=ST.dur&&!ST.waitTTS)storyGo(1);else if(ST.waitTTS&&ST.el>=ST.dur*1.8){ST.waitTTS=false;storyGo(1)}}
  ST.raf=requestAnimationFrame(storyTick)}
function storyGo(d){if(ST.i>=ST.ids.length&&d>0)return;const ni=ST.i+d;if(ni<0){ST.el=0;return}if(ST.daily&&ni<=S.daily.ids.length){S.daily.idx=Math.max(S.daily.idx,Math.min(ni,S.daily.ids.length));save()}ST.i=Math.min(ni,ST.ids.length);SND.sfx('flip');buzz(8);storyRender()}
function storyPause(p){ST.paused=p;if(TTS.ok&&TTS.speaking)try{p?speechSynthesis.pause():speechSynthesis.resume()}catch(_){}const b=$('#stPause');if(b){b.textContent=p?'▶':'❚❚';b.setAttribute('aria-label',p?'Resume':'Pause')}$('#story').classList.toggle('paused',p)}
function storyClose(){ST.on=false;cancelAnimationFrame(ST.raf);stopSpeak();BR.leave();const o=$('#story');o.classList.remove('on','paused');o.setAttribute('aria-hidden','true');o.innerHTML='';document.body.classList.remove('noscroll');ST.paused=false;
  if(S.daily)renderFeed();refresh()}
(()=>{const o=$('#story');let sx=0,sy=0;
  o.addEventListener('pointerdown',e=>{if(e.target.closest('button,a,.act'))return;sx=e.clientX;sy=e.clientY;ST.held=false;clearTimeout(ST.hold);ST.hold=setTimeout(()=>{ST.held=true;storyPause(true)},220)});
  o.addEventListener('pointerup',e=>{if(e.target.closest('button,a,.act'))return;clearTimeout(ST.hold);if(ST.held){ST.held=false;storyPause(false);return}
    if(e.clientY-sy>90)return storyClose();if(ST.i>=ST.ids.length)return;storyGo(e.clientX<innerWidth*.33?-1:1)});
  o.addEventListener('pointercancel',()=>{clearTimeout(ST.hold);if(ST.held){ST.held=false;storyPause(false)}})})();
/* ---------- Bonus card shuffle ---------- */
function bonusCard(){const used=new Set((S.daily&&S.daily.ids)||[]);let pool=SEED.concat(S.cards).filter(c=>!S.read[c.id]&&!used.has(c.id));if(!pool.length)pool=SEED.filter(c=>!used.has(c.id));
  const pick=pool[Math.floor(Math.random()*pool.length)];if(ST.on)storyClose();
  openSheet(`<div class="shuf" aria-live="polite"><div class="dice" aria-hidden="true">🎲</div><div id="shufT">Shuffling…</div></div>`);SND.sfx('flip');buzz([10,30,10]);
  let k=0;const steps=lowMotion()?1:9,iv=setInterval(()=>{const t=$('#shufT');if(t)t.textContent=pool[Math.floor(Math.random()*pool.length)].title;if(++k>=steps){clearInterval(iv);S.stats.bonus=(S.stats.bonus||0)+1;save();toast('🎲 Bonus card!');viewSheet(pick.id)}},lowMotion()?10:85)}

/* ---------- Habits ---------- */
const HAB_E=['💧','📖','🙏','🏃','🧘','🥗','😴','✍️','💰','📵'];let HE='💧';
function habStreak(h){let k=dkey(),n=0;if(!h.days[k])k=addDays(k,-1);while(h.days[k]){n++;k=addDays(k,-1)}return n}
function habBest(h){const ds=Object.keys(h.days).sort();let b=0,c=0,prev=null;for(const d of ds){c=prev&&addDays(prev,1)===d?c+1:1;b=Math.max(b,c);prev=d}return b}
function habitsHTML(){const t=dkey(),days=[...Array(7)].map((_,i)=>addDays(t,i-6));
  const sug=[['💧','Drink water'],['📖','Read Scripture'],['🏃','Move 20 min'],['🙏','Pray'],['📵','No phone first hour']];
  const list=S.habits.length?S.habits.map(h=>{const s=habStreak(h);return `<div class="habit"><div class="hh"><span class="he" aria-hidden="true">${esc(h.e)}</span><b>${esc(h.name)}</b><span class="hs" title="Current streak">🔥 ${s}</span><button class="btn sm ghost" data-hdel="${esc(h.id)}" aria-label="Delete habit ${esc(h.name)}">✕</button></div>
    <div class="hgrid">${days.map(k=>{const on=!!h.days[k],[y,m,d]=k.split('-').map(Number),wd=new Date(y,m-1,d).toLocaleDateString(undefined,{weekday:'narrow'});return `<button class="hd ${on?'on':''} ${k===t?'today':''}" data-hday="${esc(h.id)}|${k}" aria-pressed="${on}" aria-label="${esc(h.name)}, ${fmtDay(k)}: ${on?'done':'not done'}"><small>${wd}</small>${on?'✓':d}</button>`}).join('')}</div>
    <small class="hmeta">Best streak ${habBest(h)} · ${Object.keys(h.days).length} check-ins</small></div>`}).join('')
    :`<div class="empty">No habits yet. Start with one tiny habit — tap a suggestion or add your own.<div class="chiprow" style="margin-top:12px">${sug.map(([e,n])=>`<button class="chip" data-hsug="${e}|${esc(n)}">${e} ${esc(n)}</button>`).join('')}</div></div>`;
  return `<p class="hint" style="text-align:left;margin:0 0 10px">Check in daily. Each check-in +5 XP; streaks unlock badges.</p>${list}

function addHabit(e,name){name=String(name||'').trim();if(!name)return;S.habits.push({id:uid('h'),name,e,created:dkey(),days:{}});save();toast('Habit added');renderTools()}
function toggleHabit(id,k){const h=S.habits.find(x=>x.id===id);if(!h)return;if(h.days[k])delete h.days[k];else{h.days[k]=1;awardOnce('hab:'+id+':'+k,5);SND.sfx('tick');buzz(20);
    const s=habStreak(h);if(k===dkey()&&[3,7,21,30,66,100].includes(s))celebrate(h.e,`${s}-day streak: ${h.name}`,'Small habits, big change. Keep going!',s>=7)}save();checkBadges();renderTools()}

function journalSave(quiet){const am=$('#jAm'),pm=$('#jPm');if(!am)return;const k=dkey(),e=S.journal[k]||{};e.idea=e.idea||ioid()||null;e.am=am.value.trim();e.pm=pm.value.trim();e.ts=Date.now();S.journal[k]=e;

/* ---------- Goals ---------- */
function goalPc(g){return g.steps.length?Math.round(g.steps.filter(s=>s.done).length/g.steps.length*100):0}
function goalsHTML(){const t=dkey(),saved=savedIds().map(byId).filter(Boolean);

function goalStep(gid,sid){const g=S.goals.find(x=>x.id===gid);if(!g)return;const s=g.steps.find(x=>x.id===sid);if(!s)return;s.done=!s.done;buzz(15);SND.sfx(s.done?'tick':'flip');
  if(goalPc(g)===100&&!g.doneAt){g.doneAt=dkey();awardOnce('goal:'+g.id,50);celebrate('🏆','Goal achieved!',g.title+' · +50 XP',true)}else if(goalPc(g)<100)g.doneAt=null;save();checkBadges();renderTools()}
/* ---------- Year heatmap + weekly summary ---------- */
function actMap(){const m={},add=(k,n=1)=>{if(k)m[k]=(m[k]||0)+n};Object.values(S.read).forEach(k=>add(k));Object.values(S.actions).forEach(k=>add(k,2));
  S.habits.forEach(h=>Object.keys(h.days).forEach(k=>add(k)));Object.entries(S.journal).forEach(([k,e])=>add(k,(e.am?1:0)+(e.pm?1:0)));S.days.forEach(k=>add(k,0));return m}
function heatHTML(){const m=actMap(),t=dkey(),[y,mo,d]=t.split('-').map(Number),today=new Date(y,mo-1,d),start=new Date(y,mo-1,d-364-today.getDay());
  let cells='',months='',active=0,total=0,lastM=-1;const nW=53;
  for(let w=0;w<nW;w++){const wd=new Date(start.getFullYear(),start.getMonth(),start.getDate()+w*7);if(wd.getMonth()!==lastM&&wd.getDate()<=7){months+=`<span style="grid-column:${w+1}">${wd.toLocaleDateString(undefined,{month:'short'})}</span>`;lastM=wd.getMonth()}
    for(let i=0;i<7;i++){const dd=new Date(start.getFullYear(),start.getMonth(),start.getDate()+w*7+i),k=dkey(dd);if(dd>today){cells+='<i class="f"></i>';continue}
      const n=m[k]||0,l=n===0?0:n<=2?1:n<=5?2:n<=9?3:4;if(n){active++;total+=n}cells+=`<i class="l${l}" title="${fmtDay(k)}: ${n}"></i>`}}
  return `<div class="heatwrap"><div class="hmonths">${months}</div><div class="heat" role="img" aria-label="Activity heatmap: ${active} active days in the last year">${cells}</div></div>
  <div class="hleg"><span>${active} active day${active===1?'':'s'} · ${total} activities</span><span>Less <i class="l0"></i><i class="l1"></i><i class="l2"></i><i class="l3"></i><i class="l4"></i> More</span></div>`}
function weekSumHTML(){const t=dkey(),m=actMap(),rng7=o=>[...Array(7)].map((_,i)=>addDays(t,-i-o));const cur=rng7(0),prev=rng7(7);
  const cnt=(days,f)=>days.reduce((s,k)=>s+f(k),0),reads=k=>Object.values(S.read).filter(x=>x===k).length,acts=k=>Object.values(S.actions).filter(x=>x===k).length,
    habs=k=>S.habits.reduce((s,h)=>s+(h.days[k]?1:0),0),jr=k=>S.journal[k]&&(S.journal[k].am||S.journal[k].pm)?1:0,act=k=>(m[k]||S.days.includes(k))?1:0;
  const rows=[['📖','Ideas read',reads],['✅','Actions done',acts],['🔁','Habit check-ins',habs],['📓','Journal days',jr],['🔥','Active days',act]].map(([e,n,f])=>{const a=cnt(cur,f),b=cnt(prev,f),dlt=a-b;
    return `<div class="wsr"><span>${e} ${n}</span><b>${a}</b><span class="${dlt>0?'up':dlt<0?'down':''}" aria-label="${dlt>=0?'up':'down'} ${Math.abs(dlt)} vs last week">${dlt>0?'▲':dlt<0?'▼':'•'} ${Math.abs(dlt)}</span></div>`}).join('');
  const best=cur.map(k=>[k,m[k]||0]).sort((a,b)=>b[1]-a[1])[0];
  return `<div class="wsum">${rows}<p class="muted" style="margin:8px 0 0">${best&&best[1]?`Best day: ${fmtDay(best[0])} (${best[1]} activities).`:'No activity logged this week yet — today is a great day to start.'} Compared with the previous 7 days.</p></div>`}
/* ---------- Settings: theme, accent, read aloud, haptics ---------- */

  <div class="isec">Read aloud</div>${TTS.ok?`<div class="field"><label for="ttsVoice">Voice</label><select id="ttsVoice"><option value="">Auto — most natural voice${(()=>{const b=bestVoice();return b?' ('+esc(b.name)+')':''})()}</option>${vs.map(v=>`<option value="${esc(v.voiceURI)}" ${v.voiceURI===tt.voice?'selected':''}>${esc(v.name)} (${esc(v.lang)})</option>`).join('')}</select></div>
  <div class="field"><label for="ttsRate">Speed: <b id="ttsRateV">${(+tt.rate||.95).toFixed(2)}×</b></label><input type="range" id="ttsRate" min="0.6" max="1.6" step="0.05" value="${+tt.rate||.95}"></div>
  <button class="check ${tt.auto?'on':''}" id="ttsAuto" aria-pressed="${!!tt.auto}"><span class="bx"></span>Auto-read in Story mode</button><button class="btn wide" id="ttsTest">🔊 Preview voice</button>${aiOn()?`<button class="check ${tt.ai?'on':''}" id="ttsAI" aria-pressed="${!!tt.ai}"><span class="bx"></span>Use AI voice (human-quality, uses your ${esc((AIP[(aiCfg()||{}).prov]||['AI'])[0])} key)</button>`:'<p class="muted" style="font-size:13px;margin:8px 0 0">Tip: add an AI key in AI Coach to unlock a human-quality AI voice.</p>'}`:'<p class="muted">Read aloud isn’t supported in this browser.</p>'}
  <div class="isec">Haptics</div><button class="check ${s.haptics!==false?'on':''}" id="hapTog" aria-pressed="${s.haptics!==false}"><span class="bx"></span>Vibrate on actions (where supported)</button>
  <button class="btn primary wide" id="sheetClose" style="margin-top:12px">Done</button>`)}
if(TTS.ok)try{speechSynthesis.onvoiceschanged=()=>{if($('#ttsVoice')&&$('#sheet').classList.contains('on'))settingsSheet()}}catch(_){}

/* ---------- Boot ---------- */
applyTheme();savedIds().forEach(ensureBox);
BG.init();
touchStreak();buildDaily();
if(!S.badgeInit){checkBadges(true);S.badgeInit=true;save()}
if(!S.onboarded&&Object.keys(S.read).length===0)showOnboarding();else if(!S.onboarded){S.onboarded=true;save()}
renderFeed();renderHeader();
if((S.seenV||0)<V6){const old=S.onboarded&&!$('#onb').classList.contains('on');S.seenV=V6;save();if(old)setTimeout(()=>{if(!$('#sheet').classList.contains('on'))whatsNew()},700)}
if(S.mile&&!S.mile.shown&&S.mile.d===dkey()){S.mile.shown=true;save();setTimeout(()=>celebrate('🔥',`${S.mile.n}-day streak!`,'You showed up '+S.mile.n+' days in a row. Keep it going!',true),900)}
document.addEventListener('pointerdown',()=>SND.init(),{once:true});
document.addEventListener('visibilitychange',()=>{if(document.hidden)BR.leave();if(!document.hidden&&S.streak.last!==dkey()){touchStreak();buildDaily();renderFeed();refresh()}});
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){
  let hadCtl=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(reg=>{const upd=()=>reg.update().catch(()=>{});upd();
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')upd()});setInterval(upd,30*60*1000)}).catch(()=>{});
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!hadCtl){hadCtl=true;return}if($('#swBar'))return;
    const b=document.createElement('div');b.id='swBar';b.setAttribute('role','status');b.innerHTML='<span>✨ A new version of Stash is ready</span><button class="btn primary sm" id="swReload">Reload</button>';document.body.appendChild(b);
    $('#swReload').onclick=()=>location.reload()})}
</script>
</body>
</html>
