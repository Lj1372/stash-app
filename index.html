const SUBJECTS=['Science','History','Maths','Geography','English','Art','Faith'];
const LEARN=[
{"id": "l1", "topic": "Science", "level": "pre", "title": "Plants need water, light and air", "text": "Plants are alive! They drink water through their roots, soak up sunlight with their leaves and take in a gas from the air called carbon dioxide. With these they make their own food — and give out the oxygen we breathe.", "source": "Photosynthesis (basic science)", "author": "Life science", "action": "Put a plant by a sunny window and check on it every day this week.", "q": "Crash Course Kids photosynthesis plants"},
{"id": "l2", "topic": "Science", "level": "pri", "title": "Day and night", "text": "Earth spins round like a top, once about every 24 hours. The side facing the Sun has day; the side facing away has night. The Sun isn't moving across the sky — we are turning!", "source": "Earth's rotation", "author": "Astronomy basics", "action": "At sunset, notice which direction the Sun goes down — that's west, as Earth turns east.", "q": "Crash Course Kids day and night Earth rotation"},
{"id": "l3", "topic": "Science", "level": "pri", "title": "The water cycle", "text": "The Sun warms water in seas and lakes so it rises as invisible vapour (evaporation). High up it cools into tiny droplets that form clouds (condensation). When the droplets get heavy they fall as rain or snow (precipitation) and flow back to the sea — round and round.", "source": "The water cycle", "author": "Earth science", "action": "Breathe on a cold mirror or window and watch condensation happen.", "q": "Crash Course Kids water cycle"},
{"id": "l4", "topic": "Science", "level": "high", "title": "Newton's three laws of motion", "text": "1) An object stays at rest or moves in a straight line at constant speed unless a net force acts on it. 2) Net force equals mass × acceleration (F = ma). 3) For every action there is an equal and opposite reaction. Set out in the Principia (1687), these laws explain everything from a thrown ball to orbiting moons.", "source": "Philosophiæ Naturalis Principia Mathematica (1687)", "author": "Isaac Newton", "action": "Push off a wall while sitting on a wheeled chair and notice the third law in action.", "q": "Crash Course Physics Newton's laws"},
{"id": "l5", "topic": "Science", "level": "high", "title": "Cell theory", "text": "All living things are made of cells, the cell is the basic unit of life, and every cell comes from an existing cell. Schleiden (plants, 1838) and Schwann (animals, 1839) proposed the first two ideas; Rudolf Virchow popularised 'omnis cellula e cellula' — every cell from a cell — in 1855.", "source": "Cell theory (1838–1855)", "author": "Schleiden, Schwann & Virchow", "action": "Look at an onion skin or a leaf under a magnifying glass or phone macro lens.", "q": "Crash Course Biology cell theory"},
{"id": "l6", "topic": "Science", "level": "uni", "title": "Natural selection", "text": "Individuals vary, much of that variation is heritable, and more offspring are born than can survive. Those whose traits better fit their environment tend to leave more descendants, so populations change over generations. Darwin set this out in On the Origin of Species (1859); Alfred Russel Wallace reached the idea independently.", "source": "On the Origin of Species (1859)", "author": "Charles Darwin", "action": "Pick one animal and list three traits that help it survive where it lives.", "q": "Crash Course Biology natural selection"},
{"id": "l7", "topic": "Science", "level": "phd", "title": "The uncertainty principle", "text": "For conjugate observables such as position and momentum, the product of their standard deviations is bounded: σx·σp ≥ ħ/2. Heisenberg's 1927 paper framed it through measurement disturbance; Kennard proved the modern inequality that year and Robertson generalised it (σAσB ≥ ½|⟨[A,B]⟩|). It follows from non-commuting operators, not merely clumsy instruments.", "source": "Über den anschaulichen Inhalt der quantentheoretischen Kinematik und Mechanik (1927)", "author": "Werner Heisenberg", "action": "Write out why a sharply localised wave packet must contain many wavelengths (Fourier trade-off).", "q": "Heisenberg uncertainty principle explained lecture"},
{"id": "l8", "topic": "History", "level": "pre", "title": "Life before light switches", "text": "Long ago there was no electricity. People used candles, oil lamps and fires for light, and often went to bed when it got dark. Food was kept cool in cellars or with ice.", "source": "Everyday life in history", "author": "History for little learners", "action": "Have a 'candlelight hour' with a grown-up — no screens, just stories.", "q": "life before electricity for kids"},
{"id": "l9", "topic": "History", "level": "pri", "title": "The Great Pyramid of Giza", "text": "The Great Pyramid was built for Pharaoh Khufu around 2560 BC — about 4,500 years ago. It used roughly 2.3 million stone blocks and stayed the tallest human-made structure on Earth for more than 3,800 years.", "source": "Ancient Egypt (Old Kingdom)", "author": "Fourth Dynasty", "action": "Stack 10 books into a pyramid and think how many blocks a real one needs.", "q": "Great Pyramid of Giza how was it built TED-Ed"},
{"id": "l10", "topic": "History", "level": "pri", "title": "The first powered flight", "text": "On 17 December 1903 at Kitty Hawk, North Carolina, Orville Wright flew the Wright Flyer for 12 seconds and 120 feet — the first controlled, sustained, powered aeroplane flight. The brothers flew four times that day; Wilbur's last flight went 852 feet in 59 seconds.", "source": "The Wright Flyer (1903)", "author": "Orville & Wilbur Wright", "action": "Make a paper plane, then change one thing at a time to make it fly further — like the Wrights did.", "q": "Wright brothers first flight 1903"},
{"id": "l11", "topic": "History", "level": "high", "title": "Magna Carta", "text": "In 1215 at Runnymede, rebel barons forced King John to seal Magna Carta. The Pope annulled it within months and it was reissued in revised forms, but its promise that no free man be imprisoned 'except by the lawful judgment of his peers or by the law of the land' became a cornerstone idea: even the king is under the law.", "source": "Magna Carta (1215), clause 39", "author": "King John & the barons", "action": "Find one right in your country's laws that traces back to 'no one is above the law'.", "q": "Magna Carta explained history"},
{"id": "l12", "topic": "History", "level": "high", "title": "The fall of the Berlin Wall", "text": "On 9 November 1989 a confused East German announcement sent crowds to the Berlin Wall's crossings, and guards opened the gates. Built in 1961, the Wall had divided the city for 28 years. Germany reunified on 3 October 1990.", "source": "Berlin, 9 November 1989", "author": "Cold War Europe", "action": "Ask someone old enough where they were when they heard the Wall had fallen.", "q": "fall of the Berlin Wall 1989 explained"},
{"id": "l13", "topic": "History", "level": "uni", "title": "The printing revolution", "text": "Gutenberg's movable metal type and press (Mainz, c.1440s–1450s; the Bible c.1455) made books cheaper and texts standardised. Elizabeth Eisenstein's The Printing Press as an Agent of Change (1979) argued print enabled the Reformation, Renaissance scholarship and the Scientific Revolution; critics such as Adrian Johns (The Nature of the Book, 1998) call this too deterministic.", "source": "The Printing Press as an Agent of Change (1979)", "author": "Elizabeth Eisenstein", "action": "Compare how one news story is reported in print, online and on social media.", "q": "Gutenberg printing press history Crash Course"},
{"id": "l14", "topic": "History", "level": "phd", "title": "What is history?", "text": "In What Is History? (1961) E. H. Carr argued that facts do not speak for themselves: the historian selects and interprets them, so 'study the historian before you begin to study the facts'. History is 'an unending dialogue between the present and the past'. Geoffrey Elton's The Practice of History (1967) defended a more objective, archive-first ideal.", "source": "What Is History? (1961)", "author": "E. H. Carr", "action": "Pick a history book you own and identify three choices the author made about what to leave out.", "q": "E. H. Carr What Is History historiography"},
{"id": "l15", "topic": "Maths", "level": "pre", "title": "Shapes are everywhere", "text": "A circle is round with no corners. A triangle has 3 sides and 3 corners. A square has 4 equal sides and 4 corners. Look around — wheels, roofs and windows are all shapes!", "source": "Shapes", "author": "Early maths", "action": "Go on a shape hunt: find 3 circles, 3 triangles and 3 squares at home.", "q": "shapes song for preschool"},
{"id": "l16", "topic": "Maths", "level": "pri", "title": "What is a fraction?", "text": "A fraction is part of a whole. Cut a pizza into 4 equal slices: each slice is 1/4. The bottom number tells how many equal parts there are; the top number tells how many you have. 2/4 is the same amount as 1/2!", "source": "Fractions", "author": "Primary maths", "action": "Fold a piece of paper into halves, then quarters, then eighths and label each part.", "q": "Khan Academy intro to fractions"},
{"id": "l17", "topic": "Maths", "level": "high", "title": "Pythagoras' theorem", "text": "In a right-angled triangle the square on the hypotenuse equals the sum of the squares on the other two sides: a² + b² = c². Euclid proves it in Elements Book I, Proposition 47, and Babylonian tablets such as Plimpton 322 (c.1800 BC) list Pythagorean triples centuries before Pythagoras.", "source": "Elements, Book I, Prop. 47", "author": "Euclid", "action": "Check a corner is square: measure 3 units along one side, 4 along the other — the diagonal should be 5.", "q": "Khan Academy Pythagorean theorem"},
{"id": "l18", "topic": "Maths", "level": "high", "title": "There is no largest prime", "text": "Euclid (Elements IX.20) showed the primes never run out: take any finite list of primes, multiply them together and add 1. The result is either prime itself or has a prime factor that isn't on the list — so no finite list can contain them all.", "source": "Elements, Book IX, Prop. 20", "author": "Euclid", "action": "Try it: 2×3×5×7 + 1 = 211. Is 211 prime?", "q": "infinitely many primes Euclid proof"},
{"id": "l19", "topic": "Maths", "level": "uni", "title": "Euler's formula", "text": "Euler's formula e^(iθ) = cos θ + i sin θ (Introductio in analysin infinitorum, 1748) links exponentials and trigonometry. Setting θ = π gives e^(iπ) + 1 = 0, joining five fundamental constants. It drops out of comparing the Taylor series of eˣ, sin x and cos x.", "source": "Introductio in analysin infinitorum (1748)", "author": "Leonhard Euler", "action": "Write out the first four Taylor terms of e^(ix) and group the real and imaginary parts.", "q": "Euler's formula explained"},
{"id": "l20", "topic": "Maths", "level": "uni", "title": "Bayes' theorem", "text": "P(A|B) = P(B|A)·P(A) / P(B): how to update a belief when evidence arrives. Thomas Bayes' essay was published posthumously by Richard Price in 1763; Laplace developed the method independently. It explains why a positive result for a rare disease can still mean you probably don't have it.", "source": "An Essay towards solving a Problem in the Doctrine of Chances (1763)", "author": "Thomas Bayes", "action": "Estimate: a test is 99% accurate for a disease 1 in 1,000 people have. If you test positive, what's the chance you have it?", "q": "Bayes theorem explained"},
{"id": "l21", "topic": "Maths", "level": "phd", "title": "Gödel's incompleteness theorems", "text": "Gödel (1931) showed that any consistent, effectively axiomatised theory able to express basic arithmetic contains sentences it can neither prove nor refute; his second theorem shows such a theory cannot prove its own consistency. The proof arithmetises syntax (Gödel numbering) to build a sentence that in effect says 'I am not provable'.", "source": "Über formal unentscheidbare Sätze der Principia Mathematica (1931)", "author": "Kurt Gödel", "action": "Sketch how a statement can refer to itself via numbering, as in the diagonal lemma.", "q": "Gödel incompleteness theorem explained"},
{"id": "l22", "topic": "Art", "level": "pre", "title": "Mixing colours", "text": "Red, yellow and blue are the 'primary colours' of paint. Mix them to make new colours: red + yellow = orange, yellow + blue = green, blue + red = purple!", "source": "Colour mixing", "author": "Art for little learners", "action": "Mix two paint colours (or crayons) and give your new colour a name.", "q": "colour mixing for kids primary colours"},
{"id": "l23", "topic": "Art", "level": "pri", "title": "Warm and cool colours", "text": "Reds, oranges and yellows feel warm, like fire and sunshine. Blues, greens and purples feel cool, like water and shade. Artists use warm colours to make things feel close and exciting, and cool colours to feel calm and far away.", "source": "Colour temperature", "author": "Primary art", "action": "Draw the same tree twice — once in warm colours, once in cool. Which feels happier?", "q": "warm and cool colors art lesson"},
{"id": "l24", "topic": "Art", "level": "high", "title": "Linear perspective", "text": "Parallel lines that recede from us appear to meet at a vanishing point on the horizon. Filippo Brunelleschi demonstrated this in Florence around 1415; Leon Battista Alberti codified it in De pictura (1435), and Renaissance painters used it to make flat walls look deep.", "source": "De pictura (1435)", "author": "Leon Battista Alberti", "action": "Draw a road disappearing to a single dot on the horizon, with trees getting smaller.", "q": "Khan Academy linear perspective Brunelleschi"},
{"id": "l25", "topic": "Art", "level": "uni", "title": "Chiaroscuro", "text": "Chiaroscuro ('light-dark') models form with strong contrasts of light and shadow. Leonardo refined subtle tonal blending (sfumato); Caravaggio pushed contrast to tenebrism — figures blazing out of darkness — and Rembrandt used it for psychological depth.", "source": "Chiaroscuro & tenebrism", "author": "Caravaggio, Rembrandt", "action": "Photograph a friend lit by one lamp in a dark room and notice how the shadows shape the face.", "q": "chiaroscuro Caravaggio explained"},
{"id": "l26", "topic": "Art", "level": "phd", "title": "Ways of Seeing", "text": "John Berger's Ways of Seeing (BBC series and book, 1972) argued that how we see art is shaped by assumptions about beauty, class and gender, and — following Walter Benjamin's 'The Work of Art in the Age of Mechanical Reproduction' (1935) — that reproduction strips images of their original context. 'Men act and women appear' launched decades of debate about the gaze.", "source": "Ways of Seeing (1972)", "author": "John Berger", "action": "Choose one advert and analyse who is looking, who is looked at, and what is being sold.", "q": "John Berger Ways of Seeing episode 1"},
{"id": "l27", "topic": "Faith", "level": "pre", "title": "God made the world", "text": "The Bible's first page says God made everything — light, sky and seas, plants, the sun, moon and stars, fish, birds and animals, and then people — and saw that it was very good. On the seventh day God rested.", "source": "Genesis 1:1–2:3", "author": "The Bible", "action": "Go outside and name five things in creation you're thankful for.", "q": "BibleProject Genesis 1 creation"},
{"id": "l28", "topic": "Faith", "level": "pri", "title": "The Good Samaritan", "text": "A man was robbed and left hurt by the road. A priest and a Levite walked past. A Samaritan — from a group the listeners disliked — stopped, bandaged him, took him to an inn and paid for his care. Jesus said: 'Go, and do thou likewise' (Luke 10:37).", "source": "Luke 10:25–37", "author": "The Bible", "action": "Do one kind thing today for someone who isn't usually in your group.", "q": "BibleProject Good Samaritan Luke 10"},
{"id": "l29", "topic": "Faith", "level": "pri", "title": "David and Goliath", "text": "Young shepherd David faced the giant warrior Goliath with only a sling and five smooth stones, trusting God instead of armour. One stone struck Goliath, and the frightened army of Israel was saved.", "source": "1 Samuel 17", "author": "The Bible", "action": "Name one 'giant' you're facing and one small step of courage you can take.", "q": "BibleProject 1 Samuel David and Goliath"},
{"id": "l30", "topic": "Faith", "level": "high", "title": "The Sermon on the Mount", "text": "In Matthew 5–7 Jesus teaches the Beatitudes ('Blessed are the poor in spirit…'), calls followers salt and light, says to love enemies, gives the Lord's Prayer, warns against worry, states the Golden Rule (7:12) and ends with the wise and foolish builders.", "source": "Matthew 5–7", "author": "The Bible", "action": "Read Matthew 5:1–12 slowly and pick one beatitude to live out today.", "q": "BibleProject Sermon on the Mount"},
{"id": "l31", "topic": "Faith", "level": "uni", "title": "Our restless hearts", "text": "'You have made us for yourself, and our heart is restless until it rests in you' (Confessions I.1, c.397–400). Augustine's autobiography-as-prayer traces how disordered loves — for status, pleasure, even friendship — fail to satisfy until they are ordered toward God.", "source": "Confessions, Book I.1", "author": "Augustine of Hippo", "action": "Notice one thing you reach for when restless today, and pause to pray instead.", "q": "Augustine Confessions restless heart explained"},
{"id": "l32", "topic": "Faith", "level": "phd", "title": "Aquinas' Five Ways", "text": "In Summa Theologiae I, q.2, a.3, Aquinas gives five 'ways' to God's existence: from motion, efficient causation, contingency, gradations of being, and the directedness of nature. They argue a posteriori from features of the world — and do not depend on the universe having a beginning in time, which Aquinas held reason alone could not prove.", "source": "Summa Theologiae I, q.2, a.3", "author": "Thomas Aquinas", "action": "Restate the argument from contingency in three premises and test each for weaknesses.", "q": "Aquinas five ways explained lecture"},
{"id": "l33", "topic": "Science", "level": "pre", "title": "Magnets push and pull", "text": "Magnets stick to some metals like iron. Every magnet has two ends called poles — north and south. Opposite poles pull together; the same poles push apart!", "source": "Magnetism", "author": "Early science", "action": "Test which things on the fridge door a magnet will stick to.", "q": "magnets for kids science"},
{"id": "l34", "topic": "Science", "level": "pre", "title": "Why do we have seasons?", "text": "Earth is tilted. For part of the year our half leans towards the Sun, so it's summer — long warm days. Later it leans away and it's winter.", "source": "Seasons", "author": "Early science", "action": "Draw your favourite season and what you like to do in it.", "q": "seasons explained for kids"},
{"id": "l35", "topic": "Science", "level": "pri", "title": "The solar system", "text": "Eight planets orbit the Sun: Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus and Neptune. Jupiter is the biggest; Mercury is closest to the Sun. Pluto was reclassified as a dwarf planet in 2006.", "source": "The Solar System", "author": "Astronomy basics", "action": "Make up a sentence to remember the planets' order.", "q": "solar system for kids planets"},
{"id": "l36", "topic": "Science", "level": "pri", "title": "Food chains", "text": "Energy passes along a food chain: the Sun feeds plants (producers), plants feed herbivores, and herbivores feed carnivores. Decomposers like fungi recycle what's left.", "source": "Ecology", "author": "Life science", "action": "Draw a food chain from your garden or local park.", "q": "food chain for kids"},
{"id": "l37", "topic": "Science", "level": "pri", "title": "States of matter", "text": "Matter can be solid, liquid or gas. Heat ice and it melts to water; heat water and it evaporates to steam. Cooling reverses the changes.", "source": "States of matter", "author": "Physical science", "action": "Watch an ice cube melt and time how long it takes.", "q": "states of matter for kids"},
{"id": "l38", "topic": "Science", "level": "high", "title": "The periodic table", "text": "Mendeleev arranged elements by atomic weight and properties in 1869, leaving gaps for undiscovered elements whose properties he predicted correctly (like gallium). Today elements are ordered by atomic number.", "source": "Periodic table (1869)", "author": "Dmitri Mendeleev", "action": "Find the elements in your body: oxygen, carbon, hydrogen, nitrogen, calcium, phosphorus.", "q": "Crash Course Chemistry periodic table"},
{"id": "l39", "topic": "Science", "level": "high", "title": "Atoms and the nucleus", "text": "In 1911 Rutherford's gold-foil experiment showed atoms have a tiny, dense, positive nucleus with electrons around it. Bohr (1913) added fixed energy levels for electrons.", "source": "Rutherford (1911); Bohr (1913)", "author": "Ernest Rutherford", "action": "Explain to someone why atoms are mostly empty space.", "q": "Rutherford gold foil experiment explained"},
{"id": "l40", "topic": "Science", "level": "high", "title": "Plate tectonics", "text": "Earth's outer shell is broken into plates that move a few centimetres a year. Alfred Wegener proposed continental drift in 1912; evidence from sea-floor spreading in the 1960s confirmed plate tectonics.", "source": "Continental drift (1912)", "author": "Alfred Wegener", "action": "Look at a map and see how South America and Africa fit together.", "q": "plate tectonics explained"},
{"id": "l41", "topic": "Science", "level": "uni", "title": "Thermodynamics' laws", "text": "Zeroth: thermal equilibrium is transitive. First: energy is conserved (ΔU = Q − W). Second: entropy of an isolated system never decreases. Third: entropy approaches a minimum as temperature approaches absolute zero.", "source": "Laws of thermodynamics", "author": "Clausius, Kelvin, Nernst", "action": "Identify the second law at work in your kitchen.", "q": "laws of thermodynamics explained"},
{"id": "l42", "topic": "Science", "level": "uni", "title": "Special relativity", "text": "Einstein's 1905 postulates — physics is the same in all inertial frames and light speed is constant — imply time dilation, length contraction and the relativity of simultaneity.", "source": "On the Electrodynamics of Moving Bodies (1905)", "author": "Albert Einstein", "action": "Calculate how much slower a clock runs at 90% of light speed (γ ≈ 2.29).", "q": "special relativity explained lecture"},
{"id": "l43", "topic": "Science", "level": "phd", "title": "Noether's theorem", "text": "Emmy Noether proved in 1918 that every continuous symmetry of a physical system's action corresponds to a conserved quantity: time symmetry → energy, spatial translation → momentum, rotation → angular momentum.", "source": "Invariante Variationsprobleme (1918)", "author": "Emmy Noether", "action": "Derive momentum conservation from translation invariance of a free-particle Lagrangian.", "q": "Noether's theorem explained"},
{"id": "l44", "topic": "History", "level": "pre", "title": "Castles and knights", "text": "Long ago, kings and lords built stone castles with thick walls, towers and moats to keep people safe. Knights wore armour and rode horses.", "source": "Medieval life", "author": "History for little learners", "action": "Build a castle out of blocks or boxes.", "q": "castles for kids history"},
{"id": "l45", "topic": "History", "level": "pri", "title": "Ancient Rome", "text": "Rome grew from a small city to an empire around the Mediterranean. Romans built roads, aqueducts and the Colosseum, and their language, Latin, shaped many English words.", "source": "Ancient Rome", "author": "Roman history", "action": "Find three English words that come from Latin.", "q": "ancient Rome for kids"},
{"id": "l46", "topic": "History", "level": "pri", "title": "Captain Cook and the First Fleet", "text": "James Cook charted Australia's east coast in 1770. In January 1788 the First Fleet arrived at Sydney Cove under Arthur Phillip. Aboriginal people had lived in Australia for more than 60,000 years before.", "source": "Australian history", "author": "Colonial Australia", "action": "Learn the traditional name of the Country where you live.", "q": "First Fleet 1788 history for kids"},
{"id": "l47", "topic": "History", "level": "high", "title": "The French Revolution", "text": "Starting in 1789 with the storming of the Bastille, the Revolution overthrew the monarchy, proclaimed 'Liberty, Equality, Fraternity', descended into the Terror (1793–94) and ended with Napoleon's rise.", "source": "French Revolution (1789–1799)", "author": "Modern Europe", "action": "Compare the ideals of 1789 with what actually happened during the Terror.", "q": "French Revolution Crash Course"},
{"id": "l48", "topic": "History", "level": "high", "title": "World War I", "text": "After Archduke Franz Ferdinand's assassination in June 1914, alliances pulled Europe into a war of trenches that killed about 9–10 million soldiers by 1918.", "source": "First World War (1914–1918)", "author": "Modern history", "action": "Read one letter from a WWI soldier.", "q": "World War I Crash Course"},
{"id": "l49", "topic": "History", "level": "high", "title": "World War II", "text": "From 1939 to 1945 the Allies fought the Axis powers. The war killed about 70–85 million people, including six million Jews murdered in the Holocaust.", "source": "Second World War (1939–1945)", "author": "Modern history", "action": "Visit a war memorial and read the names.", "q": "World War II explained"},
{"id": "l50", "topic": "History", "level": "uni", "title": "The Cold War", "text": "From 1947 to 1991 the US and USSR competed through alliances, proxy wars, an arms race and the space race. Deterrence held: nuclear weapons were never used in war after 1945.", "source": "The Cold War", "author": "John Lewis Gaddis", "action": "Read about the Cuban Missile Crisis and how close it came.", "q": "Cold War Crash Course"},
{"id": "l51", "topic": "History", "level": "phd", "title": "The Annales school", "text": "Founded by Marc Bloch and Lucien Febvre in 1929, the Annales school shifted history from politics and great men to long-term structures — climate, economy, mentalités. Braudel's longue durée is its signature concept.", "source": "Annales d'histoire économique et sociale (1929)", "author": "Bloch, Febvre, Braudel", "action": "Choose an event and analyse it on three timescales: event, conjuncture, longue durée.", "q": "Annales school historiography Braudel"},
{"id": "l52", "topic": "Maths", "level": "pre", "title": "Counting to ten", "text": "Count fingers: 1, 2, 3, 4, 5 on one hand and 6, 7, 8, 9, 10 on two hands! Counting helps us know how many things we have.", "source": "Counting", "author": "Early maths", "action": "Count the steps from your bed to the door.", "q": "counting to 10 song"},
{"id": "l53", "topic": "Maths", "level": "pri", "title": "Times tables tricks", "text": "For the 9 times table, hold up ten fingers and fold down the one you're multiplying by: fingers to the left are tens, to the right are ones. 9 × 3: fold the 3rd finger → 2 and 7 = 27.", "source": "Multiplication", "author": "Primary maths", "action": "Use the finger trick for 9 × 7.", "q": "9 times table finger trick"},
{"id": "l54", "topic": "Maths", "level": "pri", "title": "Area and perimeter", "text": "Perimeter is the distance around a shape — add the sides. Area is the space inside — for a rectangle, length × width. A 3 by 4 rectangle has perimeter 14 and area 12.", "source": "Measurement", "author": "Primary maths", "action": "Measure your bedroom and find its area.", "q": "area and perimeter for kids"},
{"id": "l55", "topic": "Maths", "level": "high", "title": "Pythagoras' theorem", "text": "In a right-angled triangle, the square on the hypotenuse equals the sum of the squares on the other two sides: a² + b² = c². A 3-4-5 triangle is the classic example.", "source": "Euclid's Elements I.47", "author": "Pythagoras / Euclid", "action": "Check a corner is square using a 3-4-5 measurement.", "q": "Pythagoras theorem proof visual"},
{"id": "l56", "topic": "Maths", "level": "high", "title": "Probability basics", "text": "Probability = favourable outcomes ÷ possible outcomes. A fair die gives 1/6 for each face. For independent events, multiply: two sixes is 1/36.", "source": "Probability", "author": "High school maths", "action": "Roll a die 60 times and compare to the expected 10 of each.", "q": "probability basics Khan Academy"},
{"id": "l57", "topic": "Maths", "level": "high", "title": "Compound interest", "text": "A = P(1 + r)ⁿ. $1,000 at 7% for 30 years grows to about $7,612. The Rule of 72 estimates doubling time: 72 ÷ rate.", "source": "Compound interest", "author": "Financial maths", "action": "Use the Rule of 72 on your savings rate.", "q": "compound interest explained"},
{"id": "l58", "topic": "Maths", "level": "uni", "title": "Bayes' theorem", "text": "P(A|B) = P(B|A)P(A)/P(B). If a disease affects 1% and a test is 90% sensitive with 9% false positives, a positive result means only about 9% chance of disease — base rates matter.", "source": "An Essay towards solving a Problem in the Doctrine of Chances (1763)", "author": "Thomas Bayes", "action": "Work through the disease-test example by hand.", "q": "Bayes theorem 3Blue1Brown"},
{"id": "l59", "topic": "Maths", "level": "uni", "title": "Euler's identity", "text": "e^{iπ} + 1 = 0 links five fundamental constants. It follows from Euler's formula e^{iθ} = cos θ + i sin θ, which describes rotation in the complex plane.", "source": "Introductio in analysin infinitorum (1748)", "author": "Leonhard Euler", "action": "Plot e^{iθ} for θ = 0, π/2, π, 3π/2.", "q": "Euler's identity explained 3Blue1Brown"},
{"id": "l60", "topic": "Maths", "level": "phd", "title": "Gödel's incompleteness", "text": "Gödel (1931) proved any consistent formal system capable of basic arithmetic contains true statements it cannot prove, and cannot prove its own consistency.", "source": "Über formal unentscheidbare Sätze (1931)", "author": "Kurt Gödel", "action": "Sketch how a sentence can assert its own unprovability via Gödel numbering.", "q": "Gödel incompleteness theorem explained"},
{"id": "l61", "topic": "Faith", "level": "pre", "title": "God made everything", "text": "The Bible begins by saying God made the world: light, sky, sea, land, plants, animals and people. And God saw that it was good (Genesis 1).", "source": "Genesis 1", "author": "The Bible", "action": "Go outside and thank God for three things he made.", "q": "Genesis creation story for kids"},
{"id": "l62", "topic": "Faith", "level": "pri", "title": "Noah's ark", "text": "God told Noah to build a huge boat and bring animals two by two. After the flood God put a rainbow in the sky as a promise (Genesis 6–9).", "source": "Genesis 6–9", "author": "The Bible", "action": "Next time you see a rainbow, remember a promise you've made.", "q": "Noah's ark story for kids"},
{"id": "l63", "topic": "Faith", "level": "pri", "title": "The Good Samaritan", "text": "Jesus told of a man beaten by robbers. Two religious men passed by, but a Samaritan — an outsider — stopped and cared for him. 'Go, and do thou likewise' (Luke 10:37).", "source": "Luke 10:25–37", "author": "The Bible", "action": "Help someone today who isn't your friend yet.", "q": "Good Samaritan for kids"},
{"id": "l64", "topic": "Faith", "level": "high", "title": "The Lord's Prayer", "text": "Jesus taught his disciples to pray (Matthew 6:9–13): honouring God's name, seeking his kingdom, asking for daily bread, forgiveness as we forgive, and deliverance from evil.", "source": "Matthew 6:9–13", "author": "The Bible", "action": "Pray the Lord's Prayer slowly, pausing after each line.", "q": "Lord's Prayer explained BibleProject"},
{"id": "l65", "topic": "Faith", "level": "uni", "title": "The Nicene Creed", "text": "Agreed at Nicaea (325) and expanded at Constantinople (381), the creed confesses one God — Father, Son and Holy Spirit — and that the Son is 'of one substance' (homoousios) with the Father.", "source": "Nicene–Constantinopolitan Creed (381)", "author": "Councils of Nicaea & Constantinople", "action": "Read the creed and underline what each line says about Jesus.", "q": "Nicene Creed history explained"},
{"id": "l66", "topic": "Faith", "level": "phd", "title": "Bonhoeffer on cheap grace", "text": "In The Cost of Discipleship (1937) Bonhoeffer contrasted 'cheap grace' — forgiveness without repentance or discipleship — with costly grace that calls a person to follow Christ.", "source": "The Cost of Discipleship (1937)", "author": "Dietrich Bonhoeffer", "action": "Write down what following Christ is costing you this year.", "q": "Bonhoeffer cheap grace explained"},
{"id": "l67", "topic": "Geography", "level": "pri", "title": "Continents and oceans", "text": "There are seven continents — Africa, Antarctica, Asia, Australia (Oceania), Europe, North America and South America — and five oceans: Pacific, Atlantic, Indian, Southern and Arctic.", "source": "World geography", "author": "Geography basics", "action": "Point to each continent on a globe or map.", "q": "continents and oceans song"},
{"id": "l68", "topic": "Geography", "level": "high", "title": "Climate zones", "text": "Earth's climate zones — tropical, dry, temperate, continental and polar (Köppen classification) — depend on latitude, ocean currents and altitude. Perth has a Mediterranean climate: hot dry summers, mild wet winters.", "source": "Köppen climate classification", "author": "Wladimir Köppen", "action": "Look up your city's climate zone.", "q": "Köppen climate classification explained"},
{"id": "l69", "topic": "Geography", "level": "uni", "title": "Demographic transition", "text": "As societies develop, death rates fall first, then birth rates, moving from high-high to low-low population growth. Many countries now have below-replacement fertility (~2.1).", "source": "Demographic transition model", "author": "Warren Thompson / Frank Notestein", "action": "Compare your grandparents' family size with today's.", "q": "demographic transition model explained"},
{"id": "l70", "topic": "English", "level": "pri", "title": "Nouns, verbs and adjectives", "text": "A noun names a thing (dog), a verb is an action (runs), and an adjective describes a noun (fluffy). 'The fluffy dog runs' uses all three.", "source": "Parts of speech", "author": "English grammar", "action": "Write a sentence with two adjectives.", "q": "parts of speech for kids"},
{"id": "l71", "topic": "English", "level": "high", "title": "Shakespeare's sonnets", "text": "A Shakespearean sonnet has 14 lines of iambic pentameter rhymed ABAB CDCD EFEF GG, ending with a couplet that twists the argument. Sonnet 18: 'Shall I compare thee to a summer's day?'", "source": "Sonnets (1609)", "author": "William Shakespeare", "action": "Read Sonnet 18 aloud and tap the da-DUM rhythm.", "q": "Shakespeare sonnet 18 explained"},
{"id": "l72", "topic": "English", "level": "uni", "title": "Orwell's rules for writing", "text": "Orwell advised: never use a metaphor you're used to seeing in print; never use a long word where a short one will do; cut words you can; prefer the active voice; avoid jargon; break any rule sooner than say anything barbarous.", "source": "Politics and the English Language (1946)", "author": "George Orwell", "action": "Edit one paragraph of your writing using Orwell's rules.", "q": "Orwell politics and the English language"},
{"id": "a1", "topic": "Art", "level": "all", "title": "The Starry Night", "text": "Painted in June 1889 at the asylum in Saint-Rémy, partly from memory and imagination, it shows a swirling night sky over a quiet village with a flame-like cypress in front. Thick, rhythmic brushstrokes make the sky feel alive.", "kid": "Look at the sky — it's swirling like the wind! Van Gogh painted big glowing stars and a bright moon over a sleepy little town.", "deep": "The village is partly invented (its spire recalls the Netherlands) and Van Gogh's letters show he rated the picture modestly. Its impasto and vortical rhythms anticipate Expressionism; scholars link the bright 'star' near the horizon to Venus, which he described seeing before dawn that month.", "source": "The Starry Night (1889)", "author": "Vincent van Gogh", "year": "1889", "place": "Museum of Modern Art, New York", "action": "Step outside tonight for two minutes and really look at the sky.", "img": "art/starry-night.jpg", "credit": "https://commons.wikimedia.org/wiki/File:Van_Gogh_-_Starry_Night_-_Google_Art_Project.jpg", "q": "Smarthistory The Starry Night Vincent van Gogh"},
{"id": "a2", "topic": "Art", "level": "all", "title": "Mona Lisa", "text": "A portrait usually identified as Lisa Gherardini, wife of a Florentine merchant. Leonardo's soft sfumato blending, the hazy landscape and the elusive smile made it famous; its theft from the Louvre in 1911 turned it into a global icon.", "kid": "This lady has a tiny, mysterious smile. Leonardo blended the colours so softly that you can hardly see any lines!", "deep": "Vasari identifies the sitter; Leonardo kept reworking the panel for years and took it to France. Sfumato — near-imperceptible tonal gradation built from thin glazes — dissolves contours at the eyes and mouth, so the expression seems to shift with where you focus.", "source": "Mona Lisa (c.1503–1519)", "author": "Leonardo da Vinci", "year": "c.1503–1519", "place": "Louvre, Paris", "action": "Look at the smile, then at the eyes, then back. Does the expression change?", "img": "art/mona-lisa.jpg", "credit": "https://commons.wikimedia.org/wiki/File:Mona_Lisa,_by_Leonardo_da_Vinci,_from_C2RMF_retouched.jpg", "q": "Smarthistory Mona Lisa Leonardo da Vinci"},
{"id": "a3", "topic": "Art", "level": "all", "title": "The Great Wave off Kanagawa", "text": "A towering wave with claw-like foam curls over three boats of rowers, while Mount Fuji sits small in the distance. It is a woodblock print, so many copies were made and sold cheaply in Edo-period Japan.", "kid": "A giant wave with claw-like foam curls over three little boats — and tiny Mount Fuji sits right in the middle!", "deep": "As a polychrome woodblock print it exists in many impressions. It uses imported Prussian blue and a Western-influenced low horizon; when Japanese prints reached Europe they fed Japonisme, inspiring Monet, Van Gogh and the cover of Debussy's La Mer.", "source": "The Great Wave off Kanagawa (c.1831)", "author": "Katsushika Hokusai", "year": "c.1831", "place": "Woodblock print, Thirty-six Views of Mount Fuji", "action": "Find the mountain hidden in the picture, then draw your own giant wave.", "img": "art/great-wave.jpg", "credit": "https://commons.wikimedia.org/wiki/File:Tsunami_by_hokusai_19th_century.jpg", "q": "Smarthistory The Great Wave off Kanagawa Katsushika Hokusai"},
{"id": "a4", "topic": "Art", "level": "all", "title": "Girl with a Pearl Earring", "text": "A girl in a blue and yellow turban glances over her shoulder, lips parted, a large pearl catching the light. It isn't a portrait of a known person but a 'tronie' — a study of a face and costume.", "kid": "A girl turns to look at you with a shiny pearl earring and a bright blue turban. Who do you think she is?", "deep": "A Dutch tronie rather than a commissioned portrait. The 2018 'Girl in the Spotlight' study found she originally stood before a green curtain (now darkened) and had faint eyelashes; the pearl is just a few deft strokes of highlight.", "source": "Girl with a Pearl Earring (c.1665)", "author": "Johannes Vermeer", "year": "c.1665", "place": "Mauritshuis, The Hague", "action": "Notice how few brushstrokes make the pearl. Try drawing a shiny ball with one highlight.", "img": "art/girl-pearl-earring.jpg", "credit": "https://commons.wikimedia.org/wiki/File:1665_Girl_with_a_Pearl_Earring.jpg", "q": "Smarthistory Girl with a Pearl Earring Johannes Vermeer"},
{"id": "a5", "topic": "Art", "level": "all", "title": "The Night Watch", "text": "A civic militia company led by Captain Frans Banninck Cocq bursts into motion — drums, muskets and a glowing girl among them. It's actually a daytime scene; darkened varnish later gave it its nickname.", "kid": "Lots of soldiers getting ready to march! Can you find the little girl glowing in golden light?", "deep": "Rembrandt broke with static rows of group portraits, using chiaroscuro and movement to animate a militia company. The canvas was trimmed in 1715 to fit a wall in Amsterdam's town hall, and since 2019 'Operation Night Watch' has studied it in public view.", "source": "The Night Watch (1642)", "author": "Rembrandt van Rijn", "year": "1642", "place": "Rijksmuseum, Amsterdam", "action": "Count how many faces you can find in the painting.", "img": "art/night-watch.jpg", "credit": "https://commons.wikimedia.org/wiki/File:La_ronda_de_noche,_por_Rembrandt_van_Rijn.jpg", "q": "Smarthistory The Night Watch Rembrandt van Rijn"},
{"id": "a6", "topic": "Art", "level": "all", "title": "The Creation of Adam", "text": "Part of the Sistine Chapel ceiling fresco, it shows God reaching toward Adam, their fingers almost touching, as life is about to pass into the first man (Genesis 2:7).", "kid": "God reaches out to give Adam life — look how their fingers almost touch!", "deep": "Painted in buon fresco on wet plaster during the 1508–1512 ceiling campaign. The near-touch gap concentrates the drama; a 1990 JAMA article (Meshberger) proposed that God's enveloping mantle resembles a human brain — an intriguing but speculative reading.", "source": "The Creation of Adam (c.1512)", "author": "Michelangelo", "year": "c.1512", "place": "Sistine Chapel ceiling, Vatican", "action": "Read Genesis 2:7 and notice what gives Adam life.", "img": "art/creation-of-adam.jpg", "credit": "https://commons.wikimedia.org/wiki/File:Michelangelo_-_Creation_of_Adam_(cropped).jpg", "q": "Smarthistory The Creation of Adam Michelangelo"},
{"id": "a7", "topic": "Art", "level": "all", "title": "The Return of the Prodigal Son", "text": "From Jesus' parable in Luke 15, a ragged son kneels and the old father embraces him, while the older brother looks on. One of Rembrandt's last great works, it glows with warm light and tenderness.", "kid": "A son who ran away comes home, and his dad gives him the biggest, kindest hug.", "deep": "A late work painted with broad, loaded brushwork. Commentators note the father's two differently shaped hands and the watching elder brother; Henri Nouwen's The Return of the Prodigal Son (1992) made it a classic of spiritual reflection.", "source": "The Return of the Prodigal Son (c.1668)", "author": "Rembrandt van Rijn", "year": "c.1668", "place": "Hermitage Museum, St Petersburg", "action": "Read Luke 15:11–32 and decide which character you relate to most today.", "img": "art/prodigal-son.jpg", "credit": "https://commons.wikimedia.org/wiki/File:Rembrandt_Harmensz_van_Rijn_-_Return_of_the_Prodigal_Son_-_Google_Art_Project.jpg", "q": "Smarthistory The Return of the Prodigal Son Rembrandt van Rijn"},
{"id": "a8", "topic": "Art", "level": "all", "title": "Wanderer above the Sea of Fog", "text": "A man in a dark coat stands on a rocky peak with his back to us, gazing over a sea of mist and distant mountains. It became the emblem of Romanticism and the awe of nature.", "kid": "A man stands on top of a mountain looking out over clouds. What do you think he can see?", "deep": "A classic Rückenfigur: by turning the figure away, Friedrich invites us to share his view. The composite landscape (from studies of the Elbe Sandstone Mountains) evokes the Romantic sublime — awe mixed with smallness before nature.", "source": "Wanderer above the Sea of Fog (c.1818)", "author": "Caspar David Friedrich", "year": "c.1818", "place": "Hamburger Kunsthalle", "action": "Find a high spot today and take one quiet minute just looking.", "img": "art/wanderer-fog.jpg", "credit": "https://commons.wikimedia.org/wiki/File:Caspar_David_Friedrich_-_Wanderer_above_the_sea_of_fog.jpg", "q": "Smarthistory Wanderer above the Sea of Fog Caspar David Friedrich"},
{"id": "a9", "topic": "Art", "level": "all", "title": "The School of Athens", "text": "Great thinkers of ancient Greece gather in a grand hall. At the centre Plato points upward to ideas while Aristotle gestures down to the world we observe.", "kid": "Lots of clever thinkers from long ago chatting in a huge hall. Two in the middle are pointing up and down — they disagreed!", "deep": "A fresco in Julius II's library, built on a perfect one-point perspective. Plato is often thought to resemble Leonardo, and a brooding Heraclitus appears to portray Michelangelo; Raphael also included himself at the right edge.", "source": "The School of Athens (1509–1511)", "author": "Raphael", "year": "1509–1511", "place": "Stanza della Segnatura, Vatican", "action": "Pick one big question you'd want to ask Plato or Aristotle.", "img": "art/school-of-athens.jpg", "credit": "https://commons.wikimedia.org/wiki/File:%22The_School_of_Athens%22_by_Raffaello_Sanzio_da_Urbino.jpg", "q": "Smarthistory The School of Athens Raphael"},
{"id": "a10", "topic": "Art", "level": "all", "title": "A Sunday on La Grande Jatte", "text": "Parisians relax on an island in the Seine on a Sunday afternoon. Up close the picture is made of countless tiny dots of pure colour that blend in your eye from a distance.", "kid": "This whole picture is made of tiny dots! Stand back and they turn into people in a park.", "deep": "Seurat's pointillism (divisionism) applied colour theory from Chevreul and others, setting complementary dots side by side for optical mixing. Shown at the 8th Impressionist exhibition (1886), its stiff, frieze-like figures marked a turn to Neo-Impressionism.", "source": "A Sunday on La Grande Jatte (1884–1886)", "author": "Georges Seurat", "year": "1884–1886", "place": "Art Institute of Chicago", "action": "Make a small picture using only dots of colour.", "img": "art/grande-jatte.jpg", "credit": "https://commons.wikimedia.org/wiki/File:A_Sunday_on_La_Grande_Jatte,_Georges_Seurat,_1884.jpg", "q": "Smarthistory A Sunday on La Grande Jatte Georges Seurat"},
{"id": "a11", "topic": "Art", "level": "all", "title": "The Gleaners", "text": "Three peasant women bend to pick up the leftover grains after the harvest, while a rich harvest is stacked far behind them. Millet gave poor workers the dignity usually reserved for heroes.", "kid": "Three women pick up leftover bits of wheat after the farmers are finished. They work very hard.", "deep": "Gleaning was a right of the rural poor. Placing them monumental in the foreground with abundant harvest behind, Millet unsettled Salon critics who read the painting as social critique in the years after 1848.", "source": "The Gleaners (1857)", "author": "Jean-François Millet", "year": "1857", "place": "Musée d'Orsay, Paris", "action": "Read Ruth 2 or Leviticus 19:9–10 and think about leaving something for others.", "img": "art/gleaners.jpg", "credit": "https://commons.wikimedia.org/wiki/File:Jean-Fran%C3%A7ois_Millet_-_Gleaners_-_Google_Art_Project_2.jpg", "q": "Smarthistory The Gleaners Jean-François Millet"},
{"id": "a12", "topic": "Art", "level": "all", "title": "The Hay Wain", "text": "A horse-drawn hay cart crosses a shallow river near Flatford Mill in Suffolk, beside Willy Lott's cottage, under a big changeable English sky.", "kid": "A horse and cart splash through a river in the countryside under fluffy clouds.", "deep": "Constable built it from oil sketches made outdoors, prizing fresh, broken touches of white to capture light. Little noticed in London, it won a gold medal at the 1824 Paris Salon and impressed French painters including Delacroix.", "source": "The Hay Wain (1821)", "author": "John Constable", "year": "1821", "place": "National Gallery, London", "action": "Look up at the clouds today and describe their shapes and colours.", "img": "art/hay-wain.jpg", "credit": "https://commons.wikimedia.org/wiki/File:John_Constable_The_Hay_Wain.jpg", "q": "Smarthistory The Hay Wain John Constable"},
{"id": "a13", "topic": "Art", "level": "all", "title": "Liberty Leading the People", "text": "Painted to commemorate the July Revolution of 1830 in Paris, it shows Liberty as a woman in a Phrygian cap raising the French tricolour as citizens surge over a barricade.", "kid": "A brave woman holding a flag leads people forward to be free.", "deep": "A Romantic fusion of allegory and reportage: an idealised Liberty amid real Parisian types and the dead. The French state bought it in 1831 but soon kept it from view as politically sensitive.", "source": "Liberty Leading the People (1830)", "author": "Eugène Delacroix", "year": "1830", "place": "Louvre, Paris", "action": "Think of one freedom you have and say thank you for it.", "img": "art/liberty-leading.jpg", "credit": "https://commons.wikimedia.org/wiki/File:Eug%C3%A8ne_Delacroix_-_La_libert%C3%A9_guidant_le_peuple.jpg", "q": "Smarthistory Liberty Leading the People Eugène Delacroix"},
{"id": "a14", "topic": "Art", "level": "all", "title": "The Arnolfini Portrait", "text": "A wealthy couple stand in a richly furnished room. Behind them a convex mirror reflects two more figures in the doorway, and above it the artist signed 'Jan van Eyck was here 1434'.", "kid": "A man and a woman stand in their fancy room with a little dog. Look for the tiny round mirror on the wall!", "deep": "Oil on oak panel, a showcase of early Netherlandish oil technique. Long read as a marriage contract (Panofsky, 1934), it is now debated: it may be a memorial or simply a status portrait; the mirror's reflected figures may include the painter.", "source": "The Arnolfini Portrait (1434)", "author": "Jan van Eyck", "year": "1434", "place": "National Gallery, London", "action": "Find the mirror and count the people reflected in it.", "img": "art/arnolfini.jpg", "credit": "https://commons.wikimedia.org/wiki/File:Van_Eyck_-_Arnolfini_Portrait.jpg", "q": "Smarthistory The Arnolfini Portrait Jan van Eyck"},
{"id": "a15", "topic": "Art", "level": "all", "title": "Las Meninas", "text": "The little Infanta Margarita stands with her maids of honour while Velázquez himself paints at a huge canvas. A mirror at the back shows the King and Queen — standing where we are.", "kid": "A little princess and her helpers — and the painter painting himself! The king and queen are in the mirror.", "deep": "A puzzle of viewing positions: the mirror reflects Philip IV and Mariana, outside the picture where the viewer stands. Michel Foucault opened The Order of Things (1966) with an analysis of it as a meditation on representation itself.", "source": "Las Meninas (1656)", "author": "Diego Velázquez", "year": "1656", "place": "Museo del Prado, Madrid", "action": "Find the painter, the mirror, and the man in the doorway at the back.", "img": "art/las-meninas.jpg", "credit": "https://commons.wikimedia.org/wiki/File:Las_Meninas,_by_Diego_Vel%C3%A1zquez,_from_Prado_in_Google_Earth.jpg", "q": "Smarthistory Las Meninas Diego Velázquez"},
{"id": "a16", "topic": "Art", "level": "all", "title": "Water Lilies", "text": "Floating water lilies and reflections of sky and willows on Monet's pond at Giverny. There's no horizon or shore — just water, light and colour.", "kid": "Lily pads floating on a pond, with the sky reflected in the water like a mirror.", "deep": "One of about 250 water-lily paintings Monet made in his last decades. Removing the horizon flattens space into a field of reflections — a move later admired by Abstract Expressionists.", "source": "Water Lilies (1906)", "author": "Claude Monet", "year": "1906", "place": "Art Institute of Chicago", "action": "Find water outside — a puddle or pond — and look at the reflections, not the water.", "img": "art/water-lilies.jpg", "credit": "https://commons.wikimedia.org/wiki/File:Claude_Monet_-_Water_Lilies_-_1906,_Ryerson.jpg", "q": "Smarthistory Water Lilies Claude Monet"},
{"id": "a17", "topic": "Art", "level": "all", "title": "The Milkmaid", "text": "A kitchen maid pours milk into a bowl in a quiet room lit from a window. Vermeer makes an ordinary task feel calm and important.", "kid": "A lady carefully pours milk. It's so quiet you can almost hear it trickle!", "deep": "Vermeer's pointillé highlights on the bread and the costly ultramarine of the apron dignify domestic labour; X-rays show he painted out a map and a clothes basket to simplify the composition.", "source": "The Milkmaid (c.1657–1658)", "author": "Johannes Vermeer", "year": "c.1657–1658", "place": "Rijksmuseum, Amsterdam", "action": "Do one ordinary job today slowly and carefully, like the milkmaid.", "img": "art/milkmaid.jpg", "credit": "https://commons.wikimedia.org/wiki/File:Johannes_Vermeer_-_Het_melkmeisje_-_Google_Art_Project.jpg", "q": "Smarthistory The Milkmaid Johannes Vermeer"},
{"id": "a18", "topic": "Art", "level": "all", "title": "The Birth of Venus", "text": "The goddess Venus arrives on a scallop shell, blown ashore by the winds while a nymph rushes to cover her with a cloak.", "kid": "A goddess floats to the beach on a giant seashell, pushed by puffing winds!", "deep": "A Neoplatonic mythological painting on canvas — rare for its time — probably for the Medici circle. Its elongated, linear grace prizes ideal beauty over anatomical accuracy.", "source": "The Birth of Venus (c.1484–1486)", "author": "Sandro Botticelli", "year": "c.1484–1486", "place": "Uffizi Gallery, Florence", "action": "Look for the flowers blowing through the air.", "img": "art/birth-of-venus.jpg", "credit": "https://commons.wikimedia.org/wiki/File:Sandro_Botticelli_046.jpg", "q": "Smarthistory The Birth of Venus Sandro Botticelli"},
{"id": "a19", "topic": "Art", "level": "all", "title": "The Hunters in the Snow", "text": "Weary hunters and their dogs trudge home over a snowy hill while villagers skate on frozen ponds below.", "kid": "Hunters walk home through the snow while people skate and play on the ice.", "deep": "One of a series of the seasons for Antwerp banker Nicolaes Jongelinck; its sweeping diagonal and cold palette pioneered the independent winter landscape.", "source": "The Hunters in the Snow (1565)", "author": "Pieter Bruegel the Elder", "year": "1565", "place": "Kunsthistorisches Museum, Vienna", "action": "Count how many people you can find skating.", "img": "art/hunters-snow.jpg", "credit": "https://commons.wikimedia.org/wiki/File:Pieter_Bruegel_the_Elder_-_Hunters_in_the_Snow_(Winter)_-_Google_Art_Project.jpg", "q": "Smarthistory The Hunters in the Snow Pieter Bruegel the Elder"},
{"id": "a20", "topic": "Art", "level": "all", "title": "The Fighting Temeraire", "text": "A ghostly old warship, a hero of Trafalgar, is towed by a small black steam tug to be broken up, under a blazing sunset.", "kid": "A tiny steam boat pulls a big old sailing ship away as the sun sets in fiery colours.", "deep": "Turner's elegy for the age of sail; voted Britain's greatest painting in a 2005 BBC poll. Turner took liberties — the masts had been removed before the real tow.", "source": "The Fighting Temeraire (1839)", "author": "J. M. W. Turner", "year": "1839", "place": "National Gallery, London", "action": "Notice how the sunset makes you feel about the old ship.", "img": "art/fighting-temeraire.jpg", "credit": "https://commons.wikimedia.org/wiki/File:The_Fighting_Temeraire,_JMW_Turner,_National_Gallery.jpg", "q": "Smarthistory The Fighting Temeraire J. M. W. Turner"},
{"id": "a21", "topic": "Art", "level": "all", "title": "Sunflowers", "text": "A vase of sunflowers in every stage of life, painted in vibrant yellows to decorate Gauguin's room in Arles.", "kid": "Big bright sunflowers in a vase — so much yellow!", "deep": "Part of a series painted in Arles in August 1888 using new chrome-yellow pigments; Van Gogh made repetitions, and the sunflower became his emblem of gratitude.", "source": "Sunflowers (1888)", "author": "Vincent van Gogh", "year": "1888", "place": "National Gallery, London", "action": "Find something yellow and draw it.", "img": "art/sunflowers.jpg", "credit": "https://commons.wikimedia.org/wiki/File:Vincent_van_Gogh_-_Sunflowers_(1888,_National_Gallery_London).jpg", "q": "Smarthistory Sunflowers Vincent van Gogh"},
{"id": "a22", "topic": "Art", "level": "all", "title": "Café Terrace at Night", "text": "A café in Arles glows yellow under a starry blue sky. Van Gogh painted a night scene without any black.", "kid": "A happy café at night with lights glowing under the stars.", "deep": "His first painting with a starry background, made on site at night. In a letter he described 'a night painting without black'.", "source": "Café Terrace at Night (1888)", "author": "Vincent van Gogh", "year": "1888", "place": "Kröller-Müller Museum, Otterlo", "action": "Look out tonight and name the colours you see in the dark.", "img": "art/cafe-terrace.jpg", "credit": "https://commons.wikimedia.org/wiki/File:Vincent-van-gogh-cafe-terrace-on-the-place-du-forum-arles-at-night-the.jpg", "q": "Smarthistory Café Terrace at Night Vincent van Gogh"},
{"id": "a23", "topic": "Art", "level": "all", "title": "Impression, Sunrise", "text": "A misty view of Le Havre harbour with a small orange sun reflected in the water.", "kid": "An orange sun peeks through the morning mist over boats.", "deep": "Shown in 1874, its title led critic Louis Leroy to mock the group as 'Impressionists' — and the name stuck.", "source": "Impression, Sunrise (1872)", "author": "Claude Monet", "year": "1872", "place": "Musée Marmottan Monet, Paris", "action": "Watch a sunrise or sunset and notice how quickly the colours change.", "img": "art/impression-sunrise.jpg", "credit": "https://commons.wikimedia.org/wiki/File:Monet_-_Impression,_Sunrise.jpg", "q": "Smarthistory Impression, Sunrise Claude Monet"},
{"id": "a24", "topic": "Art", "level": "all", "title": "Bal du moulin de la Galette", "text": "Parisians dance, chat and drink on a sunny Sunday afternoon in Montmartre, dappled light falling through trees.", "kid": "People dancing and laughing outside on a sunny day.", "deep": "A large Impressionist depiction of modern leisure; Renoir's friends posed, and flickering patches of light dissolve forms.", "source": "Bal du moulin de la Galette (1876)", "author": "Pierre-Auguste Renoir", "year": "1876", "place": "Musée d'Orsay, Paris", "action": "Spend time outside with friends this weekend.", "img": "art/moulin-galette.jpg", "credit": "https://commons.wikimedia.org/wiki/File:Renoir,_Pierre-Auguste_-_Dance_at_Le_Moulin_de_la_Galette,_1876.jpg", "q": "Smarthistory Bal du moulin de la Galette Pierre-Auguste Renoir"},
{"id": "a25", "topic": "Art", "level": "all", "title": "The Last Supper", "text": "Jesus has just said one of the disciples will betray him; the twelve react in four groups of three.", "kid": "Jesus has dinner with his friends for the last time.", "deep": "Painted in experimental tempera on dry plaster, it began deteriorating within decades; the one-point perspective converges on Christ's head.", "source": "The Last Supper (c.1495–1498)", "author": "Leonardo da Vinci", "year": "c.1495–1498", "place": "Santa Maria delle Grazie, Milan", "action": "Read John 13 and imagine each disciple's reaction.", "img": "art/last-supper.jpg", "credit": "https://commons.wikimedia.org/wiki/File:Leonardo_da_Vinci_(1452-1519)_-_The_Last_Supper_(1495-1498).jpg", "q": "Smarthistory The Last Supper Leonardo da Vinci"},
{"id": "a26", "topic": "Art", "level": "all", "title": "The Calling of Saint Matthew", "text": "Christ points at the tax collector Matthew in a dim room; a shaft of light falls across the table.", "kid": "Jesus points at a man counting money and says 'Follow me!'", "deep": "Caravaggio's dramatic chiaroscuro and contemporary costume brought sacred narrative into the street; Christ's hand echoes Adam's in Michelangelo's Creation.", "source": "The Calling of Saint Matthew (1599–1600)", "author": "Caravaggio", "year": "1599–1600", "place": "San Luigi dei Francesi, Rome", "action": "Read Matthew 9:9 and think about who answered the call.", "img": "art/calling-matthew.jpg", "credit": "https://commons.wikimedia.org/wiki/File:Calling-of-st-matthew.jpg", "q": "Smarthistory The Calling of Saint Matthew Caravaggio"},
{"id": "a27", "topic": "Art", "level": "all", "title": "The Ambassadors", "text": "Two French envoys stand beside objects of learning. A strange smear across the floor becomes a skull when viewed from the side.", "kid": "Two men stand by a table full of instruments — and there's a hidden skull!", "deep": "The anamorphic skull is a memento mori; the broken lute string may allude to religious discord during the Reformation.", "source": "The Ambassadors (1533)", "author": "Hans Holbein the Younger", "year": "1533", "place": "National Gallery, London", "action": "Find the hidden skull by looking from the side.", "img": "art/ambassadors.jpg", "credit": "https://commons.wikimedia.org/wiki/File:Hans_Holbein_the_Younger_-_The_Ambassadors_-_Google_Art_Project.jpg", "q": "Smarthistory The Ambassadors Hans Holbein the Younger"},
{"id": "a28", "topic": "Art", "level": "all", "title": "The Tower of Babel", "text": "A colossal spiralling tower rises unfinished over a port city, swarming with builders.", "kid": "A giant tower that people tried to build all the way to heaven.", "deep": "Modelled partly on the Colosseum, the tower leans and its foundations fail — a comment on human pride (Genesis 11).", "source": "The Tower of Babel (1563)", "author": "Pieter Bruegel the Elder", "year": "1563", "place": "Kunsthistorisches Museum, Vienna", "action": "Read Genesis 11:1–9.", "img": "art/tower-babel.jpg", "credit": "https://commons.wikimedia.org/wiki/File:Pieter_Bruegel_the_Elder_-_The_Tower_of_Babel_(Vienna)_-_Google_Art_Project_-_edited.jpg", "q": "Smarthistory The Tower of Babel Pieter Bruegel the Elder"},
{"id": "a29", "topic": "Art", "level": "all", "title": "The Third of May 1808", "text": "French soldiers execute Spanish civilians at night; a man in a white shirt flings his arms wide.", "kid": "A sad painting about soldiers being unkind to people.", "deep": "A pioneering image of modern war with an anonymous firing squad; the central figure's Christ-like pose and stigmata-like marks make him a martyr.", "source": "The Third of May 1808 (1814)", "author": "Francisco Goya", "year": "1814", "place": "Museo del Prado, Madrid", "action": "Pray for people living in war zones today.", "img": "art/third-may.jpg", "credit": "https://commons.wikimedia.org/wiki/File:El_Tres_de_Mayo,_by_Francisco_de_Goya,_from_Prado_thin_black_margin.jpg", "q": "Smarthistory The Third of May 1808 Francisco Goya"},
{"id": "a30", "topic": "Art", "level": "all", "title": "Mr and Mrs Andrews", "text": "A newly married couple pose beside an oak tree with their Suffolk estate stretching behind them.", "kid": "A husband and wife sit outside with their farm behind them.", "deep": "Combines portrait and landscape; the unfinished patch on Mrs Andrews' lap has prompted speculation about an intended pheasant or child.", "source": "Mr and Mrs Andrews (c.1750)", "author": "Thomas Gainsborough", "year": "c.1750", "place": "National Gallery, London", "action": "Find the unfinished part of the painting.", "img": "art/mr-mrs-andrews.jpg", "credit": "https://commons.wikimedia.org/wiki/File:Thomas_Gainsborough_-_Mr_and_Mrs_Andrews.jpg", "q": "Smarthistory Mr and Mrs Andrews Thomas Gainsborough"},
{"id": "a31", "topic": "Art", "level": "all", "title": "Whistler's Mother", "text": "Anna Whistler sits in profile against a grey wall, in black, hands folded.", "kid": "An artist painted his mum sitting very still in a chair.", "deep": "Titled Arrangement in Grey and Black No. 1, Whistler insisted on its formal harmony, but it became an icon of motherhood.", "source": "Whistler's Mother (1871)", "author": "James McNeill Whistler", "year": "1871", "place": "Musée d'Orsay, Paris", "action": "Call your mother or a mother figure today.", "img": "art/whistlers-mother.jpg", "credit": "https://commons.wikimedia.org/wiki/File:Whistlers_Mother_high_res.jpg", "q": "Smarthistory Whistler's Mother James McNeill Whistler"},
{"id": "a32", "topic": "Art", "level": "all", "title": "Fine Wind, Clear Morning (Red Fuji)", "text": "Mount Fuji glows red in early autumn morning light under a sky of mackerel clouds.", "kid": "A big red mountain under a blue sky with fluffy clouds.", "deep": "Bold, simplified shapes and graded colour (bokashi) capture a rare atmospheric effect in late summer or early autumn.", "source": "Fine Wind, Clear Morning (Red Fuji) (c.1830–1832)", "author": "Katsushika Hokusai", "year": "c.1830–1832", "place": "Woodblock print, Thirty-six Views of Mount Fuji", "action": "Look at a mountain or hill at sunrise.", "img": "art/red-fuji.jpg", "credit": "https://commons.wikimedia.org/wiki/File:Katsushika_Hokusai,_published_by_Nishimuraya_Yohachi_(Eijud%C5%8D)_-_Fine_Wind,_Clear_Weather_(Gaif%C5%AB_kaisei),_also_known_as_Red_Fuji,_from_the_series_Thirty-six_Views_o..._-_Google_Art_Project_-_Cropped.jpg", "q": "Smarthistory Fine Wind, Clear Morning (Red Fuji) Katsushika Hokusai"},
{"id": "a33", "topic": "Art", "level": "all", "title": "Sudden Shower over Shin-Ōhashi Bridge", "text": "People hurry across a bridge as sheets of rain slash down.", "kid": "People run across a bridge in a sudden rainstorm!", "deep": "Van Gogh copied this print in 1887; the fine lines of rain show the skill of the block carvers.", "source": "Sudden Shower over Shin-Ōhashi Bridge (1857)", "author": "Utagawa Hiroshige", "year": "1857", "place": "One Hundred Famous Views of Edo", "action": "Next time it rains, watch and listen for a minute.", "img": "art/sudden-shower.jpg", "credit": "https://commons.wikimedia.org/wiki/File:Hiroshige,_Sudden_shower_over_Shin-%C5%8Chashi_bridge_and_Atake,_1857.jpg", "q": "Smarthistory Sudden Shower over Shin-Ōhashi Bridge Utagawa Hiroshige"},
{"id": "a34", "topic": "Art", "level": "all", "title": "The Kiss", "text": "A couple embrace on a flowery meadow, wrapped in a shimmering golden robe.", "kid": "Two people hug wearing beautiful golden clothes.", "deep": "The height of Klimt's 'golden period', using gold leaf inspired by Byzantine mosaics in Ravenna.", "source": "The Kiss (1907–1908)", "author": "Gustav Klimt", "year": "1907–1908", "place": "Belvedere, Vienna", "action": "Hug someone you love today.", "img": "art/the-kiss.jpg", "credit": "https://commons.wikimedia.org/wiki/File:The_Kiss_-_Gustav_Klimt_-_Google_Cultural_Institute.jpg", "q": "Smarthistory The Kiss Gustav Klimt"},
{"id": "a35", "topic": "Art", "level": "all", "title": "The Scream", "text": "A figure clutches its face on a bridge under a blood-red sky.", "kid": "A person on a bridge holds their face because they feel scared.", "deep": "Munch described feeling 'an infinite scream passing through nature'. He made several versions in paint and pastel.", "source": "The Scream (1893)", "author": "Edvard Munch", "year": "1893", "place": "National Museum, Oslo", "action": "Name one worry and share it with someone you trust.", "img": "art/the-scream.jpg", "credit": "https://commons.wikimedia.org/wiki/File:Edvard_Munch,_1893,_The_Scream,_oil,_tempera_and_pastel_on_cardboard,_91_x_73_cm,_National_Gallery_of_Norway.jpg", "q": "Smarthistory The Scream Edvard Munch"},
{"id": "a36", "topic": "Art", "level": "all", "title": "The Angelus", "text": "Two farmworkers pause in a potato field at dusk to pray the Angelus as a church bell rings.", "kid": "Two farmers stop work to pray when they hear the church bell.", "deep": "Millet said it recalled his grandmother stopping work to pray. Salvador Dalí was obsessed with it.", "source": "The Angelus (1857–1859)", "author": "Jean-François Millet", "year": "1857–1859", "place": "Musée d'Orsay, Paris", "action": "Pause at midday today for a short prayer or moment of silence.", "img": "art/the-angelus.jpg", "credit": "https://commons.wikimedia.org/wiki/File:Jean-Fran%C3%A7ois_Millet_Angelus.jpg", "q": "Smarthistory The Angelus Jean-François Millet"},
{"id": "a37", "topic": "Art", "level": "all", "title": "The Gulf Stream", "text": "A man lies on a dismasted boat surrounded by sharks, a waterspout behind him and a ship far away.", "kid": "A man on a broken boat with sharks swimming around.", "deep": "Homer refused to explain the outcome; it has been read as an image of human vulnerability and resilience.", "source": "The Gulf Stream (1899)", "author": "Winslow Homer", "year": "1899", "place": "Metropolitan Museum of Art, New York", "action": "Think of a time you felt stranded and what helped you.", "img": "art/gulf-stream.jpg", "credit": "https://commons.wikimedia.org/wiki/File:Winslow_Homer_-_The_Gulf_Stream_-_Metropolitan_Museum_of_Art.jpg", "q": "Smarthistory The Gulf Stream Winslow Homer"},
{"id": "a38", "topic": "Art", "level": "all", "title": "Carnation, Lily, Lily, Rose", "text": "Two girls light paper lanterns in a garden at dusk, surrounded by lilies.", "kid": "Two girls light glowing lanterns in a garden full of flowers.", "deep": "Sargent painted it outdoors for just a few minutes each evening over two summers to catch the twilight.", "source": "Carnation, Lily, Lily, Rose (1885–1886)", "author": "John Singer Sargent", "year": "1885–1886", "place": "Tate Britain, London", "action": "Go outside at dusk and watch the light change.", "img": "art/carnation-lily.jpg", "credit": "https://commons.wikimedia.org/wiki/File:John_Singer_Sargent_-_Carnation,_Lily,_Lily,_Rose_-_Google_Art_Project.jpg", "q": "Smarthistory Carnation, Lily, Lily, Rose John Singer Sargent"},
{"id": "a39", "topic": "Art", "level": "all", "title": "Where Do We Come From? What Are We? Where Are We Going?", "text": "Painted in Tahiti, figures across a wide canvas trace life from infancy to old age.", "kid": "A big painting showing people from babies to grandparents.", "deep": "Read right to left, Gauguin intended it as his testament; its title echoes catechism questions he learned as a boy.", "source": "Where Do We Come From? What Are We? Where Are We Going? (1897–1898)", "author": "Paul Gauguin", "year": "1897–1898", "place": "Museum of Fine Arts, Boston", "action": "Answer the three questions in the title for yourself.", "img": "art/where-do-we-come-from.jpg", "credit": "https://commons.wikimedia.org/wiki/File:Gauguin_-_Where_Do_We_Come_From%3F_What_Are_We%3F_Where_Are_We_Going%3F_(1897-98).jpg", "q": "Smarthistory Where Do We Come From? What Are We? Where Are We Going? Paul Gauguin"},
{"id": "a40", "topic": "Art", "level": "all", "title": "The Banjo Lesson", "text": "An elderly man teaches a boy to play the banjo by firelight.", "kid": "A grandpa teaches a boy to play music.", "deep": "Tanner, a leading African American artist, countered caricatured images with a dignified scene of intergenerational teaching.", "source": "The Banjo Lesson (1893)", "author": "Henry Ossawa Tanner", "year": "1893", "place": "Hampton University Museum, Virginia", "action": "Teach someone younger a skill you know.", "img": "art/banjo-lesson.jpg", "credit": "https://commons.wikimedia.org/wiki/File:Henry_Ossawa_Tanner,_The_Banjo_Lesson_(darker).jpg", "q": "Smarthistory The Banjo Lesson Henry Ossawa Tanner"},
{"id": "a41", "topic": "Art", "level": "all", "title": "The Storm on the Sea of Galilee", "text": "Christ's disciples struggle against a huge wave while Jesus remains calm (Mark 4).", "kid": "Jesus is in a boat during a big storm, and his friends are scared.", "deep": "Rembrandt's only seascape; stolen in the 1990 Gardner heist and still missing. One figure looking out is thought to be Rembrandt himself.", "source": "The Storm on the Sea of Galilee (1633)", "author": "Rembrandt van Rijn", "year": "1633", "place": "Stolen from the Isabella Stewart Gardner Museum (1990)", "action": "Read Mark 4:35–41 and name your current 'storm'.", "img": "art/storm-galilee.jpg", "credit": "https://commons.wikimedia.org/wiki/File:Rembrandt_Christ_in_the_Storm_on_the_Lake_of_Galilee.jpg", "q": "Smarthistory The Storm on the Sea of Galilee Rembrandt van Rijn"},
{"id": "a42", "topic": "Art", "level": "all", "title": "Washington Crossing the Delaware", "text": "George Washington stands in a boat crossing the icy Delaware River before the 1776 Battle of Trenton.", "kid": "A general and his soldiers row across an icy river at night.", "deep": "Painted in Düsseldorf to inspire European liberals after 1848; historically inaccurate (the flag didn't yet exist) but iconic.", "source": "Washington Crossing the Delaware (1851)", "author": "Emanuel Leutze", "year": "1851", "place": "Metropolitan Museum of Art, New York", "action": "Take one courageous step in a hard situation.", "img": "art/washington-delaware.jpg", "credit": "https://commons.wikimedia.org/wiki/File:Washington_Crossing_the_Delaware_by_Emanuel_Leutze,_MMA-NYC,_1851.jpg", "q": "Smarthistory Washington Crossing the Delaware Emanuel Leutze"},

/* ---------- State ---------- */
const KEY='stash.v1';
const INT=[1,3,7,14,30]; // Leitner box intervals (days)
const DEF=()=>({v:2,cards:[],stashes:[{id:'st_general',name:'General'}],saved:{},favs:{},read:{},actions:{},box:{},days:[],streak:{count:0,best:0,last:null},daily:null,lastReview:null,review:{},
  xp:0,xpk:{},badges:{},badgeInit:false,stats:{focus:0,breathe:0,reviews:0,quizzes:0,perfectQuiz:0,stories:0,bonus:0},settings:{mood:'focus',vol:.5,sfx:true,motion:true,pomo:[25,5],level:'high',theme:'dark',accent:'amber',tts:{voice:'',rate:1,auto:true},haptics:true},habits:[],journal:{},goals:[],prefs:{topics:[]},model:null,onboarded:false,quiz:null,done5:null,mile:null});
let S;
function normalize(){const d=DEF();for(const k of['stats','settings','prefs'])S[k]=Object.assign(d[k],S[k]||{});S.model=Object.assign(DEFM(),S.model||{});if(!Array.isArray(S.habits))S.habits=[];if(!S.journal||typeof S.journal!=='object'||Array.isArray(S.journal))S.journal={};if(!Array.isArray(S.goals))S.goals=[];S.settings.tts=Object.assign({voice:'',rate:.95,pitch:1,auto:true,ai:false},S.settings.tts||{});if((S.v||0)<6&&+S.settings.tts.rate===1)S.settings.tts.rate=.95;if(!S.challenges||typeof S.challenges!=='object'||Array.isArray(S.challenges))S.challenges={};if(!S.devo||typeof S.devo!=='object'||Array.isArray(S.devo))S.devo={};S.settings.mood=({uplift:'focus',rain:'nature'})[S.settings.mood]||S.settings.mood;if(!['calm','focus','piano','classical','worship','nature','synth'].includes(S.settings.mood))S.settings.mood='calm';S.v=6}
try{S=Object.assign(DEF(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){S=DEF()}normalize();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Storage full or unavailable')}};
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dkey=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const addDays=(k,n)=>{const[y,m,d]=k.split('-').map(Number);return dkey(new Date(y,m-1,d+n))};
const fmtDay=k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})};
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const all=()=>SEED.concat(LEARN,S.cards);
const byId=id=>all().find(c=>c.id===id);
const isSaved=id=>!!(S.saved[id]&&S.saved[id].length);
const isFav=id=>!!S.favs[id];
const isDone=id=>!!S.actions[id];
function hash(str){let h=2166136261;for(const ch of str){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){return()=>{seed=(seed+0x6D2B79F5)|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(a,r=Math.random){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

/* ---------- Streak ---------- */
function touchStreak(){
  const t=dkey();if(S.streak.last===t)return;
  S.streak.count=S.streak.last===addDays(t,-1)?S.streak.count+1:1;
  S.streak.best=Math.max(S.streak.best,S.streak.count);S.streak.last=t;
  if(!S.days.includes(t))S.days.push(t);S.days=S.days.slice(-400);
  if([3,7,30,100].includes(S.streak.count))S.mile={n:S.streak.count,d:t,shown:false};save();
}

/* ---------- Spaced repetition (Leitner) ---------- */
function savedIds(){return all().filter(c=>isSaved(c.id)||isFav(c.id)).map(c=>c.id)}
function boxOf(id){return S.box[id]||{b:1,due:dkey()}}
function ensureBox(id){if(!S.box[id]&&(isSaved(id)||isFav(id)))S.box[id]={b:1,due:dkey()}}
function dueIds(){const t=dkey();return savedIds().filter(id=>boxOf(id).due<=t)}
function nextDue(){const ds=savedIds().map(id=>boxOf(id).due).sort();return ds[0]}
function grade(id,ok,advance){
  const bx=boxOf(id);
  if(!ok){bx.b=1;bx.due=addDays(dkey(),INT[0])}
  else if(advance){bx.b=Math.min(bx.b+1,5);bx.due=addDays(dkey(),Math.max(1,Math.round(INT[bx.b-1]*BR.revMult(id))))}
  else{bx.due=addDays(dkey(),Math.max(1,Math.round(INT[bx.b-1]*BR.revMult(id))))}
  S.box[id]=bx;
}

/* ---------- Daily feed ---------- */
function buildDaily(){
  const t=dkey();
  if(S.daily&&S.daily.date===t&&S.daily.ids.every(byId))return;
  const r=rng(hash(t)),pool=SEED.concat(S.cards);
  const rk=BR.rank(shuffle(pool,r),r,5);
  S.daily={date:t,ids:rk.ids,why:rk.why,idx:0};save();
}
function markRead(id){if(id&&!S.read[id]){S.read[id]=dkey();save();addXP(5)}}

}

function renderFeed(dir){
  const d=S.daily,n=d.ids.length,stage=$('#stage');

    stage.appendChild(el);hide(true);BR.leave();$('#fPrev').disabled=false;$('#fPrev').style.opacity=1;return;

  const el=document.createElement('div');el.className='icard front';el.style.cssText=gvars(c.topic);el.innerHTML=cardHTML(c,d.idx,n);el.dataset.id=c.id;BG.setPalette(c.topic);
  if(dir){el.style.transform=dir>0?'scale(.94) translateY(16px)':'translateX(-120%) rotate(-12deg)';el.style.opacity=dir>0?.5:0;stage.appendChild(el);requestAnimationFrame(()=>requestAnimationFrame(()=>{el.style.transform='';el.style.opacity=''}))}
  else stage.appendChild(el);
  markRead(c.id);BR.enter(c.id);
  $('#fPrev').disabled=d.idx===0;$('#fPrev').style.opacity=d.idx===0?.4:1;
  syncFeedBtns();attachSwipe(el);
}
function curId(){return S.daily.ids[S.daily.idx]}
function syncFeedBtns(){if(S.daily.idx>=S.daily.ids.length)return;const id=curId();$('#fFav').classList.toggle('on',isFav(id));$('#fSave').classList.toggle('on',isSaved(id));
  const a=$('#stage .icard.front .act');if(a){a.classList.toggle('done',isDone(id));a.querySelector('.tk').setAttribute('aria-pressed',isDone(id))}}
function step(dir){
  if(animating)return;const d=S.daily,ni=d.idx+dir;if(ni<0||ni>d.ids.length)return;
  animating=true;setTimeout(()=>animating=false,300);BR.leave();d.idx=ni;save();SND.sfx('flip');renderFeed(dir);
}

function hl(text,q){const e=esc(text);if(!q)return e;const qq=esc(q).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');return e.replace(new RegExp(qq,'gi'),m=>`<mark class="hl" style="background:none">${m}</mark>`)}
