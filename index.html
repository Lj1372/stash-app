["History", "Federation of Australia", "On 1 January 1901 six British colonies federated into the Commonwealth of Australia, with Edmund Barton as first prime minister, after referendums approved the Constitution.", "Commonwealth of Australia Constitution Act 1900", "Edmund Barton", "Learn one fact about your state's history before 1901."],
["History", "History rhymes", "A saying often attributed to Mark Twain (though not found in his writings) goes: 'History doesn't repeat itself, but it often rhymes.' Patterns recur even when details differ.", "Attributed to Mark Twain", "Mark Twain (attributed)", "Spot one modern trend that rhymes with an older one."],
["History", "The Wright approach", "The Wright brothers, bicycle makers without degrees, built their own wind tunnel in 1901 to correct flawed published data. Careful testing beat better-funded rivals to powered flight.", "The Wright Brothers", "David McCullough", "Test your assumptions with a quick experiment instead of trusting old data."],
["History", "Stories matter", "Herodotus, called the 'Father of History', wrote his Histories (c.430 BC) so that great deeds 'might not be forgotten'. Recording memory is how cultures learn.", "Histories", "Herodotus", "Write down one family story before it's forgotten."],
["Philosophy", "The examined life", "At his trial in 399 BC, Socrates said 'the unexamined life is not worth living for a human being'. Questioning our beliefs and values is part of living well.", "Apology 38a", "Plato (Socrates)", "Spend five minutes writing why you believe one thing you've never questioned."],
["Philosophy", "Socratic ignorance", "Socrates claimed to be wise only in knowing that he did not know. Admitting ignorance is the doorway to learning.", "Apology 21d", "Plato (Socrates)", "Say 'I don't know — let's find out' at least once today."],
["Philosophy", "The allegory of the cave", "Plato imagines prisoners who mistake shadows on a wall for reality. One escapes, sees the sun and returns — but the others resist. Education is turning the soul toward the light.", "Republic, Book VII", "Plato", "Ask: what 'shadows' — news, feeds, opinions — am I mistaking for the whole picture?"],
["Philosophy", "Virtue is a habit", "Aristotle taught that 'we become just by doing just acts, temperate by doing temperate acts, brave by doing brave acts'. Character is built through practice.", "Nicomachean Ethics, Book II", "Aristotle", "Choose one virtue and perform one small act of it today."],
["Philosophy", "The golden mean", "Aristotle saw each virtue as a mean between two vices: courage lies between cowardice and recklessness; generosity between stinginess and extravagance.", "Nicomachean Ethics, Book II", "Aristotle", "Identify an area where you swing to an extreme and name the middle path."],
["Philosophy", "Eudaimonia", "Aristotle argued the highest human good is eudaimonia — flourishing — achieved by activity in accordance with virtue over a complete life, not by pleasure or honour alone.", "Nicomachean Ethics, Book I", "Aristotle", "Write what 'flourishing' would look like for you in ten years."],
["Philosophy", "Friendship of virtue", "Aristotle distinguished friendships of utility, of pleasure and of virtue. Only the last — loving a friend for who they are — is complete and lasting.", "Nicomachean Ethics, Book VIII", "Aristotle", "Tell a friend one quality you admire in their character."],
["Philosophy", "Cogito ergo sum", "Seeking a certain foundation, Descartes doubted everything he could. He found one thing he couldn't doubt: the very act of doubting proves a thinker exists — 'I think, therefore I am.'", "Discourse on the Method (1637)", "René Descartes", "Separate what you know for certain about a problem from what you assume."],
["Philosophy", "Pascal's wager", "Pascal argued that since reason can't settle God's existence, one should weigh the stakes: wagering on God risks little and may gain infinitely. He also wrote, 'The heart has its reasons which reason knows nothing of.'", "Pensées", "Blaise Pascal", "Reflect on what you're 'betting your life' on."],
["Philosophy", "Sitting quietly", "Pascal wrote: 'I have discovered that all the unhappiness of men arises from one single fact, that they cannot stay quietly in their own chamber' (Trotter translation). Distraction keeps us from facing ourselves.", "Pensées, 139 (Brunschvicg numbering)", "Blaise Pascal", "Sit alone for ten minutes with no phone."],
["Philosophy", "The categorical imperative", "Kant proposed: act only on principles you could will to become universal laws, and treat humanity never merely as a means but always also as an end.", "Groundwork of the Metaphysics of Morals (1785)", "Immanuel Kant", "Before a decision today, ask: what if everyone did this?"],
["Philosophy", "The greatest happiness", "Utilitarians like Bentham and Mill judged actions by their consequences for overall well-being. Mill added that some pleasures are higher than others: 'better to be Socrates dissatisfied than a fool satisfied'.", "Utilitarianism (1863)", "John Stuart Mill", "Pick a decision and list who it affects and how."],
["Philosophy", "The harm principle", "Mill argued the only justification for restricting someone's liberty against their will is to prevent harm to others — not to protect them from themselves.", "On Liberty (1859)", "John Stuart Mill", "Notice where you try to control choices that only affect someone else."],
["Philosophy", "The veil of ignorance", "Rawls asked us to design a just society as if we didn't know what position we'd occupy — rich or poor, healthy or sick. Behind this 'veil of ignorance', we'd choose fair rules.", "A Theory of Justice (1971)", "John Rawls", "Judge one rule at work or home as if you might be the person it affects worst."],
["Philosophy", "Man's search for meaning", "Frankl, who survived Auschwitz, argued that the primary human drive is meaning. Meaning can be found in work, in love and in the attitude we take toward unavoidable suffering.", "Man's Search for Meaning", "Viktor Frankl", "Write one sentence about what gives your current struggles meaning."],
["Philosophy", "The last freedom", "Frankl wrote that everything can be taken from a person but one thing: 'the last of the human freedoms — to choose one's attitude in any given set of circumstances'.", "Man's Search for Meaning", "Viktor Frankl", "In a frustrating moment today, consciously choose your response."],
["Philosophy", "Mere Christianity's moral law", "Lewis argued that people everywhere appeal to a standard of fair play they didn't invent and don't fully keep — a moral law that points beyond nature to a Mind behind the universe.", "Mere Christianity", "C. S. Lewis", "Notice when you say 'that's not fair' today and ask where the standard comes from."],
["Philosophy", "Amor fati", "Nietzsche wrote that his formula for greatness was amor fati — not merely to bear what is necessary but to love it, wanting nothing to be different.", "Ecce Homo (1888)", "Friedrich Nietzsche", "Find one unwanted event this week and look for what it gives you."],
["Philosophy", "He who has a why", "Nietzsche wrote, 'If we have our own why of life, we shall get along with almost any how' (Kaufmann translation). Frankl later quoted it as 'He who has a why to live for can bear with almost any how' to describe survival in the camps.", "Twilight of the Idols (1889), Maxims 12", "Friedrich Nietzsche", "Write down your 'why' for your hardest current task."],
["Philosophy", "Leap of faith", "Kierkegaard argued that faith isn't the conclusion of an argument but a passionate commitment. 'Life can only be understood backwards; but it must be lived forwards.'", "Journals (1843)", "Søren Kierkegaard", "Make one decision today you've been postponing until you were 'certain'."],
["Philosophy", "Absurd and Sisyphus", "Camus saw life as 'absurd' — our hunger for meaning meets a silent universe. His Sisyphus keeps pushing his rock: 'One must imagine Sisyphus happy.'", "The Myth of Sisyphus (1942)", "Albert Camus", "Find joy in one repetitive task today."],
["Philosophy", "Hume's is–ought gap", "Hume noticed writers slide from describing how things are to claiming how they ought to be, without justifying the leap. Facts alone don't yield values.", "A Treatise of Human Nature (1739)", "David Hume", "Catch one 'should' statement and ask what value supports it."],
["Philosophy", "The Tao that can be told", "The Tao Te Ching opens: 'The Tao that can be told is not the eternal Tao.' Laozi counsels yielding, simplicity and wu wei — effortless action in harmony with nature.", "Tao Te Ching, ch. 1", "Laozi", "Do one task today without forcing — go with the grain."],
["Philosophy", "Water overcomes stone", "Laozi noted nothing is softer than water, yet nothing is better at overcoming the hard and strong. Gentleness and persistence often win.", "Tao Te Ching, ch. 78", "Laozi", "Respond to resistance today with patience instead of force."],
["Philosophy", "Confucius on learning", "'Learning without thought is labour lost; thought without learning is perilous.' Confucius paired study with reflection.", "Analects 2.15", "Confucius", "After reading something today, write one reflection on it."],
["Philosophy", "The silver rule", "Asked for one word to guide a life, Confucius answered 'reciprocity': 'What you do not want done to yourself, do not do to others.'", "Analects 15.24", "Confucius", "Notice one way you treat others that you wouldn't want for yourself."],
["Philosophy", "Ship of Theseus", "If every plank of a ship is replaced over time, is it the same ship? Plutarch recorded the puzzle; it raises questions about identity that apply to us, as our cells renew.", "Life of Theseus", "Plutarch", "Reflect on what makes you 'you' after years of change."],
["Psychology", "System 1 and System 2", "Kahneman describes two modes of thinking: fast, intuitive, automatic System 1 and slow, effortful, logical System 2. Many errors come from System 1 answering when System 2 should.", "Thinking, Fast and Slow", "Daniel Kahneman", "Before an important decision, pause and ask: is this my fast or slow brain talking?"],
["Psychology", "Loss aversion", "Kahneman and Tversky found losses loom larger than equivalent gains — losing $100 feels worse than winning $100 feels good. This skews choices toward avoiding loss.", "Prospect Theory (1979)", "Kahneman & Tversky", "Reframe one decision in terms of gains instead of losses."],
["Psychology", "Anchoring", "Arbitrary first numbers bias later estimates. In one experiment, a spun wheel's number influenced people's guesses about African UN membership.", "Science (1974)", "Tversky & Kahneman", "When negotiating, decide your number before hearing theirs."],
["Psychology", "Confirmation bias", "We tend to seek, interpret and remember information that confirms what we already believe. Peter Wason's experiments in the 1960s showed how rarely people test their own hypotheses.", "Quarterly Journal of Experimental Psychology (1960)", "Peter Wason", "Read one thoughtful article that argues against your view."],
["Psychology", "The Dunning–Kruger effect", "Dunning and Kruger found people with low skill in a domain often overestimate their ability, partly because the skills to perform are the same skills needed to judge performance.", "Journal of Personality and Social Psychology (1999)", "David Dunning & Justin Kruger", "Ask an expert to rate your skill honestly in one area."],
["Psychology", "Learned helplessness", "Seligman found that animals exposed to inescapable stress stopped trying to escape even when they could. People, too, can learn that effort is futile — and can unlearn it.", "Learned Optimism", "Martin Seligman", "List one area where you've given up, and one small action that could still work."],
["Psychology", "Explanatory style", "Seligman found optimists explain setbacks as temporary, specific and not entirely their fault; pessimists see them as permanent, pervasive and personal. Optimism can be learned.", "Learned Optimism", "Martin Seligman", "Rewrite one setback as temporary and specific."],
["Psychology", "Flow", "Csikszentmihalyi described flow: complete absorption when challenge matches skill and goals are clear with immediate feedback. People report it as among their best moments.", "Flow", "Mihaly Csikszentmihalyi", "Set a challenge slightly above your skill and work for 25 minutes."],
["Psychology", "Maslow's hierarchy", "Maslow proposed that human needs run from physiological and safety needs through love and esteem to self-actualisation. Later research shows the order is less rigid than a pyramid suggests.", "A Theory of Human Motivation (1943)", "Abraham Maslow", "Check which basic need — sleep, food, safety — you're neglecting."],
["Psychology", "The marshmallow test", "Walter Mischel's 1960s–70s studies tested children's ability to wait for a second treat. Later work (Watts et al. 2018) found the link to later success was smaller once background was accounted for — strategies for waiting matter.", "The Marshmallow Test", "Walter Mischel", "Use distraction to resist one temptation today."],
["Psychology", "Cognitive reframing", "Cognitive behavioural therapy, developed by Aaron Beck, teaches that thoughts shape feelings. Spotting distortions like catastrophising and replacing them with balanced thoughts reduces distress.", "Cognitive Therapy and the Emotional Disorders", "Aaron T. Beck", "Write one anxious thought and a more balanced alternative."],
["Psychology", "The spotlight effect", "Gilovich found people overestimate how much others notice them. In one study, students in an embarrassing T-shirt guessed half the room noticed; the real figure was about a quarter.", "Journal of Personality and Social Psychology (2000)", "Thomas Gilovich et al.", "Do one slightly awkward thing today and notice how little attention it gets."],
["Psychology", "The power of habits", "Charles Duhigg describes habits as a loop of cue, routine and reward. To change a habit, keep the cue and reward but swap the routine.", "The Power of Habit", "Charles Duhigg", "Identify the cue for one bad habit and plan a new routine for it."],
["Psychology", "Hedonic adaptation", "We quickly return to a baseline of happiness after good or bad events — the 'hedonic treadmill' (Brickman & Campbell). Gratitude and variety slow adaptation.", "Hedonic Relativism and Planning the Good Society (1971)", "Brickman & Campbell", "Appreciate one thing you've stopped noticing."],
["Psychology", "Gratitude works", "Emmons and McCullough found people who wrote weekly about things they were grateful for felt better about their lives and exercised more than those who wrote about hassles.", "Journal of Personality and Social Psychology (2003)", "Robert Emmons & Michael McCullough", "Write three things you're grateful for tonight."],
["Psychology", "The paradox of choice", "Schwartz argues too many options can lead to paralysis and regret. 'Satisficers' who choose 'good enough' tend to be happier than 'maximisers'.", "The Paradox of Choice", "Barry Schwartz", "Make one choice today with a 'good enough' rule."],
["Psychology", "Implementation intentions", "Gollwitzer showed 'if-then' plans — 'If it's 7am, then I'll run' — greatly increase follow-through compared with goals alone.", "American Psychologist (1999)", "Peter Gollwitzer", "Write one if-then plan for tomorrow."],
["Psychology", "Self-compassion", "Kristin Neff's research shows treating yourself with the kindness you'd show a friend reduces anxiety and increases motivation more than harsh self-criticism.", "Self-Compassion", "Kristin Neff", "Speak to yourself today as you would to a good friend."],
["Psychology", "Emotional granularity", "Lisa Feldman Barrett's research suggests people who can name emotions precisely — 'disappointed', 'anxious', 'lonely' rather than just 'bad' — regulate them better.", "How Emotions Are Made", "Lisa Feldman Barrett", "Name your current feeling with three precise words."],
["Psychology", "The peak-end rule", "Kahneman found we judge experiences mostly by their most intense moment and how they ended, not their total duration.", "Psychological Science (1993)", "Kahneman et al.", "End today's family time or meeting on a high note."],
["Psychology", "The Zeigarnik effect", "Bluma Zeigarnik observed that unfinished tasks stay on our minds more than finished ones. Writing a next step can quiet the nagging.", "Psychologische Forschung (1927)", "Bluma Zeigarnik", "Write the next step for every open task before bed."],
["Psychology", "The fundamental attribution error", "We tend to blame others' behaviour on character but our own on circumstances. Ross named this the fundamental attribution error.", "Advances in Experimental Social Psychology (1977)", "Lee Ross", "When someone annoys you, list two situational reasons they might act that way."],
["Psychology", "Grit", "Angela Duckworth defines grit as passion and perseverance for long-term goals. Effort counts twice: talent × effort = skill; skill × effort = achievement.", "Grit", "Angela Duckworth", "Stick with one hard task five minutes past when you'd usually quit."],
["Psychology", "Ego depletion debate", "Baumeister proposed willpower runs out like a muscle. Large replication efforts have failed to confirm the effect robustly — a reminder to hold findings loosely.", "Perspectives on Psychological Science (2016)", "Hagger et al.", "Plan hard tasks early anyway — just don't believe you're 'out' of willpower."],
["Psychology", "Mere exposure", "Robert Zajonc found people develop a preference for things simply because they're familiar. Repeated exposure breeds liking.", "Journal of Personality and Social Psychology (1968)", "Robert Zajonc", "Give a new food, song or person a second and third try."],
["Creativity", "Show your work", "Kleon suggests sharing your process — small daily bits of what you're learning — to build an audience and community before you're 'ready'.", "Show Your Work!", "Austin Kleon", "Share one work-in-progress today."],
["Creativity", "The Resistance", "Pressfield names the force that stops us creating 'Resistance' — procrastination, self-doubt and distraction. The pro beats it by showing up daily regardless of mood.", "The War of Art", "Steven Pressfield", "Sit down and work on your creative project for 30 minutes, inspired or not."],
["Creativity", "Morning pages", "Julia Cameron recommends writing three longhand pages every morning, stream of consciousness, to clear mental clutter and unblock creativity.", "The Artist's Way", "Julia Cameron", "Write three pages tomorrow morning before checking your phone."],
["Creativity", "The artist date", "Cameron suggests a weekly solo outing to something that delights you — a gallery, a walk, a shop — to refill your 'creative well'.", "The Artist's Way", "Julia Cameron", "Book a one-hour artist date this week."],
["Creativity", "Quantity leads to quality", "In a story told in Art & Fear, a ceramics class graded on quantity produced better pots than one graded on quality: practice beats perfectionism.", "Art & Fear", "David Bayles & Ted Orland", "Produce ten quick versions of something instead of one perfect one."],
["Creativity", "Creativity is connecting things", "Steve Jobs said creativity is 'just connecting things'. Varied experiences give you more dots to connect.", "Wired interview (1996)", "Steve Jobs", "Combine two unrelated hobbies into one idea."],
["Creativity", "Ship it", "Seth Godin urges artists to 'ship' — to finish and release work on time. Shipping beats endlessly polishing in private.", "Linchpin", "Seth Godin", "Release one thing you've been sitting on."],
["Creativity", "Constraints spark ideas", "Dr. Seuss wrote Green Eggs and Ham using only 50 different words after a bet with his publisher. Limits force inventive solutions.", "Green Eggs and Ham (1960)", "Dr. Seuss", "Set a strict constraint on your next creative task."],
["Creativity", "Big Magic", "Elizabeth Gilbert treats ideas as visitors seeking collaborators. Curiosity, not passion, is a gentler guide: follow small interests and see where they lead.", "Big Magic", "Elizabeth Gilbert", "Follow one small curiosity today for 15 minutes."],
["Creativity", "Incubation", "Graham Wallas described creativity in four stages: preparation, incubation, illumination and verification. Stepping away lets the unconscious work.", "The Art of Thought (1926)", "Graham Wallas", "Work hard on a problem, then go for a walk and let it simmer."],
["Creativity", "Divergent then convergent", "Creative problem-solving alternates generating many options (divergent) with choosing the best (convergent). Mixing them too early kills ideas.", "Creative problem-solving (Osborn–Parnes)", "Alex Osborn", "Brainstorm 20 ideas without judging, then pick the top three."],
["Creativity", "Walk to think", "Stanford researchers Oppezzo and Schwartz found walking boosted creative ideation by about 60% compared with sitting, on average.", "Journal of Experimental Psychology (2014)", "Marily Oppezzo & Daniel Schwartz", "Take your next brainstorm on a walk."],
["Creativity", "The adjacent possible", "Steven Johnson describes innovation happening at the edge of what's currently possible. Great ideas often occur to several people at once when the pieces are ready.", "Where Good Ideas Come From", "Steven Johnson", "Keep a 'spark file' of half-ideas to revisit monthly."],
["Creativity", "The gap", "Ira Glass described the gap between your taste and your ability when starting creative work. The only way through is to do a large volume of work.", "Ira Glass on storytelling (2009)", "Ira Glass", "Commit to a volume target — e.g. 30 sketches this month."],
["Creativity", "Beginner's mind", "Shunryu Suzuki wrote: 'In the beginner's mind there are many possibilities, but in the expert's there are few.' Openness fuels creativity.", "Zen Mind, Beginner's Mind", "Shunryu Suzuki", "Approach a familiar task as if seeing it for the first time."],
["Creativity", "Creative confidence", "Tom and David Kelley argue everyone is creative; fear of judgement blocks us. Small successes build creative confidence.", "Creative Confidence", "Tom & David Kelley", "Sketch a solution to one everyday annoyance."],
["Creativity", "Make things daily", "Twyla Tharp says creativity is a habit built through rituals. She starts each day by hailing a taxi to the gym — the ritual is getting in the cab.", "The Creative Habit", "Twyla Tharp", "Design a tiny starting ritual for your creative work."],
["Creativity", "Think in metaphors", "Metaphors map one domain onto another and reveal new angles. Lakoff and Johnson argue metaphor shapes how we think, not just how we speak.", "Metaphors We Live By", "George Lakoff & Mark Johnson", "Describe your current project as a journey, a garden or a building."],
["Creativity", "Ask 'What if?'", "Warren Berger describes how innovators move from 'Why?' to 'What if?' to 'How?'. Asking what would happen if a rule or assumption didn't exist opens new options.", "A More Beautiful Question (2014)", "Warren Berger", "Ask three 'What if?' questions about a problem today."],
["Creativity", "Candid feedback", "Pixar's 'Braintrust' gives directors frank notes on early films. Catmull writes every Pixar film is terrible at first; candour turns 'ugly babies' into great work.", "Creativity, Inc.", "Ed Catmull", "Show early work to someone honest and ask what's not working."],
["Creativity", "Boredom breeds ideas", "Researchers Mann and Cadman found participants who did a boring task first came up with more creative ideas afterwards. Mind-wandering helps.", "Creativity Research Journal (2014)", "Sandi Mann & Rebekah Cadman", "Spend ten minutes doing nothing — no phone."],
["Creativity", "Capture everything", "Leonardo da Vinci filled thousands of notebook pages with sketches, observations and ideas. Capturing thoughts prevents loss and sparks connections.", "Leonardo da Vinci", "Walter Isaacson", "Carry a notebook or notes app and capture five ideas today."],
["Creativity", "Curiosity like Leonardo", "Isaacson notes Leonardo wrote to-do lists like 'describe the tongue of the woodpecker'. Relentless curiosity for its own sake fed his genius.", "Leonardo da Vinci", "Walter Isaacson", "Write a curiosity list of five odd questions and research one."],
["Creativity", "Done is better than perfect", "A slogan on Facebook's early office walls captured a creative truth: perfectionism prevents completion. Iterate after you finish.", "Lean In", "Sheryl Sandberg", "Finish a draft today, flaws and all."],
["Creativity", "Play is serious", "Stuart Brown's research on play suggests it fuels creativity, problem-solving and well-being in adults, not just children.", "Play", "Stuart Brown", "Schedule 20 minutes of pure play this week."],
["Business & Sales", "Build something people want", "Y Combinator's motto, which Paul Graham says they came up with about a month after starting YC, is 'Make something people want.' It came from his own failure building software nobody wanted; a product people genuinely need matters more than anything else.", "Be Good (2008 essay)", "Paul Graham", "Talk to three potential customers before building anything new."],
["Business & Sales", "Do things that don't scale", "Graham advises founders to recruit users manually and give extraordinary service early on — Airbnb's founders visited hosts to photograph listings themselves.", "Do Things That Don't Scale (2013)", "Paul Graham", "Personally contact one customer this week to ask how you can help."],
["Business & Sales", "Minimum viable product", "Eric Ries recommends launching the smallest product that tests your key assumption, then iterating through build–measure–learn loops.", "The Lean Startup", "Eric Ries", "Define the smallest experiment that would test your idea."],
["Business & Sales", "Zero to one", "Thiel argues true innovation creates something new (0 to 1) rather than copying (1 to n). Aim for a small market you can dominate, then expand.", "Zero to One", "Peter Thiel", "Ask: what important truth do few people agree with me on?"],
["Business & Sales", "Blue ocean strategy", "Kim and Mauborgne suggest creating uncontested market space ('blue oceans') instead of fighting rivals in bloody 'red oceans'. Cirque du Soleil reinvented the circus this way.", "Blue Ocean Strategy", "W. Chan Kim & Renée Mauborgne", "List factors your industry competes on and one you could eliminate."],
["Business & Sales", "The flywheel", "Jim Collins found great companies build momentum like a heavy flywheel — consistent pushes in one direction compound, rather than one dramatic breakthrough.", "Good to Great", "Jim Collins", "Identify the repeating loop that drives your work's momentum."],
["Business & Sales", "Hedgehog concept", "Collins' great companies focused on the intersection of three circles: what they could be best in the world at, what drives their economic engine and what they're deeply passionate about.", "Good to Great", "Jim Collins", "Draw your three circles and find the overlap."],
["Business & Sales", "The disruptive innovation", "Christensen showed incumbents often fail by serving their best customers too well, while cheaper, simpler entrants start at the low end and move up.", "The Innovator's Dilemma", "Clayton Christensen", "Ask what a cheaper, simpler competitor to your work would look like."],
["Business & Sales", "Jobs to be done", "Christensen argued customers 'hire' products to do a job. A milkshake study found morning buyers hired it for a long, boring commute.", "Competing Against Luck", "Clayton Christensen", "Ask a customer: what were you trying to get done when you bought this?"],
["Business & Sales", "SPIN selling", "Neil Rackham's research on 35,000 sales calls found successful salespeople in large deals asked Situation, Problem, Implication and Need-payoff questions rather than pitching early.", "SPIN Selling", "Neil Rackham", "Prepare one implication question for your next sales conversation."],
["Business & Sales", "The Challenger sale", "Dixon and Adamson found top B2B performers 'teach, tailor and take control' — offering customers new insight into their business rather than just building rapport.", "The Challenger Sale", "Matthew Dixon & Brent Adamson", "Share one genuinely useful insight with a client this week."],
["Business & Sales", "Listen more than you talk", "Gong's analysis of B2B sales calls found the highest-performing conversations had a 43:57 talk-to-listen ratio — the seller talked about 43% of the time, letting buyers speak more. Listening uncovers needs.", "Gong Labs analysis of 25,537 B2B sales calls", "Gong Labs", "In your next call, count your questions and aim to talk less than half the time."],
["Business & Sales", "Never split the difference", "Former FBI negotiator Chris Voss recommends tactical empathy: label emotions ('It seems like…'), mirror their last words and ask calibrated 'How' and 'What' questions.", "Never Split the Difference", "Chris Voss", "Use one label ('It sounds like…') in a conversation today."],
["Business & Sales", "Getting to yes", "Fisher and Ury's principled negotiation: separate people from the problem, focus on interests not positions, invent options for mutual gain, and insist on objective criteria.", "Getting to Yes", "Roger Fisher & William Ury", "Before your next negotiation, write the other side's interests, not their demands."],
["Business & Sales", "Follow up", "Jeb Blount argues that disciplined, persistent prospecting and follow-up — not talent or tricks — separates top salespeople, and that many give up far too soon. Polite persistence that adds value keeps you in the conversation.", "Fanatical Prospecting (2015)", "Jeb Blount", "Follow up on one stalled conversation with something useful."],
["Business & Sales", "Under-promise, over-deliver", "Tom Peters urged firms to 'under-promise, over-deliver': customers rated keeping your word and reliability above almost everything else. Exceeding expectations builds trust and word of mouth.", "Thriving on Chaos (1987)", "Tom Peters (popularised; earlier used by Gifford Pinchot, 1985)", "Deliver one thing earlier than promised this week."],
["Business & Sales", "The customer is the boss", "Sam Walton said, 'There is only one boss. The customer. And he can fire everybody in the company from the chairman on down, simply by spending his money somewhere else.'", "Attributed to Sam Walton (cf. Wal-Mart 1988 Annual Report)", "Sam Walton (attributed)", "Fix one small customer annoyance today."],
["Business & Sales", "It's all about the long term", "Jeff Bezos framed Amazon's strategy around customer obsession and long-term thinking, writing in his 1997 letter that 'it's all about the long term'.", "1997 Letter to Shareholders", "Jeff Bezos", "Make one decision based on the five-year view, not this quarter."],
["Business & Sales", "Disagree and commit", "Bezos encouraged teams to voice disagreement but then fully commit once a decision is made, avoiding endless consensus-seeking.", "2016 Letter to Shareholders", "Jeff Bezos", "If you lose a debate this week, commit wholeheartedly anyway."],
["Business & Sales", "Two-way doors", "Bezos distinguished irreversible 'one-way door' decisions, which deserve care, from reversible 'two-way doors', which should be made quickly.", "2015 Letter to Shareholders", "Jeff Bezos", "Make one reversible decision today without overthinking."],
["Business & Sales", "Pricing is positioning", "Pricing expert Hermann Simon shows that price signals quality and positioning, not just cost: customers often read a higher price as a sign of a better product. Price deliberately for the customers you want to serve.", "Confessions of the Pricing Man (2015)", "Hermann Simon", "Review one price you charge and what it signals."],
["Business & Sales", "The 80/20 rule", "Vilfredo Pareto observed that wealth and income were highly concentrated — roughly 80% held by about 20% of people. Joseph Juran later generalised this as the 'vital few' principle: in business, a minority of customers often produce most revenue.", "Cours d’économie politique (1896); Joseph Juran", "Vilfredo Pareto", "Find your top 20% of customers and serve them better."],
["Business & Sales", "Purple cow", "Seth Godin argues being 'remarkable' — worth making a remark about — is the new marketing. Safe and ordinary is invisible.", "Purple Cow", "Seth Godin", "Brainstorm one remarkable twist on your product."],
["Business & Sales", "Permission marketing", "Godin argued attention is scarce; earn permission to deliver anticipated, personal and relevant messages instead of interrupting people.", "Permission Marketing", "Seth Godin", "Offer something genuinely useful to earn someone's attention."],
["Business & Sales", "Cash is king", "Berman and Knight stress that profit is not cash: a business can be profitable on paper and still fail because it runs out of cash. Watch cash flow, not just profit.", "Financial Intelligence for Entrepreneurs (2008), Part 4 \"Cash Is King\"", "Karen Berman & Joe Knight", "Check your (or your business's) cash runway today."],
["Stoicism", "It's our judgements that disturb us", "'Men are disturbed not by things, but by the opinions about things,' Epictetus wrote. Events are neutral until we judge them.", "Enchiridion 5", "Epictetus", "Catch one upsetting judgement today and question it."],
["Stoicism", "Prepare for difficult people", "Marcus began his day reminding himself he would meet meddling, ungrateful and arrogant people — and that none could harm him, since they couldn't make him act badly.", "Meditations 2.1", "Marcus Aurelius", "Each morning this week, mentally prepare for one difficult interaction."],
["Stoicism", "Memento mori", "Marcus reminded himself: 'You could leave life right now. Let that determine what you do and say and think.' Remembering death sharpens priorities.", "Meditations 2.11", "Marcus Aurelius", "Ask: if this were my last week, what would I stop doing?"],
["Stoicism", "Do your job", "Marcus urged himself out of bed: 'At dawn, when you have trouble getting out of bed, tell yourself: I have to go to work — as a human being.'", "Meditations 5.1", "Marcus Aurelius", "Get up at the first alarm tomorrow."],
["Stoicism", "The view from above", "Marcus practised imagining the world from high above — crowds, armies, farms, births and deaths — to shrink petty concerns to their proper size.", "Meditations 9.30", "Marcus Aurelius", "Visualise your situation from space for one minute."],
["Stoicism", "Waste no more time", "'Waste no more time arguing about what a good man should be. Be one,' Marcus wrote.", "Meditations 10.16", "Marcus Aurelius", "Do one good deed instead of talking about one."],
["Stoicism", "On the shortness of life", "Seneca argued life isn't short; we waste much of it. 'Life is long if you know how to use it.' We guard money but squander time.", "On the Shortness of Life", "Seneca", "Track where your time goes for one day."],
["Stoicism", "Practise poverty", "Seneca advised setting aside days to live on the cheapest food and roughest clothes, asking 'Is this what I feared?' Rehearsing hardship reduces fear of it.", "Letters to Lucilius 18", "Seneca", "Spend one day this week on simple food and no spending."],
["Stoicism", "Negative visualisation", "The Stoics practised premeditatio malorum — imagining losses in advance. It reduces shock and deepens gratitude for what we have now.", "Letters to Lucilius 91", "Seneca", "Imagine briefly losing something you love, then appreciate it."],
["Stoicism", "Read deeply, not widely", "Seneca warned that reading many authors at random leaves you restless: 'Everywhere means nowhere.' Dwell with a few great minds.", "Letters to Lucilius 2", "Seneca", "Re-read one great book instead of starting three new ones."],
["Stoicism", "Associate with the better", "Seneca advised: 'Associate with those who will make a better man of you. Welcome those whom you yourself can improve.'", "Letters to Lucilius 7", "Seneca", "Spend time this week with someone who brings out your best."],
["Stoicism", "Anger is brief madness", "Seneca called anger a short madness and advised delay as its greatest remedy: wait before acting on it.", "On Anger", "Seneca", "When angry today, wait ten minutes before replying."],
["Stoicism", "Evening review", "Seneca described examining each day before sleep: 'What bad habit did I cure today? What fault did I resist? In what respect am I better?'", "On Anger 3.36", "Seneca", "Do a three-question evening review tonight."],
["Stoicism", "Wealth is wanting less", "Epicurus — and Seneca quoting him — taught that if you want to make someone rich, don't add to their money but subtract from their desires.", "Letters to Lucilius 21", "Seneca (quoting Epicurus)", "Unsubscribe from one shopping temptation."],
["Stoicism", "Two ears, one mouth", "Zeno of Citium, founder of Stoicism, is reported to have said we have two ears and one mouth so we may listen more and speak less.", "Lives of the Eminent Philosophers 7.23", "Diogenes Laërtius (on Zeno)", "Speak less and listen more in your next conversation."],
["Stoicism", "The four virtues", "The Stoics held four cardinal virtues: wisdom, courage, justice and temperance. Everything else — wealth, health, fame — is 'indifferent', though some are preferred.", "Stoic ethics", "Zeno, Chrysippus & successors", "Score yourself on each virtue from 1–10 this week."],
["Stoicism", "Live by nature", "Zeno taught the goal of life is living in agreement with nature — for humans, that means living by reason and in community.", "Stoic ethics", "Zeno of Citium", "Do one thing today that serves your community."],
["Stoicism", "Musonius on practice", "Musonius Rufus, Epictetus' teacher, insisted philosophy must be practised, not just studied — like medicine or music.", "Lectures", "Musonius Rufus", "Practise one Stoic idea from this list today, not just read it."],
["Stoicism", "Freedom is mastery of self", "Epictetus, once enslaved, taught that 'No man is free who is not master of himself.'", "Fragments (preserved by Stobaeus)", "Epictetus (attributed)", "Resist one impulse today and notice the freedom."],
["Stoicism", "It's not what happens", "'It's not what happens to you, but how you react to it that matters,' is a popular paraphrase of Epictetus' teaching in the Enchiridion.", "Enchiridion (paraphrase)", "Epictetus", "Reframe one bad event in a constructive way."],
["Stoicism", "The inner citadel", "Pierre Hadot described Marcus' Meditations as building an 'inner citadel' — a mind protected by right judgement that external events cannot breach.", "The Inner Citadel", "Pierre Hadot", "Write a short mantra to return to when stressed."],
["Stoicism", "Sympatheia", "Marcus wrote of all things being woven together: 'What is not good for the hive is not good for the bee.'", "Meditations 6.54", "Marcus Aurelius", "Make one choice today for the good of your 'hive'."],
["Stoicism", "Begin at once to live", "Seneca wrote: 'Begin at once to live, and count each separate day as a separate life.'", "Letters to Lucilius 101", "Seneca", "Treat today as a complete life: start well, live well, end well."],
["Bible Books", "Genesis: beginnings", "Genesis opens 'In the beginning God created the heaven and the earth' (1:1) and tells of creation, the fall, the flood and the patriarchs Abraham, Isaac, Jacob and Joseph. Its theme: God's purposes persist through human failure.", "Genesis 1:1; 50:20", "The Bible", "Read Genesis 50:15–21 and reflect on how Joseph saw God at work in his suffering."],
["Bible Books", "Exodus: freedom and covenant", "Exodus tells how God rescued Israel from slavery in Egypt through Moses, gave the Ten Commandments at Sinai (ch. 20) and dwelt among his people in the tabernacle.", "Exodus 20", "The Bible", "Read the Ten Commandments slowly and pick one to practise this week."],
["Bible Books", "Leviticus: holiness", "Leviticus teaches how a holy God can live among an imperfect people, through sacrifices and laws. It also contains 'thou shalt love thy neighbour as thyself' (19:18).", "Leviticus 19:18", "The Bible", "Do one practical act of neighbour-love today."],
["Bible Books", "Deuteronomy: remember", "Moses' farewell speeches urge Israel to remember God's faithfulness. The Shema (6:4–5) calls them to love the LORD 'with all thine heart, and with all thy soul, and with all thy might'.", "Deuteronomy 6:4–9", "The Bible", "Write one thing God or life has taught you and put it where you'll see it daily."],
["Bible Books", "Joshua: be strong", "As Joshua leads Israel into Canaan, God tells him: 'Be strong and of a good courage; be not afraid… for the LORD thy God is with thee whithersoever thou goest' (1:9).", "Joshua 1:9", "The Bible", "Memorise Joshua 1:9 for a daunting task this week."],
["Bible Books", "Ruth: loyal love", "Ruth, a Moabite widow, refuses to abandon her mother-in-law Naomi: 'whither thou goest, I will go' (1:16). Her faithfulness leads to Boaz and makes her an ancestor of King David.", "Ruth 1:16", "The Bible", "Show steadfast loyalty to a family member going through a hard season."],
["Bible Books", "1 Samuel: the heart", "When Samuel looks for Israel's next king, God says: 'man looketh on the outward appearance, but the LORD looketh on the heart' (16:7). Young shepherd David is chosen.", "1 Samuel 16:7", "The Bible", "Notice where you judge someone by appearance today."],
["Bible Books", "Nehemiah: rebuild", "Nehemiah prays, plans and leads the rebuilding of Jerusalem's walls in 52 days despite opposition, with workers holding a tool in one hand and a weapon in the other (4:17).", "Nehemiah 2–6", "The Bible", "Pray, then plan, one rebuilding project in your life."],
["Bible Books", "Esther: for such a time", "Esther, a Jewish queen in Persia, risks her life to save her people. Mordecai asks, 'who knoweth whether thou art come to the kingdom for such a time as this?' (4:14).", "Esther 4:14", "The Bible", "Ask where you're placed right now to make a difference."],
["Bible Books", "Job: faith in suffering", "Job loses everything yet wrestles honestly with God. His friends' neat explanations prove wrong; God answers from the whirlwind with the wonders of creation (ch. 38–41).", "Job 38–42", "The Bible", "Sit with someone who's suffering without trying to explain it."],
["Bible Books", "Psalms: honest prayer", "The 150 Psalms are Israel's prayer book — praise, lament, thanks and confession. 'The LORD is my shepherd; I shall not want' (23:1) is the best-known.", "Psalm 23", "The Bible", "Pray one psalm aloud today, honestly, in your own situation."],
["Bible Books", "Proverbs: wisdom for life", "Proverbs offers short sayings on work, words, money and relationships. 'The fear of the LORD is the beginning of knowledge' (1:7).", "Proverbs 1:7", "The Bible", "Read the chapter of Proverbs matching today's date."],
["Bible Books", "Ecclesiastes: a season", "The Preacher finds life 'under the sun' fleeting, yet urges enjoying simple gifts and fearing God. 'To every thing there is a season' (3:1).", "Ecclesiastes 3:1–8", "The Bible", "Name the season you're in and what it asks of you."],
["Bible Books", "Isaiah: comfort and hope", "Isaiah warns of judgement but promises a coming servant and renewal: 'they that wait upon the LORD shall renew their strength; they shall mount up with wings as eagles' (40:31).", "Isaiah 40:31", "The Bible", "Rest and wait instead of striving in one area today."],
["Bible Books", "Jeremiah: a future and hope", "To exiles in Babylon, Jeremiah writes that God's thoughts toward them are 'thoughts of peace, and not of evil, to give you an expected end' (29:11), urging them to seek the city's peace (29:7).", "Jeremiah 29:7–11", "The Bible", "Pray for and do good to the place where you live."],
["Bible Books", "Daniel: faithful under pressure", "Daniel and his friends stay faithful in Babylon — refusing the king's food, surviving the fiery furnace and the lions' den — while serving foreign kings with excellence.", "Daniel 1; 3; 6", "The Bible", "Keep one quiet commitment today even when no one notices."],
["Bible Books", "Jonah: God's wide mercy", "Jonah runs from God's call to Nineveh, is swallowed by a great fish, then sulks when God spares the city. The book ends with God asking whether he shouldn't have pity on Nineveh (4:11).", "Jonah 4", "The Bible", "Pray for someone you find hard to love."],
["Bible Books", "Micah: what is required", "'He hath shewed thee, O man, what is good; and what doth the LORD require of thee, but to do justly, and to love mercy, and to walk humbly with thy God?' (6:8).", "Micah 6:8", "The Bible", "Do one just, one merciful and one humble thing today."],
["Bible Books", "Matthew: the King's teaching", "Matthew presents Jesus as the promised Messiah and teacher, with five major discourses including the Sermon on the Mount, ending with the Great Commission (28:19–20).", "Matthew 5–7; 28", "The Bible", "Read Matthew 6:25–34 on worry."],
["Bible Books", "Mark: the servant in action", "Mark is the shortest, fastest-paced Gospel ('immediately' recurs often). Its centre: 'the Son of man came not to be ministered unto, but to minister, and to give his life a ransom for many' (10:45).", "Mark 10:45", "The Bible", "Serve someone today in a way that costs you something."],
["Bible Books", "Luke: good news for outsiders", "Luke highlights Jesus' care for the poor, women, Samaritans and sinners, with parables found only here — the Good Samaritan (10) and the Prodigal Son (15).", "Luke 10; 15", "The Bible", "Read the Prodigal Son and identify with each character."],
["Bible Books", "John: that ye might believe", "John's Gospel is written 'that ye might believe that Jesus is the Christ, the Son of God' (20:31). It records seven 'I am' sayings, such as 'I am the light of the world' (8:12).", "John 20:31", "The Bible", "Read John 1:1–14 slowly."],
["Bible Books", "Acts: the church spreads", "Acts tells how the Spirit empowered the apostles at Pentecost and the good news spread 'unto the uttermost part of the earth' (1:8), from Jerusalem to Rome.", "Acts 1:8; 2", "The Bible", "Share one thing you're grateful for in your faith with a friend."],
["Bible Books", "Romans: grace", "Paul's fullest letter explains that all have sinned and are justified freely by grace through faith (3:23–24), and that nothing can separate us from God's love (8:38–39).", "Romans 8:38–39", "The Bible", "Read Romans 8:28–39 aloud."],
["Bible Books", "1 Corinthians: love is patient", "Paul's letter to a divided church includes the famous chapter on love: 'Charity suffereth long, and is kind… beareth all things, believeth all things, hopeth all things' (13:4–7).", "1 Corinthians 13", "The Bible", "Replace 'love' with your name in 13:4–7 and see where you fall short."],
["Bible Books", "Galatians: fruit of the Spirit", "Paul defends freedom in Christ and lists the fruit of the Spirit: 'love, joy, peace, longsuffering, gentleness, goodness, faith, meekness, temperance' (5:22–23).", "Galatians 5:22–23", "The Bible", "Choose one fruit to focus on this week."],
["Bible Books", "Ephesians: saved by grace", "'For by grace are ye saved through faith; and that not of yourselves: it is the gift of God: not of works, lest any man should boast' (2:8–9). Paul also describes the armour of God (6:10–18).", "Ephesians 2:8–10", "The Bible", "Thank God for one undeserved gift."],
["Bible Books", "Philippians: joy in all things", "Written from prison, Philippians overflows with joy: 'Rejoice in the Lord alway' (4:4) and 'I can do all things through Christ which strengtheneth me' (4:13), said in the context of contentment.", "Philippians 4:4–13", "The Bible", "Practise contentment: list five things you already have."],
["Bible Books", "Hebrews: run the race", "Hebrews 11 lists heroes of faith; chapter 12 urges us to 'run with patience the race that is set before us, looking unto Jesus' (12:1–2).", "Hebrews 11–12", "The Bible", "Read Hebrews 11 and pick one hero of faith to learn from."],
["Bible Books", "James: faith that works", "James insists genuine faith shows in action: 'be ye doers of the word, and not hearers only' (1:22), and warns about the power of the tongue (ch. 3).", "James 1:22; 3", "The Bible", "Turn one thing you've learned this week into action today."],
["Bible Books", "1 John: God is love", "John writes simply and deeply: 'God is love; and he that dwelleth in love dwelleth in God' (4:16). Love for God shows in love for one another.", "1 John 4:7–21", "The Bible", "Show practical love to a fellow believer today."],
["Bible Books", "Revelation: all things new", "Revelation's visions encourage persecuted churches that Christ reigns. It ends with a new heaven and earth where God 'shall wipe away all tears from their eyes' (21:4).", "Revelation 21:1–5", "The Bible", "Read Revelation 21:1–5 and let hope shape how you face a hard thing."],
["Stoicism", "Embody it, don't explain it", "Epictetus advised never to call yourself a philosopher or lecture others on principles; instead, act on them. At a banquet, don't say how one should eat — eat as one should.", "Enchiridion 46", "Epictetus", "Practise one principle today without mentioning it to anyone."],
["Stoicism", "The retreat within", "Marcus wrote that people seek retreats in the country or by the sea, yet 'nowhere can man find a quieter or more untroubled retreat than in his own soul'. Brief inner retreats renew us.", "Meditations 4.3", "Marcus Aurelius", "Take a two-minute inner retreat: close your eyes and breathe slowly."],
["Stoicism", "Hold every hour", "Seneca's first letter urges Lucilius to 'hold every hour in your grasp'. While we postpone, life speeds by; nothing is truly ours except time.", "Letters to Lucilius 1", "Seneca", "Do the task you've been postponing in the next hour."]
];
