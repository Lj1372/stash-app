<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Stash">
<meta name="description" content="Bite-sized key ideas from books. Save, review, grow.">
<title>Stash — Daily Ideas</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180">
<style>
:root{--bg:#0f1115;--bg2:#161922;--card:#1d212c;--card2:#252a37;--line:#2c3240;--tx:#eef0f4;--tx2:#a3a9b8;--tx3:#6d7486;--acc:#f5b942;--acc2:#ffd27a;--ok:#4cc38a;--bad:#ef6a6a;--r:20px;
--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Helvetica,Arial,sans-serif;overscroll-behavior:none}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:calc(12px + var(--safe-t)) 16px 10px;background:linear-gradient(var(--bg) 70%,transparent)}
header h1{font-size:22px;margin:0;font-weight:800;letter-spacing:-.02em;flex:1}
header h1 span{color:var(--acc)}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:6px 12px;border-radius:999px;background:var(--card);font-size:14px;font-weight:600;color:var(--tx2)}
.pill b{color:var(--tx)}
main{flex:1;padding:0 16px calc(96px + var(--safe-b))}
.view{display:none;animation:fade .25s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:10;display:flex;justify-content:center;background:rgba(15,17,21,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
nav.tabs .in{display:flex;width:100%;max-width:560px}
nav.tabs button{flex:1;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;color:var(--tx3);position:relative}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--acc)}
.dot{position:absolute;top:10px;right:calc(50% - 18px);width:8px;height:8px;border-radius:50%;background:var(--bad);display:none}
.dot.show{display:block}
svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* feed */
.feedtop{display:flex;align-items:center;justify-content:space-between;margin:4px 0 12px}
.feedtop h2{margin:0;font-size:15px;color:var(--tx2);font-weight:600}
.progress{display:flex;gap:6px}
.progress i{width:28px;height:5px;border-radius:3px;background:var(--line);transition:background .3s}
.progress i.done{background:var(--acc)}
.stage{position:relative;height:min(62vh,520px);min-height:380px;touch-action:pan-y;user-select:none}
.icard{position:absolute;inset:0;background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--r);padding:22px 22px 18px;display:flex;flex-direction:column;box-shadow:0 18px 40px rgba(0,0,0,.35);transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .35s;will-change:transform}
.icard.back{transform:scale(.94) translateY(16px);opacity:.5;pointer-events:none}
.icard.gone-l{transform:translateX(-120%) rotate(-12deg);opacity:0}
.icard.gone-r{transform:translateX(120%) rotate(12deg);opacity:0}
.icard.drag{transition:none}
.tag{align-self:flex-start;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:5px 10px;border-radius:999px;background:rgba(245,185,66,.14);color:var(--acc)}
.icard h3{font-size:25px;line-height:1.2;margin:16px 0 12px;letter-spacing:-.02em}
.icard .txt{font-size:17px;color:#d5d9e2;flex:1;overflow:auto}
.src{display:flex;align-items:center;gap:10px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line);font-size:14px;color:var(--tx2)}
.src .bk{width:34px;height:44px;border-radius:5px;background:var(--acc);flex:none;display:grid;place-items:center;color:#0f1115;font-weight:800;font-size:15px}
.src b{color:var(--tx);display:block;font-weight:600}
.actions{display:flex;gap:10px;justify-content:center;margin-top:16px}
.btn{min-height:48px;min-width:48px;padding:0 18px;border-radius:14px;background:var(--card);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;transition:transform .12s,background .2s}
.btn:active{transform:scale(.95)}
.btn svg{width:22px;height:22px}
.btn.primary{background:var(--acc);color:#14161b;border-color:var(--acc)}
.btn.on{color:var(--acc);border-color:var(--acc)}
.btn.fav.on{color:#ff7a90;border-color:#ff7a90}
.btn.fav.on svg{fill:#ff7a90}
.btn.saved.on svg{fill:var(--acc)}
.btn.sm{min-height:44px;padding:0 14px;font-size:14px}
.btn.wide{width:100%}
.btn.ghost{background:transparent}
.done-card{text-align:center;justify-content:center;align-items:center}
.done-card .big{font-size:56px;margin-bottom:6px}
.hint{text-align:center;color:var(--tx3);font-size:13px;margin-top:10px}
/* lists */
.search{display:flex;gap:8px;margin:4px 0 10px}
.search input{flex:1;min-height:48px;border-radius:14px;border:1px solid var(--line);background:var(--card);padding:0 14px;outline:none}
.search input:focus,.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--acc)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:40px;padding:0 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:14px;font-weight:600;color:var(--tx2);white-space:nowrap}
.chip.on{background:var(--acc);color:#14161b;border-color:var(--acc)}
.list{display:flex;flex-direction:column;gap:10px}
.row{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 14px 10px}
.row .top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.row .top .tag{font-size:11px;padding:3px 8px}
.row .top .rd{font-size:12px;color:var(--tx3);margin-left:auto}
.row h4{margin:0 0 4px;font-size:17px;line-height:1.3}
.row p{margin:0;color:var(--tx2);font-size:15px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.row.open p{-webkit-line-clamp:unset}
.row .meta{font-size:13px;color:var(--tx3);margin-top:6px}
.row .ra{display:flex;gap:4px;justify-content:flex-end;margin-top:4px}
.row .ra .btn{min-height:44px;min-width:44px;padding:0 10px;background:transparent;border-color:transparent}
.row .hl{color:var(--acc2)}
.empty{text-align:center;color:var(--tx3);padding:40px 20px}
.sec{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--tx3);margin:18px 0 10px}
/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:6px 0 14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 10px;text-align:center}
.stat b{display:block;font-size:26px;font-weight:800;color:var(--acc)}
.stat span{font-size:12px;color:var(--tx2)}
.week{display:flex;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:14px}
.week div{text-align:center;font-size:11px;color:var(--tx3)}
.week i{display:block;width:28px;height:28px;border-radius:50%;margin:4px auto 0;background:var(--bg2);border:1px solid var(--line)}
.week i.y{background:var(--acc);border-color:var(--acc)}
.menu{display:flex;flex-direction:column;gap:10px}
.menu .btn{justify-content:flex-start;min-height:54px}
/* review */
.flip{perspective:1200px;height:min(54vh,440px);min-height:340px;margin-top:6px}
.flip .inner{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d;cursor:pointer}
.flip.rev .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--r);border:1px solid var(--line);background:linear-gradient(160deg,var(--card2),var(--card));padding:22px;display:flex;flex-direction:column}
.face.f{justify-content:center;align-items:center;text-align:center}
.face.f h3{font-size:26px;margin:16px 0}
.face.b{transform:rotateY(180deg)}
.face.b .txt{flex:1;overflow:auto;font-size:17px;color:#d5d9e2;margin-top:12px}
.revbar{display:flex;gap:10px;margin-top:14px}
.revbar .btn{flex:1}
.btn.again{color:var(--bad);border-color:rgba(239,106,106,.4)}
.btn.got{color:var(--ok);border-color:rgba(76,195,138,.4)}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:560px;margin:0 auto;background:var(--bg2);border-radius:24px 24px 0 0;border:1px solid var(--line);padding:10px 18px calc(20px + var(--safe-b));transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);max-height:88vh;overflow:auto}
.sheet.on{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sheet h3{margin:0 0 14px;font-size:20px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-size:13px;font-weight:600;color:var(--tx2)}
.field input,.field textarea,.field select{min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:10px 12px;outline:none}
.field textarea{min-height:120px;resize:vertical}
.check{display:flex;align-items:center;gap:12px;min-height:52px;padding:0 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);margin-bottom:8px;width:100%;text-align:left;font-weight:600}
.check .bx{width:24px;height:24px;border-radius:7px;border:2px solid var(--tx3);display:grid;place-items:center;flex:none}
.check.on .bx{background:var(--acc);border-color:var(--acc)}
.check.on .bx:after{content:"";width:6px;height:11px;border:solid #14161b;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.check .ct{margin-left:auto;color:var(--tx3);font-size:13px}
.inl{display:flex;gap:8px;margin:6px 0 14px}
.inl input{flex:1;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:0 12px;outline:none}
.toast{position:fixed;left:50%;top:calc(64px + var(--safe-t));transform:translate(-50%,-20px);background:var(--tx);color:#14161b;padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:30;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* v2 */
.stage{height:clamp(420px,calc(100dvh - 285px),600px);min-height:0}
.icard .txt{font-size:16.5px}
.icard h3{font-size:24px;margin:14px 0 10px}
.act{display:flex;align-items:center;gap:10px;margin-top:12px;padding:8px 10px 8px 12px;border-radius:14px;background:rgba(76,195,138,.08);border:1px dashed rgba(76,195,138,.45);font-size:14.5px;line-height:1.35;color:#cfe9dc}
.act small{display:block;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ok);margin-bottom:2px}
.act .tk{flex:none;width:44px;height:44px;border-radius:12px;border:2px solid rgba(76,195,138,.6);display:grid;place-items:center;color:transparent;transition:.2s}
.act .tk svg{width:22px;height:22px;stroke-width:3}
.act.done{background:rgba(76,195,138,.18);border-style:solid}
.act.done .tk{background:var(--ok);border-color:var(--ok);color:#0f1115}
.act.done span.at{text-decoration:line-through;opacity:.75}
.row .act{margin-top:8px;font-size:13.5px;padding:4px 6px 4px 10px}
.stats{grid-template-columns:repeat(2,1fr)}
.stat b{font-size:28px}
.dot{width:auto;min-width:18px;height:18px;padding:0 5px;top:6px;right:calc(50% - 24px);font-size:11px;line-height:18px;color:#fff;font-style:normal;font-weight:700;border-radius:9px}
.boxes{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:14px 0 4px}
.boxes div{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:8px 2px;text-align:center;font-size:11px;color:var(--tx3)}
.boxes b{display:block;font-size:18px;color:var(--tx)}
.duebig{font-size:54px;font-weight:800;color:var(--acc);line-height:1;margin-top:6px}
.preview{max-width:100%;max-height:52vh;margin-left:auto;margin-right:auto;border-radius:16px;border:1px solid var(--line);display:block;margin-bottom:14px;background:var(--card)}
.btnrow{display:flex;gap:10px}
.btnrow .btn{flex:1}
.boxtag{font-size:11px;color:var(--tx3);margin-left:auto}
/* ===== v3 ===== */
html{background:#0b0d12}
body{background:transparent}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:40;pointer-events:none}
.app{position:relative;z-index:1}
header{background:linear-gradient(rgba(11,13,18,.88) 60%,transparent)}
header .pill{background:rgba(29,33,44,.8);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.hbtn{width:44px;height:44px;border-radius:50%;background:rgba(29,33,44,.8);display:grid;place-items:center;flex:none;position:relative}
.hbtn svg{width:22px;height:22px}
.hbtn.on{color:var(--acc);box-shadow:0 0 0 2px var(--acc) inset}
#hLvl{position:relative}
.xpf{position:absolute;left:50%;top:100%;color:var(--acc);font-weight:800;font-size:13px;animation:xpf 1.1s ease-out forwards;white-space:nowrap;pointer-events:none}
@keyframes xpf{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-30px)}}
.icard{background:linear-gradient(160deg,rgba(40,45,60,.80),rgba(22,25,34,.90));backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-color:rgba(255,255,255,.09)}
.icard.front{transform:perspective(1000px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg))}
.icard .tag{color:var(--g1,var(--acc));background:rgba(255,255,255,.07)}
.icard h3{margin-top:22px;padding-right:44px}
.glyph{position:absolute;top:16px;right:16px;width:60px;height:60px;border-radius:20px;display:grid;place-items:center;font-size:32px;background:linear-gradient(135deg,var(--g1),var(--g2));box-shadow:0 10px 26px -8px var(--g1);animation:bob 4.5s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(5deg)}}
.icard .bk{background:linear-gradient(135deg,var(--g1),var(--g2))}
.stamp{position:absolute;top:30px;padding:4px 14px;border:3px solid currentColor;border-radius:10px;font-weight:900;font-size:26px;letter-spacing:.08em;opacity:0;pointer-events:none;z-index:3;background:rgba(11,13,18,.5)}
.st-save{left:22px;color:var(--ok);transform:rotate(-14deg)}
.st-skip{right:22px;color:var(--bad);transform:rotate(14deg)}
.st-fav{left:50%;top:42%;transform:translateX(-50%);color:#ff7a90;font-size:30px}
.row,.stat,.week,.face,.empty-card{background:rgba(29,33,44,.80);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.face{background:linear-gradient(160deg,rgba(40,45,60,.86),rgba(22,25,34,.92))}
.btn{background:rgba(29,33,44,.85)}
.btn.primary{background:var(--acc)}
.btn.ghost{background:transparent}
nav.tabs button{font-size:10.5px}
.rowe{font-size:13px;margin-right:2px}
input[type=range]{accent-color:var(--acc);width:100%;min-height:44px;background:transparent}
/* mini player */
.mini{position:fixed;left:0;right:0;bottom:calc(61px + var(--safe-b));z-index:9;display:none;justify-content:center;padding:0 10px 8px;pointer-events:none}
.mini.on{display:flex}
.mini .in{pointer-events:auto;max-width:540px;width:100%;display:flex;align-items:center;gap:8px;background:rgba(22,25,34,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:18px;padding:4px 6px 4px 12px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.mini .mt{font-size:13px;font-weight:700;white-space:nowrap;min-height:44px;display:flex;align-items:center;gap:8px}
.mini input{flex:1;min-width:60px}
.mini .btn{min-height:44px;min-width:44px;padding:0 8px;border:0;background:transparent}
body.has-mini main{padding-bottom:calc(150px + var(--safe-b))}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:16px;width:18px}
.eq i{flex:1;background:var(--acc);border-radius:2px;height:30%;animation:eq .9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:-.3s}.eq i:nth-child(3){animation-delay:-.6s}
.eq.off i{animation:none;height:30%}
@keyframes eq{50%{height:100%}}
/* moods */
.moods{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.mood{min-height:100px;border-radius:16px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:700;padding:6px}
.mood span{font-size:30px}
.mood small{font-size:11px;color:var(--tx3);font-weight:500;text-align:center;line-height:1.2}
.mood.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset;background:rgba(245,185,66,.08)}
/* tools */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.tile{min-height:156px;border-radius:22px;padding:16px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(150deg,var(--g1),var(--g2));color:#10121a;font-weight:800;font-size:18px;box-shadow:0 14px 30px -14px var(--g1);transition:transform .15s}
.tile:active{transform:scale(.97)}
.tile .te{font-size:42px;line-height:1}
.tile small{display:block;font-weight:600;font-size:13px;opacity:.78;margin-top:2px}
.toolhead{display:flex;align-items:center;gap:8px;margin:2px 0 8px}
.toolhead h2{margin:0;font-size:20px;flex:1}
.panel{background:rgba(29,33,44,.80);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:20px;padding:18px}
.ring{position:relative;width:250px;height:250px;margin:6px auto 10px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .tm{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .tm b{font-size:54px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.ring .tm span{font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--tx2)}
.ring.run{animation:pulse 4s ease-in-out infinite}
@keyframes pulse{50%{filter:drop-shadow(0 0 18px rgba(245,185,66,.5))}}
.ringfg{transition:stroke-dashoffset .5s linear}
.chiprow{display:flex;gap:8px;justify-content:center;margin:8px 0 14px;flex-wrap:wrap}
.breakidea{margin-top:16px;border-radius:18px;padding:16px;border:1px dashed rgba(94,230,168,.5);background:rgba(94,230,168,.07)}
.breakidea h4{margin:6px 0;font-size:18px}
.breakidea p{margin:0;color:#d5d9e2;font-size:15px}
/* quiz */
.qprog{display:flex;gap:6px;margin-bottom:12px}.qprog i{flex:1;height:6px;border-radius:3px;background:var(--line)}.qprog i.ok{background:var(--ok)}.qprog i.bad{background:var(--bad)}.qprog i.cur{background:var(--acc)}
.qtext{font-size:19px;font-weight:700;line-height:1.35;margin:0 0 10px}
.qquote{margin:0 0 14px;padding:12px 14px;border-left:3px solid var(--acc);background:rgba(255,255,255,.04);border-radius:0 12px 12px 0;color:#d5d9e2;font-size:15px}

        <button class="btn" id="importBtn"><svg viewBox="0 0 24 24"><path d="M12 21V9M7 14l5-5 5 5M5 3h14"/></svg>Import backup (merge or replace)</button>
        <input type="file" id="importFile" accept="application/json,.json" class="sr">
        <button class="btn ghost" id="resetBtn" style="color:var(--bad)"><svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 15h10l1-15"/></svg>Reset all data</button>
      </div>
      <div class="sec">My ideas</div>
      <div class="list" id="myList"></div>
      <p class="hint" style="margin-top:24px">Library: <span id="libCount"></span> ideas. Seed ideas are paraphrased summaries of the named sources, not direct quotations.</p>

<script>
'use strict';
/* Seed library: [topic, title, idea (paraphrased), source, author, do-one-thing action] */
const TOPICS=['Productivity','Mindset','Leadership','Communication','Money','Health','Faith & Wisdom','Learning','Stoicism','Philosophy','Psychology','Relationships','Science','History','Creativity','Business & Sales','Bible Books'];
const SEED_RAW=[
["Productivity", "Get 1% better every day", "Small improvements look trivial on any single day, but they compound. Getting slightly better each day adds up to a dramatic difference over a year, while small declines compound just as surely in the other direction.", "Atomic Habits", "James Clear", "Pick one habit and make it just 1% better today — two extra minutes or one extra rep.", "Doing a tiny bit better each day adds up to a lot! Like saving one coin a day — soon you have a big pile.", "The claim is about compounding: small per-period gains multiply rather than add (1.01^365 ≈ 37.8, while 0.99^365 ≈ 0.03). Clear uses the arithmetic as a metaphor — real skill growth plateaus — but the core point holds: trajectory matters more than any single day's result."],
["Productivity", "Build identity, not just outcomes", "The most durable habits are identity-based. Rather than focusing only on goals (\"I want to run a marathon\"), decide who you want to become (\"I am a runner\") and let each small action be a vote for that identity.", "Atomic Habits", "James Clear", "Finish the sentence “I am the type of person who…” and do one small action that proves it.", "Instead of only wanting a prize, decide who you want to be — like “I am a helper” — and then do helpful things.", "Clear grounds habits in self-concept: behaviour that conflicts with identity rarely lasts. This echoes self-perception theory — we infer who we are partly from what we repeatedly do — so each small action functions as evidence that gradually revises identity."],
["Productivity", "The four laws of behavior change", "To build a good habit, make it obvious, attractive, easy and satisfying. To break a bad one, invert the laws: make it invisible, unattractive, difficult and unsatisfying.", "Atomic Habits", "James Clear", "Put the cue for a habit you want (book, shoes, water bottle) somewhere you can’t miss it tonight.", "To start a good habit, make it easy to see, fun, simple and rewarding.", "The four laws map onto Clear's cue–craving–response–reward loop, a popularised version of habit research in behavioural psychology. Each law is a design lever on one stage; inverting them gives a parallel framework for breaking habits by adding friction and removing cues."],
["Productivity", "Deep work is rare and valuable", "The ability to focus without distraction on cognitively demanding tasks is becoming more valuable just as it becomes more rare. Protect long, uninterrupted blocks for your most important work and treat shallow work as something to minimise.", "Deep Work", "Cal Newport", "Block 90 minutes for distraction-free work and put your phone in another room.", "When you think really hard about one thing without stopping, you can do amazing work.", "Newport distinguishes deep work (cognitively demanding, distraction-free) from shallow work (logistical, easily replicated). He links it to attention residue — switching tasks leaves part of attention on the previous task — arguing that focus is both an economic advantage and a trainable capacity."],
["Productivity", "Your mind is for having ideas, not holding them", "Every open loop you try to remember drains attention. Capture all commitments in a trusted external system, decide the very next physical action for each, and do anything that takes less than two minutes right away.", "Getting Things Done", "David Allen", "Do a 10-minute brain dump of every open loop, then do anything that takes under two minutes.", "Your brain is for thinking, not for remembering everything. Write things down so you don't forget!", "Allen's system externalises commitments into a trusted capture-and-review workflow. The rationale resembles the Zeigarnik effect: unfinished tasks stay mentally active and intrusive. Clarifying the concrete next action converts vague obligations into executable steps, reducing cognitive load."],
["Productivity", "Begin with the end in mind", "Before you act, picture the result you want — even imagine what you would want said about you at the end of your life. Clarity about the destination lets you judge whether each step is taking you there.", "The 7 Habits of Highly Effective People", "Stephen R. Covey", "Write one sentence describing how you want to be remembered.", "Before you start, picture how you want things to end — then you know which way to go.", "Covey's second habit applies backward design: define desired outcomes and values first, then derive plans. His funeral-eulogy exercise surfaces terminal values so that daily choices can be checked against them rather than against momentary pressures."],
["Productivity", "Important beats urgent", "Most people live in the urgent. Effective people spend more time on things that are important but not urgent — planning, relationships, prevention, growth — so fewer crises arise in the first place.", "The 7 Habits of Highly Effective People", "Stephen R. Covey", "Spend 30 minutes on one important-but-not-urgent task before you check messages.", "Some things feel like they must happen now, but the really important things matter most.", "Covey's time-management matrix (popularly linked to Eisenhower) crosses urgency with importance. Quadrant II — important, not urgent — is where prevention, planning and relationship-building live; investing there shrinks the crises that otherwise dominate Quadrant I."],
["Productivity", "If it is not a clear yes, it is a no", "Essentialism is the disciplined pursuit of less but better. When evaluating an opportunity, if you are not convinced it is an absolute yes, treat it as a no — this frees capacity for the few things that truly matter.", "Essentialism", "Greg McKeown", "Politely say no to one request that isn’t a clear yes.", "If you're not really excited about something, it's okay to say “no thanks”.", "McKeown applies a strict threshold to choices to counter the 'undisciplined pursuit of more'. The logic is opportunity cost: every yes consumes finite capacity. A high bar preserves resources for the vital few contributions with the greatest impact."],
["Productivity", "Eat that frog", "Identify your most important and usually most difficult task, and do it first thing. Finishing it early builds momentum and stops procrastination from eating your best hours.", "Eat That Frog!", "Brian Tracy", "Name tomorrow’s frog tonight, and do it before anything else in the morning.", "Do your hardest job first. Then the rest of the day feels easier!", "Tracy's advice prioritises the highest-value, most-avoided task early, when energy and willpower may be highest and before reactive work intrudes. It is a practical counter to procrastination, which tends to target exactly the aversive tasks that matter most."],
["Productivity", "Maker's schedule vs manager's schedule", "Managers work in one-hour slots, so a meeting costs them little. Makers — programmers, writers — need half-days of unbroken time, and a single meeting in the middle can wreck an entire afternoon. Cluster meetings to protect maker time.", "Maker's Schedule, Manager's Schedule (essay)", "Paul Graham", "Cluster meetings to free one uninterrupted half-day this week.", "People who make things need long quiet times. One interruption can stop their creative flow.", "Graham contrasts two temporal structures: the manager's hour-slotted day and the maker's half-day units. Because makers need long ramp-up time, a meeting's real cost is the fragmentation it causes, not its duration — an argument for batching meetings and protecting contiguous blocks."],
["Mindset", "Fixed vs growth mindset", "People with a fixed mindset believe ability is innate, so they avoid challenges that might expose limits. People with a growth mindset believe ability develops through effort and strategy, so they embrace challenges and learn from setbacks.", "Mindset", "Carol S. Dweck", "When you hit a setback today, add the word “yet”: “I can’t do this… yet.”", "Your brain can grow! When something is hard, keep trying and you'll get better.", "Dweck's research describes implicit theories of ability: entity (fixed) versus incremental (growth). Mindsets shape goal choice and responses to failure. Later replications show smaller effects than early studies, but the distinction remains a useful lens for how beliefs about ability affect effort."],
["Mindset", "The last of the human freedoms", "Even when everything else is taken away, a person retains the freedom to choose their attitude toward circumstances. Frankl saw this in the concentration camps: some prisoners still chose to comfort others and give away their last piece of bread.", "Man's Search for Meaning", "Viktor E. Frankl", "Before reacting to the next frustration, pause for three breaths and choose your response.", "Even when bad things happen, you can choose to be kind and brave inside.", "Frankl, a psychiatrist who survived Auschwitz, argued that inner freedom — the stance one takes toward circumstances — cannot be taken away. This underlies logotherapy, his approach centred on the 'will to meaning' rather than the pursuit of pleasure or power."],
["Mindset", "Three paths to meaning", "Meaning can be found by creating a work or doing a deed, by experiencing something or loving someone, and by the attitude we take toward unavoidable suffering. Those who have a \"why\" can bear almost any \"how\".", "Man's Search for Meaning", "Viktor E. Frankl", "Write down the “why” behind the hardest thing you’re facing right now.", "Life feels meaningful when we make things, love people, and stay brave when it's hard.", "Frankl identifies three sources of meaning: creative (work and deeds), experiential (love, beauty, truth) and attitudinal (the stance toward unavoidable suffering). The third is distinctive: meaning remains available even when action and experience are closed off."],
["Mindset", "Effort counts twice", "Talent times effort gives skill; skill times effort gives achievement. Because effort appears in both steps, sustained passion and perseverance — grit — often matter more than raw talent.", "Grit", "Angela Duckworth", "Spend 20 focused minutes practising the skill you most want to improve.", "Trying hard helps you get good at things, and then trying hard again helps you do great things.", "Duckworth's model — talent × effort = skill; skill × effort = achievement — makes effort count twice. Grit (sustained passion and perseverance for long-term goals) is her proposed predictor, though debate continues over how distinct grit is from conscientiousness."],
["Mindset", "The obstacle is the way", "Drawing on Stoic philosophy, every obstacle is also an opportunity to practise a virtue — patience, courage, creativity. Control your perceptions, act deliberately, and accept what you cannot change.", "The Obstacle Is the Way", "Ryan Holiday", "Write down one current obstacle and the virtue it lets you practise.", "When something gets in your way, you can learn something from it, like being patient or clever.", "Holiday adapts Stoic practice into three disciplines: perception (seeing events objectively), action (deliberate, persistent effort) and will (accepting what cannot be changed). The obstacle becomes material for virtue — a reframing with parallels in cognitive reappraisal."],
["Mindset", "Two systems of thinking", "System 1 is fast, intuitive and automatic; System 2 is slow, effortful and deliberate. Most errors in judgment come from System 1 jumping to conclusions while a lazy System 2 endorses them without checking.", "Thinking, Fast and Slow", "Daniel Kahneman", "Before one important decision today, list two reasons your first instinct could be wrong.", "Your brain has a fast way to think and a slow, careful way. Slow down for big choices!", "Kahneman's dual-process framework contrasts System 1 (automatic, associative) with System 2 (effortful, rule-based). Many heuristics and biases arise when System 1 substitutes an easier question for a hard one and System 2 fails to check it."],
["Mindset", "Losses loom larger than gains", "People feel the pain of a loss roughly twice as strongly as the pleasure of an equal gain. Loss aversion makes us overly cautious and makes \"what you could lose\" framing powerful — notice when it is steering your choices.", "Thinking, Fast and Slow", "Daniel Kahneman", "For one decision, ask: “Would I choose this if I were starting fresh, with nothing to lose?”", "Losing a toy feels worse than finding a new toy feels good.", "Loss aversion, central to prospect theory (Kahneman and Tversky, 1979), describes asymmetric weighting of losses versus gains relative to a reference point. It helps explain the endowment effect, status-quo bias and why framing outcomes as losses changes choices."],
["Leadership", "Start with why", "Inspiring leaders and organisations communicate from the inside out: why they do it, then how, then what. People do not buy what you do; they buy why you do it.", "Start With Why", "Simon Sinek", "Write your personal or team “why” in a single sentence.", "Tell people why you do something, not just what you do. The “why” makes them care.", "Sinek's Golden Circle orders communication from purpose (why) to process (how) to product (what). His neurological explanation is a simplification, but the communication insight — purpose builds belief and loyalty more than feature lists — is widely applied."],
["Leadership", "Extreme ownership", "Leaders own everything in their world — including failures they did not directly cause. There are no bad teams, only bad leaders; taking ownership instead of blaming is what lets a team improve.", "Extreme Ownership", "Jocko Willink & Leif Babin", "Own one recent mistake out loud — no excuses — and state what you’ll do differently.", "A good leader says “that's on me” instead of blaming others.", "Willink and Babin, former US Navy SEAL officers, argue leaders should own all outcomes in their domain. Ownership shifts attention from blame to controllable causes — communication, planning, training — and models accountability that spreads through a team."],
["Leadership", "The circle of safety", "When leaders make people feel safe from threats inside the group, people stop protecting themselves from each other and work together against outside challenges. Leaders earn trust by putting their people first.", "Leaders Eat Last", "Simon Sinek", "Ask a teammate what’s getting in their way, and remove one obstacle for them.", "When people feel safe on a team, they help each other instead of worrying.", "Sinek connects trust to the biology of social mammals and to organisational safety: when leaders protect people from internal threats, cooperation rises. It overlaps with research on psychological safety, which links speaking up and learning to team effectiveness."],
["Leadership", "Level 5 leadership", "The leaders of companies that went from good to great combined deep personal humility with intense professional will. They gave credit to others when things went well and took responsibility when they did not.", "Good to Great", "Jim Collins", "Give one person specific, public credit for their work today.", "The best leaders are humble but never give up.", "Collins's research team studied companies that moved from good to sustained great results and found leaders combining personal humility with fierce professional will. The 'window and mirror' pattern — credit outward, responsibility inward — is his signature observation, though the study's methods have drawn criticism."],
["Leadership", "First who, then what", "Great companies first got the right people on the bus, the wrong people off, and the right people in the right seats — and only then figured out where to drive it.", "Good to Great", "Jim Collins", "Thank one of the people you most rely on, and tell them why.", "Pick the right friends for the team first, then decide what game to play.", "Collins argues great companies prioritised people decisions before strategy: the right people adapt to changing direction and need less supervision. The insight reframes strategy as dependent on talent rather than the reverse."],
["Leadership", "Clear is kind", "Being vague to avoid discomfort is actually unkind — it leaves people guessing. Courageous leaders have honest, direct conversations and set clear expectations, because clarity respects people.", "Dare to Lead", "Brené Brown", "Have one conversation you’ve been avoiding — clearly and kindly.", "Saying things clearly is kind, because then people know what to do.", "Brown argues that vagueness — often motivated by wanting to be nice — creates confusion and resentment. Clear expectations and honest feedback are framed as respect, part of her broader account of courageous, vulnerable leadership."],
["Leadership", "Trust is the foundation of teams", "Team dysfunction starts with an absence of trust, which leads to fear of conflict, lack of commitment, avoidance of accountability and inattention to results. Leaders go first by being vulnerable.", "The Five Dysfunctions of a Team", "Patrick Lencioni", "Admit one mistake or weakness to your team.", "Teams work best when everyone trusts each other.", "Lencioni's fable presents a pyramid of five dysfunctions: absence of trust, fear of conflict, lack of commitment, avoidance of accountability, inattention to results. Vulnerability-based trust is the foundation that makes productive conflict and mutual accountability possible."],
["Communication", "Remember names", "A person's name is, to them, among the most important sounds in any language. Remembering and using it makes people feel valued; forgetting it signals they do not matter to you.", "How to Win Friends and Influence People", "Dale Carnegie", "Use the name of everyone you talk to today.", "Remember people's names — it makes them feel special.", "Carnegie observed that people are deeply attached to their own names. Using someone's name signals attention and regard; psychologists have documented that one's own name reliably captures attention (the 'cocktail party' effect)."],
["Communication", "Do not criticise, condemn or complain", "Criticism puts people on the defensive and wounds their pride. Instead of condemning, try to understand why people do what they do — it breeds sympathy, tolerance and kindness.", "How to Win Friends and Influence People", "Dale Carnegie", "Go one full day without criticising or complaining.", "Don't be grumpy or mean about others. Try to understand them.", "Carnegie's first principle: criticism provokes defensiveness and resentment rather than change. Seeking to understand others' motives aligns with later work on attribution — we tend to blame others' character while excusing our own behaviour by circumstances."],
["Communication", "Be genuinely interested in others", "You can make more friends in two months by becoming interested in other people than in two years trying to get them interested in you. Talk in terms of the other person's interests and encourage them to talk about themselves.", "How to Win Friends and Influence People", "Dale Carnegie", "Ask someone two follow-up questions about themselves — and just listen.", "Ask people about themselves and really listen. That's how to make friends.", "Carnegie argued interest in others builds relationships faster than self-promotion. Later research on question-asking finds that people who ask more follow-up questions in conversation tend to be better liked."],
["Communication", "Reciprocity", "People feel obliged to repay what they receive. Giving first — a favour, information, a concession — is one of the most powerful levers of influence, especially when the gift is personal and unexpected.", "Influence", "Robert B. Cialdini", "Do an unexpected favour for someone, with no strings attached.", "When someone is kind to us, we want to be kind back.", "Reciprocity is one of Cialdini's six principles of influence: a widely shared social norm obliges people to repay favours, gifts and concessions. It is powerful enough to be exploited, so recognising unsolicited 'gifts' helps resist manipulation."],
["Communication", "Social proof", "When uncertain, people look to what others like them are doing to decide what is correct. Showing that many similar people already act a certain way is a strong persuader.", "Influence", "Robert B. Cialdini", "Notice one choice you’re making only because “everyone else does it”.", "We often copy what other people do, especially when we're not sure.", "Social proof describes reliance on others' behaviour as evidence of correct action, strongest under uncertainty and similarity. It explains everything from laughter tracks to bystander effects, and why descriptive norms ('most guests reuse towels') shift behaviour."],
["Communication", "Mirroring", "Repeating the last few words someone said, with a curious tone, invites them to elaborate and builds rapport. It is a simple way to keep people talking and reveal information without confrontation.", "Never Split the Difference", "Chris Voss", "In your next conversation, mirror the last few words someone says, with a curious tone.", "Repeat the last few words someone says, and they'll tell you more.", "Voss, a former FBI hostage negotiator, describes mirroring as a low-risk technique that signals attention and prompts elaboration. It resembles reflective listening from counselling practice and builds rapport through perceived similarity."],
["Communication", "Label emotions", "Naming the other side's feelings — \"It seems like you're frustrated with the timeline\" — defuses negative emotions and shows you understand. Tactical empathy aims for them to say \"That's right.\"", "Never Split the Difference", "Chris Voss", "Label one emotion you notice in someone: “It sounds like you’re…”", "Say out loud how someone feels, like “You seem upset.” It helps them calm down.", "Labelling names the other party's emotions without judgement. It parallels affect-labelling research, in which putting feelings into words can dampen emotional reactivity, and aims to elicit agreement ('That's right') that signals genuine understanding."],
["Communication", "Make it safe", "When conversations turn crucial — high stakes, opposing opinions, strong emotions — people go to silence or violence. Step out of the content and restore safety by reaffirming mutual purpose and mutual respect.", "Crucial Conversations", "Kerry Patterson, Joseph Grenny, Ron McMillan & Al Switzler", "Before a tough conversation, write down the purpose you both share.", "When talks get tough, help everyone feel safe and respected first.", "Patterson and colleagues argue that people move to silence or aggression when they feel unsafe. Restoring mutual purpose and mutual respect returns the conversation to the 'pool of shared meaning' where better decisions are made."],
["Communication", "The curse of knowledge", "Once we know something, it is hard to imagine not knowing it, so experts communicate abstractly. Sticky ideas are simple, unexpected, concrete, credible, emotional and told as stories.", "Made to Stick", "Chip Heath & Dan Heath", "Explain one idea today with a concrete example or a short story.", "Once you know something, it's hard to remember not knowing it. Use stories to explain!", "The curse of knowledge — illustrated by Elizabeth Newton's 'tappers and listeners' study, which the Heaths cite — makes experts overestimate how clear they are. Their SUCCESs framework (simple, unexpected, concrete, credible, emotional, stories) counters it."],
["Communication", "Observations, feelings, needs, requests", "Compassionate communication separates what you observe from your evaluation of it, expresses your feelings, names the needs behind them and makes a clear, doable request rather than a demand.", "Nonviolent Communication", "Marshall B. Rosenberg", "Turn one complaint into an observation, a feeling, a need and a clear request.", "Say what you saw, how you feel, what you need, and kindly ask for help.", "Rosenberg's model separates observation from evaluation, owns feelings, links them to universal needs and frames requests rather than demands. It draws on humanistic psychology, notably Carl Rogers, and aims to reduce blame in conflict."],
["Money", "Wealth is what you do not see", "Spending money to show people how much money you have is the fastest way to have less. Real wealth is the income not spent — the cars not bought and the savings that give you options and freedom.", "The Psychology of Money", "Morgan Housel", "Skip one purchase meant to impress, and move that money to savings.", "Saving money is like a secret treasure. Nobody sees it, but it keeps you safe.", "Housel distinguishes wealth (unspent, invisible assets) from visible consumption. Because others see only spending, social comparison pushes people toward consumption that erodes wealth — a behavioural point about money more than a technical one."],
["Money", "Time is the engine of compounding", "Most of Warren Buffett's fortune was accumulated after his 50s and 60s, because he started young and kept going for decades. The key to compounding is staying in the game long enough to let it work.", "The Psychology of Money", "Morgan Housel", "Use a compound-interest calculator to see what a small monthly investment becomes in 30 years.", "Money grows bigger the longer you leave it to grow.", "Compound growth depends heavily on duration: returns themselves earn returns, so outcomes are dominated by later years. Housel's Buffett example shows that time in the market, more than exceptional rates, drives outsized results."],
["Money", "Assets vs liabilities", "An asset puts money in your pocket; a liability takes money out. The rich focus on acquiring income-producing assets, while many people buy liabilities they think are assets.", "Rich Dad Poor Dad", "Robert T. Kiyosaki", "List what you own as assets (put money in) or liabilities (take money out).", "Some things you buy make you money, and some things cost you money.", "Kiyosaki defines assets by cash flow rather than accounting convention, so a home can count as a liability. Critics note his definitions are non-standard and his advice is often anecdotal, but the cash-flow lens is a useful heuristic."],
["Money", "Pay yourself first", "A part of all you earn is yours to keep. Set aside at least a tenth of every income before spending, then put that money to work so it multiplies.", "The Richest Man in Babylon", "George S. Clason", "Set up an automatic transfer of at least 10% of your income to savings on payday.", "Keep a little of every bit of money you get, before you spend the rest.", "Clason's parables, set in ancient Babylon, teach saving at least a tenth of income first. Modern behavioural finance supports the approach: automatic, default saving outperforms intentions that compete with spending."],
["Money", "Millionaires often look ordinary", "Research on American millionaires found that many live well below their means, drive modest cars and budget carefully. High income and a big house are not the same as wealth.", "The Millionaire Next Door", "Thomas J. Stanley & William D. Danko", "Review last month’s spending and cut one lifestyle cost you don’t truly value.", "Some rich people don't look fancy at all. They save instead of showing off.", "Stanley and Danko's surveys of American millionaires found many were frugal, self-employed or modest earners who accumulated through disciplined saving. The distinction between income and net worth is the book's core contribution."],
["Money", "The debt snowball", "List debts smallest to largest, pay minimums on all, and throw every extra dollar at the smallest. Each quick win builds momentum — personal finance is mostly behaviour, not maths.", "The Total Money Makeover", "Dave Ramsey", "List your debts from smallest to largest balance.", "Pay off the smallest debt first to get a quick win, then keep going.", "Ramsey's debt snowball prioritises psychological momentum over mathematically optimal ordering (the 'avalanche' targets highest interest first). Some behavioural studies suggest focusing on small balances can improve follow-through."],
["Money", "Mr. Market and the margin of safety", "Imagine the market as a moody partner offering daily prices; you can ignore him or take advantage of his mood swings. Buy only when price is well below value, leaving a margin of safety for errors.", "The Intelligent Investor", "Benjamin Graham", "Write your rule for what you’ll do the next time the market drops 20%.", "Prices go up and down like moods. Don't panic — buy only when things are a good deal.", "Graham's Mr. Market allegory treats price volatility as an offer to exploit rather than a signal to obey. The margin of safety — buying well below estimated intrinsic value — protects against errors in analysis and became a cornerstone of value investing."],
["Money", "Money is life energy", "Money is something we trade our life energy for. Calculating your real hourly wage — after work-related costs and time — reveals what purchases truly cost in hours of your life.", "Your Money or Your Life", "Vicki Robin & Joe Dominguez", "Work out your real hourly wage, then price one planned purchase in hours of life.", "Money comes from your time and energy, so spend it on things you really care about.", "Robin and Dominguez redefine money as stored life energy, calculating a 'real hourly wage' net of work-related costs. The exercise reframes consumption decisions in terms of time traded and supports their concept of financial independence."],
["Health", "Sleep is the foundation", "Sleep affects nearly every system of the body and brain, from memory to immunity. Routinely sleeping too little has serious costs; one of the best habits is keeping a regular sleep and wake time, even at weekends.", "Why We Sleep", "Matthew Walker", "Set a fixed wake-up time and a bedtime alarm one hour before lights out.", "Sleeping well helps your body grow and your brain remember.", "Walker, a sleep scientist, surveys evidence linking sleep to memory consolidation, immune function and metabolic health. Some specific claims in the book have been criticised as overstated, but regular sleep timing is broadly supported guidance."],
["Health", "Exercise is the most potent longevity tool", "Of all the tactics for living longer and better, exercise has the strongest effect. Train for the activities you want to still be able to do in your final decade — think of it as preparing for a \"centenarian decathlon\".", "Outlive", "Peter Attia", "Do 20 minutes of exercise you’d like to still be able to do at 90.", "Moving and playing every day keeps your body strong for a long, long time.", "Attia argues exercise has the broadest effect on healthspan, framing training around future capability (the 'centenarian decathlon'). Cardiorespiratory fitness and strength are strongly associated with lower all-cause mortality in observational research."],
["Health", "Exercise fertilises the brain", "Aerobic exercise boosts BDNF, a protein Ratey calls \"Miracle-Gro for the brain\", which supports learning and neuron growth. Movement also helps regulate mood, stress, anxiety and attention.", "Spark", "John J. Ratey", "Take a brisk 10-minute walk before your most demanding task.", "Running and playing help your brain learn and feel happy.", "Ratey reviews research linking aerobic exercise to brain-derived neurotrophic factor (BDNF), neurogenesis and improved mood and attention. 'Miracle-Gro for the brain' is his metaphor; the human evidence is strongest for mood and executive function benefits."],
["Health", "Hara hachi bu", "Okinawans, among the world's longest-lived people, traditionally stop eating when about 80% full. Blue Zones also share daily natural movement, purpose, plant-heavy diets and strong social ties.", "The Blue Zones", "Dan Buettner", "At one meal today, stop when you feel about 80% full.", "Stop eating when your tummy is almost full, not stuffed.", "Hara hachi bu is a Confucian-inspired Okinawan practice of eating until about 80% full. Buettner's Blue Zones research is observational and has been questioned on data quality, but moderate caloric intake is consistent with other nutrition evidence."],
["Health", "Eat food, not too much, mostly plants", "Pollan's rule of thumb: eat real food your great-grandmother would recognise rather than edible food-like products, keep portions moderate, and make plants the bulk of your diet.", "In Defense of Food", "Michael Pollan", "Make one meal mostly plants, from ingredients your great-grandmother would recognise.", "Eat real food like fruits and veggies, and not too much.", "Pollan's maxim critiques 'nutritionism' — reducing food to isolated nutrients — and favours whole foods and dietary patterns. It is a heuristic rather than a clinical guideline, though it aligns with evidence for plant-rich diets."],
["Health", "Breathe through your nose", "Habitual mouth breathing is linked to poorer sleep and other problems. Breathing through the nose — slowly and less — filters and humidifies air and supports better oxygen use.", "Breath", "James Nestor", "Spend five minutes breathing slowly through your nose.", "Breathe through your nose — it's like a filter that cleans the air.", "Nestor synthesises research and experiments on breathing. Nasal breathing filters, warms and humidifies air and is linked to nitric oxide production; the book's broader health claims vary in strength of evidence."],
["Faith & Wisdom", "A gentle answer turns away wrath", "'A soft answer turneth away wrath: but grievous words stir up anger' (KJV). How you answer often decides whether a conflict escalates or cools.", "Proverbs 15:1", "The Bible", "Answer one tense moment today with a soft, calm reply.", "When someone is angry, answer softly and they may calm down.", "Proverbs 15:1 contrasts gentle and harsh speech in typical Hebrew parallelism. The wisdom literature treats speech as morally weighty, and the proverb anticipates modern de-escalation practice: tone often determines whether conflict escalates."],
["Faith & Wisdom", "Iron sharpens iron", "'Iron sharpeneth iron; so a man sharpeneth the countenance of his friend' (KJV). Seek friends who challenge and refine you, and be that friend for others.", "Proverbs 27:17", "The Bible", "Ask a trusted friend for one piece of honest feedback.", "Good friends help each other get better, like two knives sharpening each other.", "Proverbs 27:17 uses the image of metal on metal for mutual refinement through relationship. In wisdom tradition, character formation is communal; friction, honest counsel and accountability are means of growth."],
["Faith & Wisdom", "Trust beyond your own understanding", "'Trust in the LORD with all thine heart; and lean not unto thine own understanding. In all thy ways acknowledge him, and he shall direct thy paths' (KJV). Humility about our limits opens the way to guidance.", "Proverbs 3:5–6", "The Bible", "Bring one decision you’ve been trying to control to prayer or quiet reflection.", "Trust God with all your heart, even when you don't understand.", "Proverbs 3:5–6 sets trust in the LORD against self-reliant understanding. In context it belongs to a father's instruction on wisdom; 'he shall direct thy paths' suggests guidance and a well-ordered life rather than guaranteed ease."],
["Faith & Wisdom", "Go to the ant", "'Go to the ant, thou sluggard; consider her ways, and be wise' (KJV). Having 'no guide, overseer, or ruler', the ant provides in summer and gathers at harvest: diligence without supervision, preparing in good times for lean ones.", "Proverbs 6:6–8", "The Bible", "Do one thing today that prepares you for a leaner season.", "Ants work hard and save food for later, even without a boss. Be like the ant!", "Proverbs 6:6–8 holds up the ant as a model of self-directed diligence and foresight, warning against sloth. Wisdom literature often draws moral lessons from observing nature."],
["Faith & Wisdom", "Pride is the great sin", "Lewis calls pride the essential vice, because it is competitive by nature — it takes no pleasure in having something, only in having more than others. A truly humble person is not thinking about humility, or about themselves, at all.", "Mere Christianity", "C.S. Lewis", "When you catch yourself comparing, celebrate the other person instead.", "Being proud means wanting to be better than others. Being humble means thinking about others.", "In 'The Great Sin', Lewis argues pride is essentially competitive — pleasure in having more than others — and the root of other vices. Humility, for him, is self-forgetfulness rather than low self-esteem."],
["Faith & Wisdom", "Aim at heaven", "Aim at heaven and you will get earth \"thrown in\"; aim at earth and you will get neither. When the highest things are put first, lesser goods find their proper place.", "Mere Christianity", "C.S. Lewis", "Spend the first five minutes of your day on what matters most, before any tasks.", "If you put God first, lots of other good things come too.", "Lewis argues in Mere Christianity that ordering desires toward the eternal makes temporal goods fall into place, echoing Augustine's 'rightly ordered loves' and Matthew 6:33 ('seek first the kingdom')."],
["Faith & Wisdom", "The safest road is the gradual one", "In Screwtape's advice to his nephew, the most effective path to ruin is not dramatic sin but a gentle slope — small compromises and drift without sudden turnings or signposts.", "The Screwtape Letters", "C.S. Lewis", "Identify one small compromise you’ve been drifting into, and stop it today.", "Small wrong choices can lead you far away, one little step at a time.", "In The Screwtape Letters, a senior demon advises his nephew that gradual drift is more effective than dramatic temptation. Lewis's satirical inversion highlights how habits and small compromises shape character."],
["Faith & Wisdom", "What stands in the way becomes the way", "The mind adapts and converts any obstacle to its purpose. The impediment to action advances action — a setback can become the very material you work with.", "Meditations (Book 5)", "Marcus Aurelius", "Treat today’s biggest setback as the task itself: what can you build from it?", "When something blocks you, you can find a new way through it.", "Marcus Aurelius (Meditations 5.20) writes that the mind converts impediments into material for action. This Stoic principle of adaptive reservation — pursuing aims 'with reserve' — underlies modern popularisations like Holiday's."],
["Faith & Wisdom", "Expect difficult people", "Begin each morning telling yourself you will meet meddling, ungrateful, arrogant people. They act from ignorance of good and evil; none of them can truly harm you, and we were made to work together.", "Meditations (Book 2)", "Marcus Aurelius", "Decide in advance how you’ll respond calmly to the most difficult person you’ll see today.", "Some people will be grumpy today. You can still be kind and calm.", "Meditations 2.1 is a morning exercise of premeditation: expecting difficult people so as not to be disturbed. Marcus grounds patience in the Stoic belief that wrongdoing comes from ignorance and that humans are made for cooperation."],
["Faith & Wisdom", "The dichotomy of control", "Some things are within our power — our judgments, desires and actions — and some are not, like our body, reputation and possessions. Peace comes from focusing only on what is up to us.", "Enchiridion", "Epictetus", "Make two lists for a current worry: what’s in my control, and what isn’t.", "Some things you can control, like how you act. Some things you can't, like the weather.", "Epictetus opens the Enchiridion by distinguishing what is 'up to us' (judgements, impulses, desires) from what is not. Stoic tranquillity results from investing desire and aversion only in the former — an idea that influenced cognitive behavioural therapy."],
["Faith & Wisdom", "Life is long if you use it well", "It is not that we have a short time to live, but that we waste much of it. Life is long enough for great things if it is invested well rather than squandered on busyness and the demands of others.", "On the Shortness of Life", "Seneca", "Audit one hour today: where did your time actually go?", "Life is long enough if we use our time well instead of wasting it.", "Seneca's essay to Paulinus argues that people squander time on busyness, ambition and others' demands. True living, for Seneca, involves philosophy and reflection — time spent intentionally rather than reactively."],
["Faith & Wisdom", "A season for everything", "'To every thing there is a season, and a time to every purpose under the heaven' (KJV): 'a time to plant, and a time to pluck up', 'a time to weep, and a time to laugh', 'a time to keep silence, and a time to speak'. Wisdom is discerning which season you are in.", "Ecclesiastes 3:1–8", "The Bible", "Name the season you’re in, and one thing it’s asking of you.", "There's a time for everything — to play, to rest, to be sad and to be happy.", "Ecclesiastes 3:1–8 is a poem of paired opposites expressing the rhythms of life under God's sovereignty. The Teacher's wider reflection explores human limits in understanding time and providence."],
["Learning", "Retrieval beats rereading", "Rereading and highlighting create an illusion of mastery. Actively recalling information — quizzing yourself — strengthens memory far more, even though it feels harder.", "Make It Stick", "Peter C. Brown, Henry L. Roediger III & Mark A. McDaniel", "After reading something, close it and write down everything you remember.", "Instead of reading again, close the book and try to remember. That makes memory stronger!", "Retrieval practice (the testing effect) is among the best-supported findings in learning science: effortful recall strengthens memory traces more than re-exposure. Rereading builds fluency that learners mistake for mastery — a metacognitive illusion."],
["Learning", "Space and interleave practice", "Cramming produces quick, fragile gains. Spacing practice out over time and mixing different problem types feels slower, but produces deeper, more durable learning.", "Make It Stick", "Peter C. Brown, Henry L. Roediger III & Mark A. McDaniel", "Schedule a quick review of something you learned today for three days from now.", "Practise a little bit on different days, and mix things up. You'll remember longer.", "Spacing exploits the forgetting curve described by Ebbinghaus: reviewing after partial forgetting yields stronger retention. Interleaving mixes problem types, improving discrimination between them. Both are 'desirable difficulties' (Bjork) — slower in practice, better for durable learning."],
["Learning", "Focused and diffuse modes", "The brain switches between a focused mode for concentrated work and a diffuse, relaxed mode that makes broader connections. When stuck, step away — a walk or rest lets the diffuse mode work.", "A Mind for Numbers", "Barbara Oakley", "When you get stuck, take a 15-minute walk before trying again.", "When you're stuck, take a break and play. Your brain keeps working on it!", "Oakley contrasts focused attention with a relaxed, diffuse mode associated with broader associative processing. The model popularises research on incubation effects, where stepping away from a problem can aid insight."],
["Learning", "Learn directly", "Learning transfers poorly between contexts, so practise as close as possible to the situation where you will use the skill. To speak a language, speak it; to build projects, build them.", "Ultralearning", "Scott H. Young", "Practise a skill for 20 minutes in the real situation where you’ll use it.", "Want to learn to ride a bike? Practise riding a bike!", "Young's principle addresses the transfer problem: learning often fails to generalise across contexts. Practising in conditions close to real use — 'directness' — minimises the transfer gap that classroom-style learning leaves."],
["Learning", "Deliberate practice", "Expert performance comes from deliberate practice: well-defined stretch goals just beyond your current ability, full concentration, immediate feedback and building mental representations — not mere repetition.", "Peak", "Anders Ericsson & Robert Pool", "Pick one weakness and practise just beyond your ability, with feedback.", "Practise the hard parts with a teacher's help to get really good.", "Ericsson's deliberate practice requires specific stretch goals, focus, expert feedback and refined mental representations. The popular '10,000 hours' gloss misrepresents his work; later meta-analyses suggest practice explains a meaningful but partial share of performance differences."],
["Learning", "Range beats early specialisation", "In complex, unpredictable fields, generalists who sample widely before specialising often outperform early specialists. Breadth builds analogies and flexible thinking.", "Range", "David Epstein", "Spend 30 minutes exploring a field completely unrelated to your own.", "Trying lots of different things can help you find what you love and be creative.", "Epstein argues that in 'wicked' domains, breadth and late specialisation foster analogical thinking and adaptability. He contrasts this with 'kind' domains like chess, where early, narrow practice pays off."],
["Productivity", "Ask the focusing question", "Extraordinary results come from going small. Ask: what is the ONE thing I can do such that by doing it everything else will be easier or unnecessary? Then give that one thing your best hours.", "The ONE Thing", "Gary Keller & Jay Papasan", "Ask the focusing question about this week and write down the answer.", "Ask: what's the one thing that makes everything else easier? Do that first.", "Keller and Papasan propose a focusing question to identify leverage points. The approach resembles Pareto thinking: a small number of actions often drive a disproportionate share of results, so prioritisation beats multitasking."],
["Productivity", "Stack your habits", "Link a new habit to one you already do: “After I [current habit], I will [new habit].” The existing routine becomes a reliable cue for the new behaviour.", "Atomic Habits", "James Clear", "Write one habit stack, e.g. “After I pour my coffee, I will read one page.”", "Add a new habit right after something you already do, like reading after brushing teeth.", "Habit stacking applies implementation intentions — 'if-then' plans studied by Peter Gollwitzer — using an existing routine as a contextual cue. Stable cues are a key driver of automaticity in habit-formation research."],
["Productivity", "The two-minute rule", "When starting a new habit, scale it down until it takes two minutes or less — “read one page”, “put on running shoes”. Master showing up first; a habit must be established before it can be improved.", "Atomic Habits", "James Clear", "Shrink a habit you’ve been avoiding to a two-minute version and do it now.", "Start super small — just two minutes — so it's easy to begin.", "The two-minute rule lowers activation energy so that showing up becomes automatic before intensity increases. It reflects the idea that consistency builds the cue–behaviour association that defines habit."],
["Productivity", "Systems beat goals", "Winners and losers often share the same goals; what differs is their systems. You do not rise to the level of your goals — you fall to the level of your systems, so design the process, not just the target.", "Atomic Habits", "James Clear", "Turn one goal into a daily system: what will you do, when, and where?", "Good habits every day help you more than just wishing for a big goal.", "Clear argues that goals set direction but systems — repeated processes — produce progress. Focusing on systems avoids survivorship bias in goal-setting and the post-goal motivational drop."],
["Productivity", "Schedule your distractions", "Instead of taking breaks from distraction, take breaks from focus. Schedule in advance when you’ll use the internet, and stay offline outside those blocks, to train your ability to concentrate.", "Deep Work", "Cal Newport", "Write down the times you’ll check email and social media today — and stick to them.", "Choose special times to use screens, and focus the rest of the time.", "Newport recommends scheduling internet use so that focus, not distraction, is the default. Constant switching may train a craving for novelty; scheduled blocks rebuild tolerance for sustained concentration."],
["Productivity", "The digital declutter", "Take 30 days off optional technologies, then reintroduce only those that strongly serve something you deeply value, with clear rules for how you’ll use them. Fill the space with high-quality offline activities.", "Digital Minimalism", "Cal Newport", "Delete or log out of one app you open on autopilot for the next week.", "Take a break from apps for a while, then only keep the ones you really love.", "Newport's digital minimalism is a philosophy of technology use: adopt tools only when they strongly support deeply held values. The 30-day declutter is a reset that tests which tools genuinely add value."],
["Productivity", "Work expands to fill the time", "Parkinson’s observation: work expands so as to fill the time available for its completion. Generous deadlines invite bloat; tighter, deliberate limits force focus on what matters.", "Parkinson’s Law (essay)", "C. Northcote Parkinson", "Give one task half the time you’d normally allow, and set a timer.", "If you give yourself all day for a small job, it takes all day!", "C. Northcote Parkinson's 1955 essay in The Economist satirised bureaucratic growth: 'Work expands so as to fill the time available.' The principle is now applied to personal productivity via deliberate time constraints."],
["Productivity", "Beat Resistance by turning pro", "Every creative or meaningful endeavour meets an inner force Pressfield calls Resistance — procrastination, rationalisation, fear. Amateurs wait for inspiration; professionals show up every day regardless.", "The War of Art", "Steven Pressfield", "Sit down at your most important creative work at a fixed time today, inspired or not.", "A sneaky feeling tries to stop you from doing important stuff. Show up anyway!", "Pressfield personifies procrastination and self-sabotage as Resistance, strongest against the most meaningful work. 'Turning pro' means routine and commitment independent of mood — a practical response to the motivation–action gap."],
["Productivity", "You have about four thousand weeks", "An average human life is roughly four thousand weeks. You will never get everything done, so the real skill is choosing what to neglect and embracing the finitude of your time.", "Four Thousand Weeks", "Oliver Burkeman", "Choose one thing to consciously neglect this week so something better gets your time.", "We only have so much time, so choose the most important things.", "Burkeman argues productivity culture promises an impossible mastery of time. Accepting finitude — about 4,000 weeks in an average life — reframes time management as making meaningful trade-offs rather than doing everything."],
["Productivity", "Pick a daily highlight", "Each day, choose one Highlight — a single activity you want to prioritise and protect. It turns a reactive day into one where at least one meaningful thing gets done.", "Make Time", "Jake Knapp & John Zeratsky", "Choose today’s Highlight and put it on your calendar.", "Pick one special thing to do today and make it happen.", "Knapp and Zeratsky, former Google designers, propose a daily Highlight to anchor intention. It is a simple prioritisation device that complements energy management and distraction barriers."],
["Productivity", "Distraction starts inside", "Most distraction is an escape from uncomfortable internal states like boredom or anxiety. Master internal triggers, timebox your day around your values, and remove external triggers that don’t serve you.", "Indistractable", "Nir Eyal", "Next time you reach for your phone, name the feeling you’re trying to escape.", "We grab phones when we feel bored or worried. Notice the feeling first.", "Eyal reframes distraction as an attempt to escape internal discomfort. His model — master internal triggers, make time for traction, hack back external triggers, prevent distraction with pacts — emphasises self-awareness over blaming technology."],
["Productivity", "Know thy time", "Effective executives start not with tasks but with their time. They record where it actually goes, cut what doesn’t need doing, and consolidate their discretionary time into large usable blocks.", "The Effective Executive", "Peter F. Drucker", "Log how you spend your time today in 30-minute blocks.", "Write down how you spend your time. You might be surprised!", "Drucker argued that time is the scarcest resource and that executives misjudge how they use it. Logging time, eliminating low-value activities and consolidating discretionary time into blocks are his practical steps."],
["Productivity", "Sharpen the saw", "Habit 7 is renewing yourself in four dimensions — physical, mental, social/emotional and spiritual. A woodcutter too busy to sharpen his saw works harder and gets less done.", "The 7 Habits of Highly Effective People", "Stephen R. Covey", "Schedule one renewal activity today: exercise, reading, a friend or quiet time.", "Take care of your body, mind, friends and heart, so you can keep doing good things.", "Covey's seventh habit emphasises renewal across physical, mental, social-emotional and spiritual dimensions. It reflects a sustainability principle: capacity must be maintained to sustain output."],
["Productivity", "The habit loop", "Habits run on a loop of cue, routine and reward. To change a habit, keep the same cue and reward but insert a new routine — and watch for keystone habits that trigger wider change.", "The Power of Habit", "Charles Duhigg", "Pick one bad habit and identify its cue and the reward you’re really seeking.", "Habits have three parts: a signal, an action and a reward.", "Duhigg popularises research on the cue–routine–reward loop and the role of the basal ganglia in automatic behaviour. His 'golden rule' of habit change keeps the cue and reward while substituting the routine."],
["Mindset", "Praise the process", "Dweck’s research found that praising children for intelligence made them avoid challenges, while praising effort and strategy made them seek out harder problems. Praise the process, not the person.", "Mindset", "Carol S. Dweck", "Give someone praise today for their effort or strategy, not their talent.", "Say “you worked really hard!” instead of “you're so smart!”", "Dweck's praise studies (with Claudia Mueller) found that praising ability led children to avoid challenges and attribute failure to low ability, while process praise encouraged persistence — a foundational finding for growth-mindset interventions."],
["Mindset", "Separate your tasks", "Drawing on Alfred Adler, ask “whose task is this?” Others’ opinions of you are their task, not yours. Much interpersonal suffering comes from intruding on others’ tasks or letting them intrude on yours.", "The Courage to Be Disliked", "Ichiro Kishimi & Fumitake Koga", "Name one worry about what someone thinks of you, and let it be their task.", "What other people think is their job. Your job is how you act.", "Kishimi and Koga's dialogue presents Adlerian psychology's 'separation of tasks': determining whose responsibility a choice belongs to. It aims to free people from approval-seeking while still caring about community."],
["Mindset", "Vulnerability is courage", "Vulnerability — uncertainty, risk and emotional exposure — is not weakness; it is the birthplace of love, belonging, creativity and courage. Dare greatly by showing up when you can’t control the outcome.", "Daring Greatly", "Brené Brown", "Share one honest thing you’ve been holding back with someone you trust.", "Being brave means trying even when you might feel scared or shy.", "Brown's research on shame and vulnerability argues that emotional exposure enables connection, creativity and courage. She borrows the 'man in the arena' image from Theodore Roosevelt to celebrate trying despite risk of failure."],
["Mindset", "Explain setbacks wisely", "Optimists explain bad events as temporary, specific and not entirely their fault; pessimists see them as permanent, pervasive and personal. Explanatory style can be learned by disputing your own pessimistic thoughts.", "Learned Optimism", "Martin E. P. Seligman", "Take one recent setback and write how it’s temporary and limited to one area.", "When something goes wrong, remember it won't last forever and it's not all your fault.", "Seligman's explanatory style has three dimensions — permanence, pervasiveness and personalisation. Learned optimism uses cognitive techniques (the ABCDE model) to dispute pessimistic explanations, building on his earlier research on learned helplessness."],
["Mindset", "Find flow", "Flow — deep, enjoyable absorption — occurs when a challenge stretches your skills, goals are clear and feedback is immediate. Too easy brings boredom; too hard brings anxiety.", "Flow", "Mihaly Csikszentmihalyi", "Make one routine task slightly harder or set a clear goal for it to invite flow.", "When a game is just hard enough, you can get lost in the fun.", "Csikszentmihalyi's flow is optimal experience when challenge and skill are balanced and high, with clear goals and immediate feedback. Flow is intrinsically rewarding (autotelic) and appears across activities from surgery to rock climbing."],
["Mindset", "Always be a student", "Ego tells us we already know. Staying a student — seeking teachers, feedback and criticism — keeps you learning and protects you from the arrogance that often follows early success.", "Ego Is the Enemy", "Ryan Holiday", "Ask someone more experienced for advice on something you think you’ve mastered.", "Always keep learning, even when you're good at something.", "Holiday warns that ego — an unhealthy belief in our own importance — blocks learning. Staying a student counters overconfidence, a known risk after early success."],
["Mindset", "The 40% rule", "Goggins argues that when your mind says you’re done, you’ve typically only tapped about 40% of your capacity. Callousing the mind through voluntary discomfort expands what you believe is possible.", "Can’t Hurt Me", "David Goggins", "When you want to quit a workout or task today, push a little further than you planned.", "When you think you're too tired, you can often do a little more.", "Goggins's '40% rule' is a motivational heuristic, not a measured physiological constant. It resonates with research on perceived exertion and central governor models, which suggest fatigue is regulated partly by the brain to protect reserves."],
